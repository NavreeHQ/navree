[package]
name = "crm-core"
description = "Navree CRM: the shared core (models, factories, enums, the crm migrations, abilities, platform modules)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Application code: unsafe stays forbidden, but undocumented items are fine.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
chrono = { workspace = true }
navree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The tests run on SQLite files (the driver is opt-in).
navree = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true }
