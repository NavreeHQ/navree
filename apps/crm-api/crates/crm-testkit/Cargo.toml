[package]
name = "crm-testkit"
description = "Navree CRM: TestCrm, a booted CRM with the demo accounts for feature tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
chrono = { workspace = true }
crm-core = { path = "../crm-core" }
http = { workspace = true }
# The kit boots the CRM on SQLite files (the driver is opt-in).
navree = { workspace = true, features = ["sqlite"] }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
