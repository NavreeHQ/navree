[package]
name = "crm-api"
description = "Navree CRM API: the reference application built on the Navree framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "crm-api"
path = "src/main.rs"

# Application code: unsafe stays forbidden, but undocumented items are fine.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
chrono = { workspace = true }
crm-activities = { path = "crates/crm-activities" }
crm-companies = { path = "crates/crm-companies" }
crm-core = { path = "crates/crm-core" }
crm-deals = { path = "crates/crm-deals" }
crm-users = { path = "crates/crm-users" }
navree = { workspace = true }
sea-orm = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
crm-testkit = { path = "crates/crm-testkit" }
tokio = { workspace = true }
