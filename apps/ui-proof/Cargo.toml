[package]
name = "ui-proof"
description = "Proof pages for navree-ui: a form, a 1,000-row table, a dashboard and every component in its states."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ui-proof"
path = "src/main.rs"

# Application code: unsafe stays forbidden, but undocumented items are fine.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
# A path rather than `workspace = true`: on Rust 1.95, the minimum version, Cargo
# cannot turn off default features that the workspace entry leaves on.
navree = { path = "../../crates/navree", default-features = false, features = ["ui", "ui-image", "validation-phone", "storage"] }
serde = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
navree = { path = "../../crates/navree", default-features = false, features = ["ui", "session", "crypto", "testing"] }
serde_json = { workspace = true }

[features]
# A development build: Logbook at /_logbook when UI_PROOF_LOGBOOK is set. Off
# in the release binary, so a speed measurement carries none of its code.
logbook = ["navree/logbook"]
