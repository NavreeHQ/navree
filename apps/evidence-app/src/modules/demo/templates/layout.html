<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Navree Evidence{% endblock %}</title>
<style>
body { margin: 0; padding: 24px 12px; background: #f3f5f4; color: #1d2421; font-family: Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.5; }
.wrap { max-width: 560px; margin: 0 auto; }
.brand { font-size: 13px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; color: #0f7a46; margin: 0 0 12px 4px; }
.card { background: #ffffff; border: 1px solid #dde3df; border-radius: 6px; padding: 28px 32px; }
h1 { font-size: 22px; line-height: 1.25; margin: 0 0 16px 0; }
h2 { font-size: 16px; margin: 24px 0 8px 0; }
p { margin: 0 0 14px 0; }
.button { display: inline-block; background: #0f7a46; color: #ffffff; text-decoration: none; padding: 10px 18px; border-radius: 4px; font-weight: bold; }
table { width: 100%; border-collapse: collapse; margin: 8px 0 16px 0; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #5d6b64; border-bottom: 1px solid #dde3df; padding: 6px 0; }
td { padding: 8px 0; border-bottom: 1px solid #eef1ef; }
.num { text-align: right; }
.total td { font-weight: bold; border-bottom: none; }
.muted { color: #5d6b64; font-size: 13px; }
.footer { color: #7a8780; font-size: 12px; margin: 16px 4px 0 4px; }
</style>
</head>
<body>
<div class="wrap">
<p class="brand">Navree Evidence</p>
<div class="card">
{% block content %}{% endblock %}
</div>
<p class="footer">You are receiving this message because of your account with Navree Evidence. Agra Logistics, Gulati Research and Indrani Software share this service.</p>
</div>
</body>
</html>
