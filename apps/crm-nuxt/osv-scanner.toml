ignoreUntil = 2027-01-31
reason = "deepmerge 4.3.1 is the latest release and the advisory lists no fix, so it is patched here: patches/deepmerge@4.3.1.patch (pnpm-workspace.yaml, patchedDependencies) makes mergeObject skip the __proto__, constructor and prototype keys, and tests/unit/deepmerge-patch.test.ts fails if the patch is not applied. The scanner reads the version, not the lockfile's patch_hash. It is build-time tooling only: @rollup/plugin-node-resolve 16.0.3 (the latest, under nitropack) is its one dependent and calls it once, as deepMerge({}, defaults) on its own constant defaults, while bundling the server; no request or user data reaches it. Drop this entry once deepmerge ships a fix."
