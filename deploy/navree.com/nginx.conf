# navree.com: the Navree website and documentation, static files.
# Installed as /etc/nginx/sites-available/navree.com by root-setup.sh.
# The live release is /home/forge/navree.com/current (see deploy.sh).

# Cache lifetime for icons, images and fonts outside /_next/static/. Next
# links the icons with a content hash in the query string
# (/icon.svg?icon.1msq2tnpbd5b3.svg), so a request with a query string is for
# one exact version and can be kept for a year; a bare request (/favicon.ico,
# /og.png, /images/...) is kept for a week.
map $args $navree_asset_cache {
    ""      "public, max-age=604800";
    default "public, max-age=31536000, immutable";
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name navree.com www.navree.com;
    location / { return 301 https://navree.com$request_uri; }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.navree.com;

    ssl_certificate     /etc/letsencrypt/live/navree.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navree.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://navree.com$request_uri;
}

# The site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name navree.com;

    ssl_certificate     /etc/letsencrypt/live/navree.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navree.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /home/forge/navree.com/current;
    index index.html;
    error_page 404 /404.html;
    # A directory with no index.html in it (a docs section that has no page of
    # its own) is a missing page, not a forbidden one.
    error_page 403 =404 /404.html;

    # The old address of the performance page, as a real redirect.
    location = /benchmarks/ { return 301 /performance/; }

    # The live theme demo (apps/theme-demo, see demo-ui.conf): /demo/ui/ and the
    # toolkit's files under /_navree/ui/. The pattern matches no file until
    # demo-ui-setup.sh installs the snippet, so this line is safe without it.
    include /etc/nginx/snippets/navree.com-demo-ui*.conf;

    # Pages are folders with an index.html (Next.js export, trailingSlash).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Content-hashed build assets (scripts, styles, fonts) never change. `^~`
    # makes this prefix win over the regex locations below, which would
    # otherwise catch the fonts and images under /_next/static/media/.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The launch film and its poster. Each release's media/ is a link to
    # /home/forge/navree.com/shared/media/ (deploy.sh). nginx answers a Range
    # request with 206 and sends Accept-Ranges: bytes on its own, which a
    # browser needs to seek in the film (Safari needs it to play at all). The
    # files are already compressed, so no gzip. Their names carry no version,
    # so a week, then a conditional request (ETag, Last-Modified) that costs
    # nothing; a changed film is a new name in content/media.json or a purge
    # of /media/* in Cloudflare. `^~` makes this prefix win over the regex
    # location below, which would give the posters a different lifetime.
    location ^~ /media/ {
        gzip off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(?:svg|png|ico|webp|avif|jpg|jpeg|woff2|webmanifest)$ {
        add_header Cache-Control $navree_asset_cache;
    }

    # Docs for agents: every docs page and skill as Markdown, shown in the
    # browser rather than downloaded, and readable from any origin.
    location ~* \.md$ {
        types { text/markdown md; }
        charset utf-8;
        charset_types text/markdown;
        add_header Access-Control-Allow-Origin "*";
    }

    # The changelog's Atom feed, served as Atom rather than generic XML.
    location = /changelog/feed.xml {
        types { }
        default_type application/atom+xml;
        charset utf-8;
        charset_types application/atom+xml;
    }

    location ~ ^/(llms|llms-full)\.txt$ {
        charset utf-8;
        add_header Access-Control-Allow-Origin "*";
    }
}
