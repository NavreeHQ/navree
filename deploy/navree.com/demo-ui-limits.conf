# The live theme demo's request limit, in nginx's http block: installed as
# /etc/nginx/conf.d/navree.com-demo-ui-limits.conf by demo-ui-setup.sh, for
# demo-ui.conf to use.
#
# The visitor is the address Cloudflare names in CF-Connecting-IP, else the
# peer's own. Ten requests a second each, with a burst of forty for a page and
# its files: about a hundred times what a reader of the builder sends.

map $http_cf_connecting_ip $navree_demo_client {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $navree_demo_client zone=navree_demo:10m rate=10r/s;
