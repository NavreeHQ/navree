# The live theme demo (apps/theme-demo) on navree.com: its pages under /demo/ui/,
# and the toolkit's files and theme menu route under /_navree/ui/, passed to the
# app on 127.0.0.1:8095 (the pm2 process navree-theme-demo).
#
# Installed as /etc/nginx/snippets/navree.com-demo-ui.conf by demo-ui-setup.sh;
# nginx.conf's navree.com server block includes it. It needs the zone and the map
# of demo-ui-limits.conf in the http block.
#
# `^~` makes these prefixes win over the site's regex locations, which would
# otherwise serve the toolkit's fonts and icons from the static release.

location ^~ /demo/ui/ {
    limit_req zone=navree_demo burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The visitor's address, as Cloudflare names it: the app counts its rate
    # limit per visitor, and trusts these headers from this machine only.
    proxy_set_header X-Real-IP $navree_demo_client;
    proxy_set_header X-Forwarded-For $navree_demo_client;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

location ^~ /_navree/ui/ {
    limit_req zone=navree_demo burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $navree_demo_client;
    proxy_set_header X-Forwarded-For $navree_demo_client;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
