# Headers every response from navree.com carries, pages and files alike.
#
# Installed as /etc/nginx/snippets/navree.com-security.conf by root-setup.sh
# and demo-ui-setup.sh; nginx.conf includes it in every location that sets a
# header of its own. nginx drops the headers of an outer level as soon as an
# inner level sets one, so each location includes this file itself.
#
# The Content-Security-Policy of the pages is in nginx.conf, in the location
# that serves them.

# HTTPS only for a year. No includeSubDomains and no preload: those commit
# every subdomain of navree.com to HTTPS, and that is a decision for later.
add_header Strict-Transport-Security "max-age=31536000" always;

# A file is used as the type the server says it is: the Markdown copies and
# the text files are never run as a page.
add_header X-Content-Type-Options "nosniff" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The site asks for none of these.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
