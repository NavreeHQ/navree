# Navree's front-end packages. Each folder here is one npm package:
#   client  @navree/client  the typed client, the error shape, list queries, pagination, real time, operations
#   bff     @navree/bff     the framework-neutral backend-for-frontend (httpOnly token cookies, refresh, CSRF)
#   next    @navree/next    Next.js: route handlers, auth(), middleware, abilities, channels, operations, DataTable
#   nuxt    @navree/nuxt    Nuxt: a module with Nitro BFF routes and composables, DataTable
#   theme   @navree/theme   navree.com's dark theme: CSS variables, the Tailwind 4 preset, fonts
packages:
  - "*"

# Dependencies' install scripts stay off unless listed here.
allowBuilds:
  esbuild: false
  "@parcel/watcher": false
  unrs-resolver: false
  vue-demi: false

# node-forge 1.4.2 is the fix for GHSA-86w9-cpqp-85rv (see overrides).
minimumReleaseAgeExclude:
  - 'node-forge@1.4.2'

overrides:
  # listhen (nuxt dev's HTTPS certificates) asks for node-forge ^1.4.0;
  # 1.4.0 accepts forged RSA PKCS#1 v1.5 signatures (GHSA-86w9-cpqp-85rv).
  node-forge: 1.4.2

patchedDependencies:
  # Nitro's bundler (@rollup/plugin-node-resolve 16.0.3, under nuxt) uses deepmerge
  # 4.3.1, the latest release, whose mergeObject lets a `__proto__` key set the merged
  # object's prototype (GHSA-gcqx-w48m-w2h4, no fixed release). The patch skips the
  # `__proto__`, `constructor` and `prototype` keys; nuxt/src/deepmerge-patch.test.ts
  # checks it is applied. Drop it once deepmerge ships a fix.
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
