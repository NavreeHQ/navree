reason = "nuxt and @nuxt/nitro-server 4.6.4 (@navree/nuxt's development and test install) are patched (the advisory: fixed in nuxt@4.6.2). Its OSV record also lists Nuxt 3, which gets no fix, as a range with only an 'introduced: 3.0.0' event (the '< 4.0.0' bound is only in database_specific), so the scanner matches every version from 3.0.0 on, the fixed ones included. Drop this entry once the record closes that range."

