[[IgnoredVulns]]
id = "GHSA-vjh5-4x84-xrqp"
ignoreUntil = 2027-01-31
reason = "nuxt and @nuxt/nitro-server 4.6.3 (@navree/nuxt's development and test install) are patched (the advisory: fixed in nuxt@4.6.2). Its OSV record also lists Nuxt 3, which gets no fix, as a range with only an 'introduced: 3.0.0' event (the '< 4.0.0' bound is only in database_specific), so the scanner matches every version from 3.0.0 on, the fixed ones included. Drop this entry once the record closes that range."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-31
reason = "deepmerge 4.3.1 is the latest release and the advisory lists no fix, so it is patched here: patches/deepmerge@4.3.1.patch (pnpm-workspace.yaml, patchedDependencies) makes mergeObject skip the __proto__, constructor and prototype keys, and nuxt/src/deepmerge-patch.test.ts fails if the patch is not applied. The scanner reads the version, not the lockfile's patch_hash. It is build-time tooling only, in @navree/nuxt's development and test install: @rollup/plugin-node-resolve 16.0.3 (the latest, under nitropack) is its one dependent and calls it once, as deepMerge({}, defaults) on its own constant defaults, while bundling the server; no request or user data reaches it. Drop this entry once deepmerge ships a fix."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "Fixed only in minimatch 11.0.1. The one line left is minimatch 5.1.9, pinned exactly by @redocly/openapi-core 1.34.22 (the last 1.x), which openapi-typescript 7.13.0 (the latest, @navree/client's development install) needs; it calls minimatch's default export, which minimatch 11 does not have, so forcing 11 breaks it. The lines under Nitro's bundler tooling (glob 10 and 13, minimatch 9 and 10) are moved to glob 14 and minimatch 11 by the overrides in pnpm-workspace.yaml. Not reachable with attacker input: openapi-typescript runs only on a developer machine, to generate the client's types, and never in a published package, and the only patterns Redocly matches with minimatch come from the project's own Redocly settings, which are trusted. Drop this entry once openapi-typescript moves to a Redocly release that no longer uses minimatch 5."
