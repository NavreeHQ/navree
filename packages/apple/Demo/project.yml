# The demo app, as a text description: `xcodegen generate` in this folder
# writes NavreeDemo.xcodeproj (never committed).
name: NavreeDemo
options:
  bundleIdPrefix: com.navree
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The runtime core is built for Apple silicon only, so a simulator build
    # leaves out an Intel Mac's.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
packages:
  NavreeNative:
    path: ..
targets:
  NavreeDemo:
    type: application
    platform: iOS
    sources:
      - path: NavreeDemo
        excludes: ["*.icon"]
      # The app's icon and the one a person may choose instead, each an Icon
      # Composer file kept whole.
      - path: NavreeDemo/AppIcon.icon
        type: file
        buildPhase: resources
      - path: NavreeDemo/AppIconIndigo.icon
        type: file
        buildPhase: resources
      # The toolkit's own stylesheets, for the recorded web page.
      - path: ../../../crates/navree-ui/dist/navree-ui.css
        buildPhase: resources
      - path: ../../../crates/navree-ui/dist/charts-styles.css
        buildPhase: resources
    dependencies:
      - package: NavreeNative
        product: NavreeNative
    # Who signs the demo and with what: nobody, unless a team fills in
    # Signing/Signing.local.xcconfig (see Signing/Signing.xcconfig).
    configFiles:
      Debug: Signing/Signing.xcconfig
      Release: Signing/Signing.xcconfig
    info:
      path: Generated/NavreeDemo-Info.plist
      properties:
        CFBundleDisplayName: Charkha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NavreeOrigin: http://127.0.0.1:8095
        # Plain http only to this machine, for a store demo run locally; an
        # app's real origin is https with no exception.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # What the build is signed with, as the shell reads it: empty unless
        # the team's signing says so.
        NavreeSignedWith: $(NAVREE_SIGNED_WITH)
        NavreeAssociatedDomain: $(NAVREE_ASSOCIATED_DOMAIN)
        CFBundleURLTypes:
          - CFBundleURLName: com.navree.demo
            CFBundleURLSchemes: [charkha]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NAVREE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconIndigo
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  # The same demo as a Mac app of its own (not the iPad app on a Mac): the
  # sidebar, the menu bar's commands, a Settings window, windows that restore.
  NavreeDemoMac:
    type: application
    platform: macOS
    sources:
      - path: NavreeDemo
        excludes: ["*.icon"]
      - path: NavreeDemoMac
      - path: NavreeDemo/AppIcon.icon
        type: file
        buildPhase: resources
      - path: ../../../crates/navree-ui/dist/navree-ui.css
        buildPhase: resources
      - path: ../../../crates/navree-ui/dist/charts-styles.css
        buildPhase: resources
    dependencies:
      - package: NavreeNative
        product: NavreeNative
    info:
      path: Generated/NavreeDemoMac-Info.plist
      properties:
        CFBundleDisplayName: Charkha
        CFBundleName: Charkha
        # The version the About window shows, from the project.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NavreeOrigin: http://127.0.0.1:8095
        LSApplicationCategoryType: public.app-category.business
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.navree.demo
            CFBundleURLSchemes: [charkha]
    # Not sandboxed: the demo reads answers from a folder named at launch.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.navree.demo.mac
        PRODUCT_NAME: Charkha
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
  # The same Mac demo built with LSUIElement: in the menu bar only unless the
  # person chooses the Dock, with no Dock icon at launch.
  NavreeDemoMenuBar:
    type: application
    platform: macOS
    sources:
      - path: NavreeDemo
        excludes: ["*.icon"]
      - path: NavreeDemoMac
      - path: NavreeDemo/AppIcon.icon
        type: file
        buildPhase: resources
      - path: ../../../crates/navree-ui/dist/navree-ui.css
        buildPhase: resources
      - path: ../../../crates/navree-ui/dist/charts-styles.css
        buildPhase: resources
    dependencies:
      - package: NavreeNative
        product: NavreeNative
    info:
      path: Generated/NavreeDemoMenuBar-Info.plist
      properties:
        CFBundleDisplayName: Charkha Bar
        CFBundleName: Charkha Bar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NavreeOrigin: http://127.0.0.1:8095
        NavreePresence: menuBar
        LSApplicationCategoryType: public.app-category.business
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A scheme of its own, so the two Mac demos' sign-ins come back apart.
        CFBundleURLTypes:
          - CFBundleURLName: com.navree.demo.menubar
            CFBundleURLSchemes: [charkhabar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.navree.demo.menubar
        PRODUCT_NAME: CharkhaBar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
  NavreeDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NavreeDemoUITests
    dependencies:
      - target: NavreeDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.navree.demo.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  NavreeDemoMac:
    build:
      targets:
        NavreeDemoMac: all
  NavreeDemoMenuBar:
    build:
      targets:
        NavreeDemoMenuBar: all
  NavreeDemo:
    build:
      targets:
        NavreeDemo: all
        NavreeDemoUITests: [test]
    test:
      config: Debug
      targets:
        - NavreeDemoUITests
