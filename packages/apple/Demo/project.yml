# The demo app, as a text description: `xcodegen generate` in this folder
# writes NavreeDemo.xcodeproj (never committed).
name: NavreeDemo
options:
  bundleIdPrefix: com.navree
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The runtime core is built for Apple silicon only, so a simulator build
    # leaves out an Intel Mac's.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
packages:
  NavreeNative:
    path: ..
targets:
  NavreeDemo:
    type: application
    platform: iOS
    sources:
      - path: NavreeDemo
      # The toolkit's own stylesheets, for the recorded web page.
      - path: ../../../crates/navree-ui/dist/navree-ui.css
        buildPhase: resources
      - path: ../../../crates/navree-ui/dist/charts-styles.css
        buildPhase: resources
    dependencies:
      - package: NavreeNative
        product: NavreeNative
    info:
      path: Generated/NavreeDemo-Info.plist
      properties:
        CFBundleDisplayName: Charkha
        NavreeOrigin: http://127.0.0.1:8095
        # Plain http only to this machine, for a store demo run locally; an
        # app's real origin is https with no exception.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.navree.demo
            CFBundleURLSchemes: [charkha]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.navree.demo
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  # The same demo as a Mac app of its own (not the iPad app on a Mac): the
  # sidebar, the menu bar's commands, a Settings window, windows that restore.
  NavreeDemoMac:
    type: application
    platform: macOS
    sources:
      - path: NavreeDemo
      - path: NavreeDemoMac
      - path: ../../../crates/navree-ui/dist/navree-ui.css
        buildPhase: resources
      - path: ../../../crates/navree-ui/dist/charts-styles.css
        buildPhase: resources
    dependencies:
      - package: NavreeNative
        product: NavreeNative
    info:
      path: Generated/NavreeDemoMac-Info.plist
      properties:
        CFBundleDisplayName: Charkha
        CFBundleName: Charkha
        NavreeOrigin: http://127.0.0.1:8095
        LSApplicationCategoryType: public.app-category.business
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.navree.demo
            CFBundleURLSchemes: [charkha]
    # Not sandboxed: the demo reads answers from a folder named at launch.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.navree.demo.mac
        PRODUCT_NAME: Charkha
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
  NavreeDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NavreeDemoUITests
    dependencies:
      - target: NavreeDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.navree.demo.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  NavreeDemoMac:
    build:
      targets:
        NavreeDemoMac: all
  NavreeDemo:
    build:
      targets:
        NavreeDemo: all
        NavreeDemoUITests: [test]
    test:
      config: Debug
      targets:
        - NavreeDemoUITests
