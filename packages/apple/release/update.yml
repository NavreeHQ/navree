# The workflow of the Swift package's repository (NavreeHQ/navree-swift), kept
# here and copied there once as .github/workflows/update.yml: it commits and
# tags the package of each release of Navree, which release.yml's
# apple-package job made and attached to the release, then publish-release
# sends `navree-release` with the version.
#
# Set up once:
#
# 1. The repository NavreeHQ/navree-swift, public, with a `main` branch (an
#    empty first commit), and this file at .github/workflows/update.yml.
# 2. In NavreeHQ/navree, the repository variable SWIFT_PACKAGE_REPO =
#    NavreeHQ/navree-swift.
# 3. The secret RELEASE_DISPATCH_TOKEN of NavreeHQ/navree given access to that
#    repository too (its Contents read and write permission, as for the
#    website and the skeleton).
#
# A version already tagged is left as it is. Run it by hand (workflow_dispatch)
# for a release made before the set-up.
name: Update

on:
  repository_dispatch:
    types: [navree-release]
  workflow_dispatch:
    inputs:
      version:
        description: The released version of Navree, for example 1.5.0
        required: true

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    name: The package of the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check the version
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a version: '$VERSION'" >&2; exit 1 ;;
          esac

      - name: Is it tagged already
        id: tagged
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::notice::$VERSION is tagged already; nothing to do"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the package from the release
        if: steps.tagged.outputs.done != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "v$VERSION" --repo NavreeHQ/navree \
            --pattern "navree-swift-$VERSION.tar.gz*" --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum -c "navree-swift-$VERSION.tar.gz.sha256")

      - name: Commit and tag it
        if: steps.tagged.outputs.done != 'true'
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf "$RUNNER_TEMP/release/navree-swift-$VERSION.tar.gz" --strip-components=1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --allow-empty --message "Navree $VERSION"
          git tag "$VERSION"
          git push origin "HEAD:main" "refs/tags/$VERSION"
          gh release create "$VERSION" --title "Navree $VERSION" \
            --notes "The Apple client of Navree $VERSION: https://github.com/NavreeHQ/navree/releases/tag/v$VERSION"
