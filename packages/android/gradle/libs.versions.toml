# Every version is exact. The Compose BOM is the newest one whose libraries
# compile against platform 36; the ones after it need platform 37.
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
compose-bom = "2026.06.01"
# The last Material 3 build with the Expressive components that compiles
# against platform 36 (the next one needs 37). Only `design/expressive`
# calls what is Expressive, so a rename costs one file.
material3 = "1.5.0-alpha18"
activity = "1.13.0"
browser = "1.10.0"
credentials = "1.6.0"
googleid = "1.2.1"
coroutines = "1.11.0"
serialization = "1.13.0"
# 5.5 needs platform 37, like the Compose releases after this BOM.
okhttp = "5.4.0"
junit = "4.13.2"
test-runner = "1.7.0"
test-core = "1.7.0"
test-junit = "1.3.0"
firebase-messaging = "26.0.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-messaging" }
junit = { module = "junit:junit", version.ref = "junit" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-core = { module = "androidx.test:core", version.ref = "test-core" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
