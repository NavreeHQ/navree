; Loaded last (zzz-) over the image's www.conf, docker.conf and zz-docker.conf.
; Errors go to the container's stderr (docker.conf); the Dockerfile removes
; docker.conf's per-request access log.

[www]
; nginx talks to FPM over a Unix socket in the same container.
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; A child serves one request at a time and holds at most one PostgreSQL
; connection (opened per request), so the children are both the concurrency
; limit and the connection count. Requests spend much of their time waiting
; on the database, so 8 per CPU on 8 CPUs: 64, the benchmark's connection cap.
pm = static
pm.max_children = 64
