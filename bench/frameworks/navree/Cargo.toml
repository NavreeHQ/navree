[package]
name = "navree-bench"
description = "The benchmark API (bench/SPEC.md) as a Navree application."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

# A project of its own (the repository's workspace excludes `bench`).
[workspace]

[[bin]]
name = "navree-bench"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The facade with the modules this API uses: auth (which brings http, db,
# crypto, validation and the crates they build on), log, and navree-db's
# PostgreSQL driver.
navree = { path = "../../../crates/navree", default-features = false, features = ["auth", "log", "orm", "postgres"] }

# Derive macros name their own crates, so a Navree app depends on them directly
# (same versions and features as the Navree workspace).
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
