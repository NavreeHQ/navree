spring.application.name=spring-bench
spring.main.banner-mode=off

# Web: Spring MVC on embedded Tomcat, one virtual thread per request.
server.address=0.0.0.0
server.port=8080
spring.threads.virtual.enabled=true

# Database: HikariCP, one pool of 64 connections (the benchmark's total budget).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=64

# JPA: the schema already exists; no session held open for the view.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JSON: reject 10.5 for an integer field instead of truncating it.
spring.jackson.deserialization.accept-float-as-int=false

# Auth: HS256 access tokens issued by Navree.
bench.jwt.secret=${JWT_SECRET}
bench.jwt.issuer=${JWT_ISSUER:navree}

# Production logging: warnings only, no request logging.
logging.level.root=WARN
