[project]
name = "bench-fastapi"
version = "0.1.0"
description = "Navree benchmark: FastAPI + SQLAlchemy 2 (async ORM, asyncpg) + PyJWT"
requires-python = "==3.14.*"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "pyjwt>=2.15.1",
]

[tool.uv]
package = false
