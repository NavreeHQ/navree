[package]
name = "bench-axum"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "derive", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
