[package]
name = "navis-bench"
description = "The benchmark API (bench/SPEC.md) as a Navis application."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

# A project of its own (the repository's workspace excludes `bench`).
[workspace]

[[bin]]
name = "navis-bench"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The facade with the modules this API uses: auth (which brings http, db,
# crypto, validation and the crates they build on), log, and navis-db's
# PostgreSQL driver.
navis = { path = "../../../crates/navis", default-features = false, features = ["auth", "log", "postgres"] }

# Derive macros name their own crates, so a Navis app depends on them directly
# (same versions and features as the Navis workspace).
chrono = { version = "0.4.45", features = ["serde"] }
garde = { version = "0.23.0", features = ["derive", "serde"] }
rand = "0.10.3"
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "with-chrono", "with-uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
