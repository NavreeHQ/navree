[package]
name = "navree-schedule"
description = "Navree ScheduleModule: cron schedules, overlap prevention and single-node runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
## Runs the PostgreSQL suite (`NAVREE_TEST_POSTGRES_URL`).
postgres = ["navree-db/postgres"]
## Runs the MySQL suite (`NAVREE_TEST_MYSQL_URL`).
mysql = ["navree-db/mysql"]

[dependencies]
chrono = { workspace = true }
futures-util = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-db = { workspace = true }
navree-kernel = { workspace = true }
navree-telemetry = { workspace = true }
navree-time = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
chrono-tz = { workspace = true }
navree-testing = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
