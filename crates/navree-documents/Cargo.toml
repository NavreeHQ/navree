[package]
name = "navree-documents"
description = "Navree DocumentsModule: PDF from HTML templates or a typed builder, DOCX output, and PDF merge, stamp and text extraction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND OFL-1.1"
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "pdf", "docx", "documents"]
categories = ["rendering", "text-processing"]
readme = "README.md"
include = ["src/**", "fonts/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
features = ["chrome", "docx", "native", "operations"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[features]
default = ["native", "chrome", "docx"]
## The native PDF engine: HTML templates and `PdfDocument` laid out in
## process, with the bundled Noto fonts.
native = ["dep:krilla", "dep:harfrust", "dep:skrifa", "dep:unicode-bidi", "dep:icu_segmenter"]
## HTML to PDF in headless Chrome over the DevTools protocol.
chrome = ["dep:tokio-tungstenite", "dep:futures-util", "dep:tempfile", "dep:mime_guess"]
## DOCX documents: the writer, and reading files back within limits.
docx = ["dep:quick-xml", "dep:zip"]
## Queued renders behind an operation of navree-queue
## (`Documents::queue_operation`). Off by default: the `navree` facade
## turns it on when its `queue` feature is on too.
operations = ["dep:navree-queue", "dep:navree-db"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true, optional = true }
harfrust = { workspace = true, optional = true }
http = { workspace = true }
icu_segmenter = { workspace = true, optional = true }
krilla = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-db = { workspace = true, optional = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
navree-pdf = { workspace = true }
navree-queue = { workspace = true, optional = true }
navree-storage = { workspace = true }
navree-view = { workspace = true }
quick-xml = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
skrifa = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, optional = true }
tracing = { workspace = true }
unicode-bidi = { workspace = true, optional = true }
uuid = { workspace = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
# The tests that build bombs compress them as small as Flate can.
flate2 = { workspace = true }
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
# The tests cover queued renders behind operations too.
navree-documents = { path = ".", features = ["operations"] }
navree-queue = { workspace = true }
navree-testing = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
