[package]
name = "navree-documents"
description = "Navree DocumentsModule: PDF from HTML templates or a typed builder (a native engine in process, or headless Chrome), DOCX, and PDF merge, stamp and text extraction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["native", "chrome", "docx"]
## The native PDF engine: HTML templates and `PdfDocument` laid out in
## process, with the bundled Noto fonts.
native = ["dep:krilla", "dep:harfrust", "dep:skrifa", "dep:unicode-bidi", "dep:icu_segmenter"]
## HTML to PDF in headless Chrome over the DevTools protocol.
chrome = ["dep:tokio-tungstenite", "dep:futures-util", "dep:tempfile", "dep:mime_guess"]
## The DOCX writer.
docx = ["dep:docx-rs"]
## Queued renders behind an operation of navree-queue
## (`Documents::queue_operation`). Off by default: the `navree` facade
## turns it on when its `queue` feature is on too.
operations = ["dep:navree-queue", "dep:navree-db"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
docx-rs = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
harfrust = { workspace = true, optional = true }
http = { workspace = true }
icu_segmenter = { workspace = true, optional = true }
krilla = { workspace = true, optional = true }
lopdf = { workspace = true }
mime_guess = { workspace = true, optional = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-db = { workspace = true, optional = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
navree-queue = { workspace = true, optional = true }
navree-storage = { workspace = true }
navree-view = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skrifa = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, optional = true }
tracing = { workspace = true }
unicode-bidi = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
# The tests cover queued renders behind operations too.
navree-documents = { workspace = true, features = ["operations"] }
navree-db = { workspace = true }
navree-queue = { workspace = true }
navree-testing = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
