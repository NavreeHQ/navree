[package]
name = "navree-graphql"
description = "Navree GraphqlModule: a GraphQL API served from your modules on async-graphql, with access rules, dataloaders and subscriptions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND MIT"
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "graphql", "api"]
categories = ["web-programming"]
readme = "README.md"
include = ["src/**", "assets/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
async-graphql = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
navree-access = { workspace = true }
navree-auth = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-db = { workspace = true }
navree-events = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
navree-validation = { workspace = true }
navree-workspace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
navree-crypto = { workspace = true }
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
navree-macros = { workspace = true }
# The tests' `posts` table is a model and an access subject.
navree-orm = { workspace = true, features = ["access"] }
navree-testing = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
trybuild = { workspace = true }
