[package]
name = "navree-schema"
description = "Navree schema builder: tables, columns, indexes, foreign keys and check constraints in Rust, compiled for PostgreSQL with TimescaleDB, MySQL/MariaDB and SQLite; migrations and hypertables."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## The real-server tests on PostgreSQL (`NAVREE_TEST_POSTGRES_URL`); the
## library is the same with or without it.
postgres = ["sqlx/postgres"]
## The real-server tests on MySQL and MariaDB (`NAVREE_TEST_MYSQL_URL`).
mysql = ["sqlx/mysql"]

[dependencies]
navree-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
# The tests' own connections (SQLite files; the real servers with the
# `postgres` and `mysql` features). The library reaches databases only
# through `SchemaConnection`.
sqlx = { workspace = true, features = ["rust_decimal", "sqlite-bundled"] }
tempfile = { workspace = true }
tokio = { workspace = true }
