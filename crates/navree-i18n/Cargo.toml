[package]
name = "navree-i18n"
description = "Navree I18nModule: Fluent translations with plurals and variables, the request's locale negotiated per request, and translated validation messages, views and notifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
## The test suite on PostgreSQL (`NAVREE_TEST_DATABASE=postgres` with
## NAVREE_TEST_POSTGRES_URL).
postgres = ["navree-db/postgres"]
## The test suite on MySQL (`NAVREE_TEST_DATABASE=mysql` with NAVREE_TEST_MYSQL_URL).
mysql = ["navree-db/mysql"]

[dependencies]
chrono = { workspace = true }
fixed_decimal = { workspace = true }
fluent-bundle = { workspace = true }
fluent-syntax = { workspace = true }
form_urlencoded = { workspace = true }
http = { workspace = true }
icu_calendar = { workspace = true }
icu_datetime = { workspace = true }
icu_decimal = { workspace = true }
icu_locale_core = { workspace = true }
icu_provider = { workspace = true }
intl-memoizer = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
navree-i18n-macros = { workspace = true }
navree-kernel = { workspace = true }
navree-notify = { workspace = true }
navree-openapi = { workspace = true }
navree-template = { workspace = true }
navree-validation = { workspace = true }
navree-view = { workspace = true }
navree-workspace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unic-langid = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
navree-access = { workspace = true }
navree-macros = { workspace = true }
navree-mail = { workspace = true }
navree-testing = { workspace = true }
tempfile = { workspace = true }
