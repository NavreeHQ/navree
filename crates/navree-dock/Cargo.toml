[package]
name = "navree-dock"
description = "Navree Dock: local development services (PostgreSQL, Redis, Meilisearch, Mailpit, MinIO, NATS) from dock.toml, run with docker compose."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "docker", "dev-services"]
categories = ["development-tools"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
# The SCRAM verifier and the derived password of the read-only role Dock
# keeps in PostgreSQL for Navigator.
base64 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
