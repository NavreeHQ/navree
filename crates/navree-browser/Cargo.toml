[package]
name = "navree-browser"
description = "Navree browser testing: drive Chrome or Chromium over the Chrome DevTools Protocol from Rust tests, with automatic waiting, failure screenshots, a real-port TestServer and front ends started against the test's app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
# The front-end proxy forwards requests with hyper's HTTP/1 client.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# The Chrome DevTools Protocol is JSON over a WebSocket.
tokio-tungstenite = { workspace = true }
uuid = { workspace = true }
wildmatch = { workspace = true }

[dev-dependencies]
navree-testing = { workspace = true }
tempfile = { workspace = true }
