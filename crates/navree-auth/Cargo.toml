[package]
name = "navree-auth"
description = "Navree AuthModule: JWT authentication with rotating refresh tokens, pluggable strategies and user accounts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## PostgreSQL integration tests (`tests/postgres.rs`, with NAVREE_TEST_POSTGRES_URL).
postgres = ["navree-db/postgres"]

[dependencies]
axum = { workspace = true }
# base64 and ring: token exchange (JWS verification of trusted issuers' tokens)
# and passkeys (WebAuthn signatures), until navree_crypto::jose carries them.
base64 = { workspace = true }
chrono = { workspace = true }
form_urlencoded = { workspace = true }
garde = { workspace = true }
# hmac and sha2: the HMAC-only jsonwebtoken CryptoProvider (src/jwt/provider.rs).
hmac = { workspace = true }
http = { workspace = true }
jsonwebtoken = { workspace = true }
# Only for `impl navree_access::Subject for user::Entity` (no module import).
navree-access = { workspace = true }
navree-cache = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-crypto = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
# Fetching trusted issuers' key sets (`auth.trusted_issuers.*.jwks_url`).
navree-http-client = { workspace = true }
navree-kernel = { workspace = true }
# navree-mail, qrcode2 and totp-rs: the account flows of plan Task 30
# (password reset mail, TOTP two-factor).
navree-mail = { workspace = true }
navree-validation = { workspace = true }
qrcode2 = { workspace = true }
ring = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
totp-rs = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
navree-api = { workspace = true }
# The PostgreSQL test checks the impersonator column of the audit log.
navree-audit = { workspace = true }
navree-observe = { workspace = true }
navree-testing = { workspace = true }
# Tests boot MailModule, which needs ViewModule.
navree-view = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
