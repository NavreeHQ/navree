[package]
name = "navree-auth"
description = "Navree AuthModule: JWT authentication with rotating refresh tokens, pluggable strategies and user accounts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## The test suite on PostgreSQL (`NAVREE_TEST_DATABASE=postgres` with
## NAVREE_TEST_POSTGRES_URL; also `tests/postgres.rs`).
postgres = ["navree-db/postgres"]
## The test suite on MySQL (`NAVREE_TEST_DATABASE=mysql` with NAVREE_TEST_MYSQL_URL).
mysql = ["navree-db/mysql"]

[dependencies]
axum = { workspace = true }
# base64 and ring: token exchange (JWS verification of trusted issuers' tokens)
# and passkeys (WebAuthn signatures), until navree_crypto::jose carries them.
# The service's own tokens, TOTP codes and QR codes are navree-crypto's.
base64 = { workspace = true }
chrono = { workspace = true }
form_urlencoded = { workspace = true }
garde = { workspace = true }
http = { workspace = true }
# Only for `impl navree_access::Subject for user::Entity` (no module import).
navree-access = { workspace = true }
navree-cache = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-crypto = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
# Fetching trusted issuers' key sets (`auth.trusted_issuers.*.jwks_url`).
navree-http-client = { workspace = true }
navree-kernel = { workspace = true }
# navree-mail: the account flows of plan Task 30 (password reset mail).
navree-mail = { workspace = true }
# The auth tables are models (`User`, `refresh_token::Model`, ...); sessions,
# sign-in tokens, pending resets and passkeys are written through the ORM.
navree-orm = { workspace = true }
navree-validation = { workspace = true }
ring = { workspace = true }
# Compatibility layer only (`entity/user.rs`): the SeaORM derive kept on
# `User` for crates not yet ported to navree-orm. Removed in step 8 of the
# data-layer port.
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
# IDNA mapping of email domains (`email_domain`).
url = { workspace = true }
uuid = { workspace = true }
# The two-factor secret and the token key are wiped when dropped.
zeroize = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
navree-api = { workspace = true }
# The PostgreSQL test checks the impersonator column of the audit log.
navree-audit = { workspace = true }
navree-observe = { workspace = true }
navree-testing = { workspace = true }
# Tests boot MailModule, which needs ViewModule.
navree-view = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
