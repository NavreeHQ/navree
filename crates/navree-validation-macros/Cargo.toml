[package]
name = "navree-validation-macros"
description = "Navree validation macros: #[derive(Validate)] with #[validate(...)] field rules (re-exported by navree-validation)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

# The expansions are tested where they are used: navree-validation's tests
# (rule behaviour, and the compile-fail cases under tests/ui).
[dependencies]
# Renames fields the way `#[serde(rename_all = "...")]` does, so rule paths
# match the input's keys.
heck = { workspace = true }
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
# Checks `pattern("...")` expressions when the DTO compiles.
regex = { workspace = true }
syn = { workspace = true }
