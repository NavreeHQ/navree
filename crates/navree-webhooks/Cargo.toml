[package]
name = "navree-webhooks"
description = "Navree WebhooksModule: signed outgoing webhooks with retries and a delivery log, and verified incoming webhooks from many senders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "webhooks", "signatures"]
categories = ["web-programming"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
features = ["notify"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[features]
## The provider callbacks of navree-notify's SMS and WhatsApp channels
## (`NotifyCallbacksController`): Twilio, Vonage and Meta statuses and
## STOP replies applied to the notification delivery log and opt-outs.
notify = ["dep:navree-notify"]
## The test suite on PostgreSQL (`NAVREE_TEST_DATABASE=postgres` with
## NAVREE_TEST_POSTGRES_URL).
test-postgres = ["navree-db/postgres"]
## The test suite on MySQL (`NAVREE_TEST_DATABASE=mysql` with NAVREE_TEST_MYSQL_URL).
test-mysql = ["navree-db/mysql"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
form_urlencoded = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-crypto = { workspace = true }
navree-db = { workspace = true }
navree-events = { workspace = true }
navree-http = { workspace = true }
navree-http-client = { workspace = true }
navree-kernel = { workspace = true }
navree-notify = { workspace = true, optional = true }
navree-openapi = { workspace = true }
# The webhook tables are models (endpoints, deliveries, attempts, receipts).
navree-orm = { workspace = true }
navree-telemetry = { workspace = true }
navree-workspace = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
navree-access = { workspace = true }
navree-queue = { workspace = true }
navree-testing = { workspace = true }
# The notification callback routes are tested with the `notify` feature on.
navree-webhooks = { path = ".", features = ["notify"] }
tokio = { workspace = true }
toml = { workspace = true }
