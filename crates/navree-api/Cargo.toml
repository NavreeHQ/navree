navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
navree-markdown = { workspace = true }
navree-openapi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
