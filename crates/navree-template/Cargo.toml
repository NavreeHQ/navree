[package]
name = "navree-template"
description = "Navree's template engine: Jinja syntax, autoescaping by mode, a sandboxed value model and caps on depth, loops, work, output and allocation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "template", "jinja", "sandbox"]
categories = ["template-engine"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
# Where the thread's stack ends, so a render stops before it does.
stacker = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
