[package]
name = "navree-phone"
description = "Navree phone numbers: parsing, validation, number types and formatting (E.164, international, national) on libphonenumber's numbering plans."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "phone", "e164", "libphonenumber"]
categories = ["parser-implementations", "value-formatting"]
readme = "README.md"
include = ["src/**", "THIRD_PARTY.md", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
features = ["serde"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[features]
## `Serialize` and `Deserialize` for `PhoneNumber` (its E.164 string) and
## `Region` (its code).
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
# Its own `serde` feature, for the tests of the serde impls.
navree-phone = { path = ".", features = ["serde"] }
proptest = { workspace = true }
serde_json = { workspace = true }
# The digit table's test reads the Unicode general category.
unicode-properties = { workspace = true }
