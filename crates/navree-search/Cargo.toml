[package]
name = "navree-search"
description = "Navree SearchModule: full-text and vector search over models, on the database, Meilisearch, Typesense, Tantivy or memory, kept in sync through the queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## The embedded Tantivy engine (`search.engine = "tantivy"`).
tantivy = ["dep:tantivy"]
## PostgreSQL driver for navree-db (the `postgres` engine and `pgvector`).
postgres = ["navree-db/postgres", "navree-orm/test-postgres", "navree-workspace/test-postgres"]
## MySQL driver for navree-db (the HTTP, Tantivy and memory engines on a
## MySQL app database; the test suite runs on it with
## `NAVREE_TEST_DATABASE=mysql`).
mysql = ["navree-db/mysql", "navree-orm/test-mysql", "navree-workspace/test-mysql"]
## Entry points for the fuzz targets in `fuzz/` (`navree_search::fuzzing`). Not
## part of the API.
fuzzing = []
## Vector search on navree-ai: its `Embeddings` when the app registers no
## provider, and its `VectorStore` with `search.vectors.store = "ai"`.
ai = ["dep:navree-ai"]

[dependencies]
chrono = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
navree-access = { workspace = true }
navree-ai = { workspace = true, optional = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
navree-http-client = { workspace = true }
navree-kernel = { workspace = true }
navree-macros = { workspace = true }
# Searchable records are navree-orm models; access rules on results go
# through its `access` feature.
navree-orm = { workspace = true, features = ["access"] }
navree-queue = { workspace = true }
navree-workspace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tantivy = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
# The tests of vector search on navree-ai always run.
navree-search = { workspace = true, features = ["ai"] }
navree-testing = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
