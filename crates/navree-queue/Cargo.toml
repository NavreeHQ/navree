[package]
name = "navree-queue"
description = "Navree QueueModule: database and memory job queues, workers, retries with backoff, unique and delayed jobs, job batches and operations with progress."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## PostgreSQL for the tests: with `NAVREE_TEST_POSTGRES_URL` set, every
## test harness runs on its own fresh PostgreSQL database.
postgres = ["navree-db/postgres"]
## MySQL for the tests: with `NAVREE_TEST_DATABASE=mysql` and
## `NAVREE_TEST_MYSQL_URL` set, every test harness runs on its own fresh
## MySQL database.
mysql = ["navree-db/mysql"]

[dependencies]
# The operations routes and their SSE stream.
axum = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
# Failed jobs are models of `failed_jobs` (`FailedJob`), written and read by
# the database driver through the ORM.
navree-orm = { workspace = true }
# The authorizer of the private channel `operations.{id}`.
navree-realtime = { workspace = true }
# The watchdog, scheduled every minute in apps with `ScheduleModule`.
navree-schedule = { workspace = true }
navree-telemetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
navree-testing = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
