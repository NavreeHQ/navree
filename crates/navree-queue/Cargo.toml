[package]
name = "navree-queue"
description = "Navree QueueModule: database and memory job queues, workers, retries with backoff, unique and delayed jobs, job batches and operations with progress."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "queue", "jobs", "workers"]
categories = ["asynchronous"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
features = ["ui"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[features]
default = []
## PostgreSQL for the tests: with `NAVREE_TEST_POSTGRES_URL` set, every
## test harness runs on its own fresh PostgreSQL database.
test-postgres = ["navree-db/postgres"]
## MySQL for the tests: with `NAVREE_TEST_DATABASE=mysql` and
## `NAVREE_TEST_MYSQL_URL` set, every test harness runs on its own fresh
## MySQL database.
test-mysql = ["navree-db/mysql"]
## `navree_queue::ui::OperationProgress`: a Navree UI region that follows an operation, and the
## fragment route it fetches. The facade turns it on when both `ui` and `queue` are on.
ui = ["dep:navree-ui"]

[dependencies]
chrono = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
navree-openapi = { workspace = true }
# Failed jobs are models of `failed_jobs` (`FailedJob`), written and read by
# the database driver through the ORM.
navree-orm = { workspace = true }
# The authorizer of the private channel `operations.{id}`.
navree-realtime = { workspace = true }
# The watchdog, scheduled every minute in apps with `ScheduleModule`.
navree-schedule = { workspace = true }
navree-telemetry = { workspace = true }
navree-ui = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The crate's own tests draw the progress region.
navree-queue = { path = ".", features = ["ui"] }
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
navree-testing = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
