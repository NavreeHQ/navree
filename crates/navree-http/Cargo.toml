[package]
name = "navree-http"
description = "Navree HttpModule: Navree's router and extractors, default Tower layers, JSON errors, controllers and route metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The previous router: its body and response types, its serve loop and its
# middleware, until the move takes them to navree-http's own; the crates not
# yet moved still use its extractors.
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
# The per-IP limit and route throttles: keys sharded across locks.
dashmap = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-kernel = { workspace = true }
navree-telemetry = { workspace = true }
metrics = { workspace = true }
pin-project-lite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The field path in Query, Form and Json errors (`title: invalid type: ...`).
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
# The per-route pipeline is a Tower layer of its own.
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The routing micro-benchmarks (`benches/routing.rs`).
criterion = { workspace = true }
# The references of the router's differential tests (tests/routing): the
# previous matcher, the urlencoded parser and deserializer, percent-decoding.
form_urlencoded = { workspace = true }
http-body-util = { workspace = true }
matchit = { workspace = true }
percent-encoding = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
# Only the CORS differential test compares against tower-http's CorsLayer;
# dev-dependency features do not reach normal builds.
tower-http = { workspace = true, features = ["cors"] }
tracing-subscriber = { workspace = true }

# Navree's router against the previous one (`cargo bench -p navree-http --bench routing`).
[[bench]]
name = "routing"
harness = false
