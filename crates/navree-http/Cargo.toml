[package]
name = "navree-http"
description = "Navree HttpModule: Navree's router and extractors, default Tower layers, JSON errors, controllers and route metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
chrono = { workspace = true }
# A multipart text field's charset.
encoding_rs = { workspace = true }
# The per-IP limit and route throttles: keys sharded across locks.
dashmap = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
# The server: the HTTP/1 and HTTP/2 wire protocols, and the protocol detection
# and connection builder on top of them.
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true }
# Finds what the limits of a multipart body are counted between.
memchr = { workspace = true }
metrics = { workspace = true }
mime = { workspace = true }
# multipart/form-data, behind `extract::Multipart`'s limits.
multer = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-kernel = { workspace = true }
navree-telemetry = { workspace = true }
pin-project-lite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The field path in Query, Form and Json errors (`title: invalid type: ...`).
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
# WebSocket frames, after `ws::WebSocketUpgrade`'s handshake.
tokio-tungstenite = { workspace = true }
# Tells a server's connections that it is shutting down.
tokio-util = { workspace = true }
# The per-route pipeline is a Tower layer of its own.
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The routing micro-benchmarks (`benches/routing.rs`).
criterion = { workspace = true }
# Reads a gzip body in the response tests (tests/responses).
flate2 = { workspace = true }
# The references of the extractors' and decoders' tests (tests/routing): the
# urlencoded parser and deserializer, percent-decoding.
form_urlencoded = { workspace = true }
http-body-util = { workspace = true }
# The HTTP/2 client of the server's tests (tests/serve).
hyper = { workspace = true, features = ["client", "http1", "http2"] }
percent-encoding = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
# Only the CORS differential test compares against tower-http's CorsLayer;
# dev-dependency features do not reach normal builds.
tower-http = { workspace = true, features = ["cors"] }
tracing-subscriber = { workspace = true }

# The router's micro-benchmarks (`cargo bench -p navree-http --bench routing`).
[[bench]]
name = "routing"
harness = false

# What `serve` adds over bare hyper (`cargo bench -p navree-http --bench serve`).
[[bench]]
name = "serve"
harness = false
