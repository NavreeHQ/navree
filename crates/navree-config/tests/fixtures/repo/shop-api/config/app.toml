# Dukaan shop API: development settings.
#
# Read from the working directory (run the API from its own folder), after
# `.env` and before `APP_*` environment variables, which override any key:
# `APP_DATABASE__URL` -> database.url. Secrets (APP_KEY, the JWT secret,
# SMTP passwords) belong in `.env`, never here; see `.env.example`.

[app]
# shop-web, the browser-facing app (mail links, email verification).
url = "http://localhost:3000"

[http]
addr = "127.0.0.1:8080"
api_prefix = "/api"
# shop-web's BFF calls from here for every browser and names the browser in
# X-Forwarded-For, so rate limits and the login throttle are per browser.
# (Also the shop API's built-in default; list the BFF's address in production.)
trusted_proxies = ["127.0.0.1", "::1"]

[http.cors]
# shop-web's BFF calls the API server-side; the dev origin is allowed for
# tools and direct calls.
allowed_origins = ["http://localhost:3000"]

[database]
url = "sqlite://storage/shop.db?mode=rwc"
# Development convenience: pending migrations run when the app boots.
migrate_on_boot = true

[mail]
from = "Dukaan shop <shop@navree.test>"
# Mails are written to the log in development.
transport = "log"

[queue]
driver = "database"

[auth]
# Accounts are created by admins (POST /api/v1/users); no public sign-up.
registration = false

[auth.password_reset]
url = "http://localhost:3000/reset-password"

[realtime]
# ws://127.0.0.1:8080/app/dukaan-shop-key
key = "dukaan-shop-key"
allowed_origins = ["http://localhost:3000"]
# queue:work and schedule:work hand their broadcasts (deal notifications,
# task reminders) to `serve`, which holds the sockets: `auto` posts them to
# http.addr. Signed with a key derived from APP_KEY (or realtime.secret), so
# every process needs the same one.
relay_url = "auto"

[api]
title = "Dukaan shop API"

[mcp]
# The MCP server at /mcp (and `shop-api mcp:serve --user <email>` for stdio
# clients): the orders and customers tools, resources and prompts. Clients
# send `Authorization: Bearer <access token>`.
name = "dukaan-shop"
title = "Dukaan shop"
instructions = """
Tools for the Dukaan shop. Orders move through the stages placed, packed, \
shipped, delivered and returned. Amounts are in paise.\
"""
auth = "bearer"

[log]
level = "info"
