[package]
name = "navree-workspace"
description = "Navree WorkspaceModule: multi-tenancy at the workspace level, with members, roles, invitations, row, schema or database isolation, organizations above workspaces, partitions inside them, shared libraries and demo workspaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## PostgreSQL driver (row-level security and schema isolation run there).
postgres = ["navree-db/postgres"]
## MySQL driver, for the real-server tests of shared libraries
## (`NAVREE_TEST_MYSQL_URL`).
mysql = ["navree-db/mysql"]
## `navree_workspace::testing`: isolation suites (`WorkspaceTenancy`,
## `IsolationSuiteExt::factory`) on navree-testing's `TestApp`. The facade
## turns it on when both its `workspace` and `testing` features are on.
testing = ["dep:navree-testing"]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
form_urlencoded = { workspace = true }
# The conformity checks name a model's default table as its derive does.
heck = { workspace = true }
http = { workspace = true }
navree-access = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-crypto = { workspace = true }
navree-db = { workspace = true }
navree-events = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
navree-mail = { workspace = true }
navree-openapi = { workspace = true }
# The workspace tables are models (`Workspace`, `Member`, `Organization`, ...),
# seven of them access subjects (`#[model(subject)]`, feature `access`).
navree-orm = { workspace = true, features = ["access"] }
navree-schedule = { workspace = true }
navree-telemetry = { workspace = true }
navree-testing = { workspace = true, optional = true }
navree-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
# The crate's own tests run isolation suites (feature `testing`).
navree-workspace = { workspace = true, features = ["testing"] }
# ORM models under each isolation strategy; the test servers' settings.
navree-orm = { workspace = true, features = ["testing"] }
navree-testing = { workspace = true }
navree-view = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
