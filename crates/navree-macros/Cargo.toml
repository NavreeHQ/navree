[package]
name = "navree-macros"
description = "Navree's attribute and derive macros: #[module], #[injectable], #[controller], route attributes, #[agent], #[workflow] and more."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "macros", "derive"]
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
# `#[flag]` names a flag after its type in kebab case (`NewPipeline` -> `new-pipeline`).
heck = { workspace = true }
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

# Macro tests expand against the runtime crates (allowed as dev-dependencies
# of navree-macros only; see crates/navree/tests/dependency_graph.rs). The DI
# macro tests need the kernel, plus navree-http for
# `#[module(controllers = [..])]`; the controller macro tests build
# real routers, so they add navree-access (action and subject markers for
# `#[can]`), navree-contracts (a fake authenticator) and friends.
[dev-dependencies]
# The tests expand the macros against the crates that use them. Those crates
# depend on this one, so these are path-only: a published crate carries none of them.
http = { workspace = true }
http-body-util = { workspace = true }
navree-access = { path = "../navree-access" }
navree-auth = { path = "../navree-auth" }
navree-config = { path = "../navree-config" }
navree-contracts = { workspace = true }
navree-http = { path = "../navree-http" }
navree-kernel = { workspace = true }
navree-openapi = { path = "../navree-openapi" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
trybuild = { workspace = true }
uuid = { workspace = true }
