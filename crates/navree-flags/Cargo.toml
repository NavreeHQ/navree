[package]
name = "navree-flags"
description = "Navree FlagsModule: feature flags as types, resolved per user, workspace, plan or percentage, stored in the database and cached."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["auth"]
## `From<&User>` and `From<&CurrentUser>` for `FlagScope` (navree-auth's user).
auth = ["dep:navree-auth"]

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
navree-audit = { workspace = true }
navree-auth = { workspace = true, optional = true }
navree-cache = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-db = { workspace = true }
navree-events = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
# The flags table is a model (`feature_flag::Model`).
navree-orm = { workspace = true }
navree-workspace = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
navree-access = { workspace = true }
navree-api = { workspace = true }
navree-macros = { workspace = true }
navree-testing = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
