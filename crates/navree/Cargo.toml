# Every test target names the features it needs, so a feature set that lacks one
# leaves the test out of the build and says so: `cargo test -p navree --test x`
# stops with the features to turn on, instead of compiling an empty file and
# reporting no tests. `tests/feature_gates.rs` fails when a test file is gated
# with `#![cfg(feature = ..)]` inside, or when a name here is not a feature.
# `scripts/facade-features.sh skipped` lists, for a feature set, the targets it leaves out.

