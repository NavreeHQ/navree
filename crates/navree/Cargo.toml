[package]
name = "navree"
description = "Navree: the complete backend framework for Rust. Modular, API-first and AI-native (facade crate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["full"]
## Every module crate, except the opt-in ones (`social`, `oauth`, `flags`,
## `graphql`, `grpc`, `billing`, `search`, `mcp`, `ai`, `dock`).
full = [
    "access",
    "api",
    "audit",
    "auth",
    "cache",
    "crypto",
    "db",
    "events",
    "http",
    "http-client",
    "log",
    "mail",
    "notify",
    "observe",
    "queue",
    "realtime",
    "schedule",
    "session",
    "storage",
    "telemetry",
    "testing",
    "ui",
    "validation",
    "view",
    "webhooks",
    "workspace",
]
# Each module feature turns on the features of the navree crates it builds
# on (spec §3), so `navree::<dependency>` is always there to name their types.
## L1
## Telemetry events, sinks and W3C trace context (every emitting module turns it on).
telemetry = ["dep:navree-telemetry"]
## L2
http = ["dep:navree-http", "dep:axum", "telemetry"]
log = ["dep:navree-log", "telemetry"]
crypto = ["dep:navree-crypto"]
events = ["dep:navree-events"]
view = ["dep:navree-view"]
cache = ["dep:navree-cache", "telemetry"]
http-client = ["dep:navree-http-client", "telemetry"]
## L3
db = ["dep:navree-db", "http"]
testing = ["dep:navree-testing", "http"]
observe = ["dep:navree-observe", "http"]
api = ["dep:navree-api", "http"]
mail = ["dep:navree-mail", "view", "telemetry"]
realtime = ["dep:navree-realtime", "http", "crypto"]
storage = ["dep:navree-storage", "http", "crypto"]
## L4
session = ["dep:navree-session", "http", "crypto", "db"]
validation = ["dep:navree-validation", "http", "db"]
audit = ["dep:navree-audit", "http", "db"]
queue = ["dep:navree-queue", "db"]
schedule = ["dep:navree-schedule", "db"]
access = ["dep:navree-access", "http", "db"]
notify = ["dep:navree-notify", "http", "db", "mail"]
## The UI kit of the server-rendered tools: the app shell, components as
## MiniJinja macros, embedded CSS, JS and fonts (light: no new dependencies).
ui = ["dep:navree-ui", "http", "view"]
## L5
auth = [
    "dep:navree-auth",
    "http",
    "db",
    "crypto",
    "validation",
    "cache",
    "mail",
    "access",
]
## Workspaces: multi-tenancy with members, roles, invitations and isolation.
workspace = [
    "dep:navree-workspace",
    "http",
    "db",
    "crypto",
    "events",
    "mail",
    "access",
]
## L6
## Webhooks: signed outgoing deliveries with retries and a delivery log,
## verified incoming webhooks (pure Rust; in `full`).
webhooks = [
    "dep:navree-webhooks",
    "http",
    "crypto",
    "events",
    "http-client",
    "db",
    "workspace",
]
## L6 (opt-in, not in `full`)
## Social sign-in: Google, GitHub, Apple, Microsoft, GitLab, Slack, LinkedIn,
## Discord, X and OpenID Connect providers, linked to navree-auth users.
social = [
    "dep:navree-social",
    "http",
    "crypto",
    "cache",
    "events",
    "http-client",
    "db",
    "auth",
]
## L6 (opt-in, not in `full`)
## OAuth 2.1 authorization server and OpenID Connect provider.
oauth = [
    "dep:navree-oauth",
    "access",
    "auth",
    "crypto",
    "db",
    "http",
    "testing",
    "workspace",
]
## L6 (ecosystem libraries, opt-in: not part of `full`)
## Feature flags: `#[flag]`, `Flags`, `CurrentFlags`, `#[requires_flag]`.
flags = [
    "dep:navree-flags",
    "http",
    "cache",
    "db",
    "events",
    "audit",
    "workspace",
    "auth",
]
## L6 (opt-in, not in `full`)
## GraphQL: `GraphqlModule`, `#[resolver]`, dataloaders, subscriptions.
graphql = [
    "dep:navree-graphql",
    "http",
    "events",
    "db",
    "validation",
    "access",
    "auth",
    "workspace",
]
## L6 (opt-in: not in `full`)
## gRPC, gRPC-Web and Connect services in modules, on tonic.
grpc = ["dep:navree-grpc", "http", "db", "validation", "testing"]
## L6 (ecosystem libraries; opt-in, not in `full`)
## AI SDK: text, structured output and streaming from Anthropic, OpenAI,
## Gemini, Mistral, Ollama and Bedrock; agents with tools; embeddings,
## vector stores and AiFake.
ai = [
    "dep:navree-ai",
    "http",
    "http-client",
    "cache",
    "db",
    "storage",
    "validation",
    "access",
    "auth",
]
## L7 (opt-in, not in `full`)
## Search: full-text and vector search over entities (postgres,
## meilisearch, typesense and memory engines).
search = [
    "dep:navree-search",
    "http",
    "http-client",
    "db",
    "queue",
    "access",
    "workspace",
]
## The embedded Tantivy engine for search (compiles Tantivy in).
search-tantivy = ["search", "navree-search/tantivy"]
## Billing: subscriptions, trials, seats, usage, invoices and the portal
## with Stripe, Paddle or a fake; verified webhooks on the queue.
billing = [
    "dep:navree-billing",
    "http",
    "events",
    "http-client",
    "db",
    "schedule",
    "auth",
    "workspace",
]
## L6 (ecosystem, opt-in: not in `full`)
## MCP servers: `McpModule`, `#[mcp_server]`, streamable HTTP and stdio.
mcp = [
    "dep:navree-mcp",
    "http",
    "cache",
    "db",
    "testing",
    "validation",
    "access",
    "auth",
]
## PostgreSQL driver for navree-db.
postgres = ["db", "navree-db/postgres"]
## MySQL and MariaDB driver for navree-db (`mysql://` and `mariadb://` URLs).
mysql = ["db", "navree-db/mysql"]
## Opt-in, not in `full`: Dock's library (`dock.toml`, the services' settings,
## the Compose file), for tools and tests. `navree dock` (the CLI) does not need it.
dock = ["dep:navree-dock"]
## OTLP export of spans (gRPC and HTTP/protobuf) for `observe.tracing`
## (opt-in: it adds the OpenTelemetry SDK, tonic and prost).
otel = ["observe", "navree-observe/otel"]

[dependencies]
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-kernel = { workspace = true }
navree-macros = { workspace = true }

navree-access = { workspace = true, optional = true }
navree-ai = { workspace = true, optional = true }
navree-api = { workspace = true, optional = true }
navree-audit = { workspace = true, optional = true }
navree-auth = { workspace = true, optional = true }
navree-billing = { workspace = true, optional = true }
navree-workspace = { workspace = true, optional = true }
navree-oauth = { workspace = true, optional = true }
navree-flags = { workspace = true, optional = true }
navree-grpc = { workspace = true, optional = true }
navree-search = { workspace = true, optional = true }
navree-cache = { workspace = true, optional = true }
navree-crypto = { workspace = true, optional = true }
navree-db = { workspace = true, optional = true }
navree-dock = { workspace = true, optional = true }
navree-events = { workspace = true, optional = true }
navree-graphql = { workspace = true, optional = true }
navree-http = { workspace = true, optional = true }
navree-http-client = { workspace = true, optional = true }
navree-log = { workspace = true, optional = true }
navree-mail = { workspace = true, optional = true }
navree-mcp = { workspace = true, optional = true }
navree-notify = { workspace = true, optional = true }
navree-observe = { workspace = true, optional = true }
navree-queue = { workspace = true, optional = true }
navree-realtime = { workspace = true, optional = true }
navree-schedule = { workspace = true, optional = true }
navree-session = { workspace = true, optional = true }
navree-social = { workspace = true, optional = true }
navree-storage = { workspace = true, optional = true }
navree-telemetry = { workspace = true, optional = true }
navree-testing = { workspace = true, optional = true }
navree-ui = { workspace = true, optional = true }
navree-validation = { workspace = true, optional = true }
navree-view = { workspace = true, optional = true }
navree-webhooks = { workspace = true, optional = true }

# Re-exported as `navree::axum` (extractors such as `Path` and `Query`), with
# the `http` feature.
axum = { workspace = true, optional = true }

[dev-dependencies]
# The `graphql` test's object derives name async-graphql directly, as an
# app's do.
async-graphql = { workspace = true }
# `tests/jose_docs.rs` builds fixture keys by hand.
base64 = { workspace = true }
chrono = { workspace = true }
garde = { workspace = true }
metrics = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
# The gRPC docs example: tonic's generated code names these crates.
prost = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[[test]]
name = "graphql"
required-features = ["graphql"]

# The gRPC docs example through the facade (`cargo test -p navree --features grpc --test grpc`).
[[test]]
name = "grpc"
required-features = ["grpc"]
