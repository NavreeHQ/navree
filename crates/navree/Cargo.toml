[package]
name = "navree"
description = "Navree: the complete backend framework for Rust. Modular, API-first and AI-native (facade crate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["full"]
## Every module crate, except the opt-in ones (`social`, `oauth`, `flags`,
## `graphql`, `grpc`, `billing`, `search`, `mcp`, `ai`, `redis`, `micro`,
## `i18n`, `dock`, `navigator`, `browser`).
full = [
    "access",
    "api",
    "audit",
    "auth",
    "cache",
    "crypto",
    "db",
    "events",
    "fleet",
    "helm",
    "http",
    "http-client",
    "lighthouse",
    "log",
    "logbook",
    "mail",
    "notify",
    "observe",
    "orm",
    "queue",
    "realtime",
    "schedule",
    "schema",
    "session",
    "storage",
    "storage-s3",
    "telemetry",
    "testing",
    "time",
    "ui",
    "validation",
    "validation-html",
    "validation-phone",
    "view",
    "webhooks",
    "workspace",
]
# Each module feature turns on the features of the navree crates it builds
# on (spec §3), so `navree::<dependency>` is always there to name their types.
## L1
## Telemetry events, sinks and W3C trace context (every emitting module turns it on).
telemetry = ["dep:navree-telemetry"]
## L2
http = ["dep:navree-http", "dep:axum", "telemetry"]
log = ["dep:navree-log", "telemetry"]
crypto = ["dep:navree-crypto"]
events = ["dep:navree-events", "telemetry"]
view = ["dep:navree-view"]
cache = ["dep:navree-cache", "telemetry"]
http-client = ["dep:navree-http-client", "telemetry"]
## The schema builder: tables, columns, indexes and foreign keys in Rust for
## PostgreSQL (with TimescaleDB), MySQL and SQLite; hypertables; schema dumps.
schema = ["dep:navree-schema"]
## L3
db = ["dep:navree-db", "http", "schema"]
## With `workspace` on too, also `navree::workspace::testing` (isolation suites).
## With `orm` on too, also `navree::orm::testing::TestAppExt` (`app.seed::<S>()`).
testing = [
    "dep:navree-testing",
    "http",
    "navree-workspace?/testing",
    "navree-orm?/testing",
]
observe = ["dep:navree-observe", "http"]
api = ["dep:navree-api", "http"]
mail = ["dep:navree-mail", "view", "telemetry"]
realtime = ["dep:navree-realtime", "http", "crypto"]
storage = ["dep:navree-storage", "http", "crypto"]
## S3 and S3-compatible disks (AWS, MinIO, Cloudflare R2, DigitalOcean
## Spaces), on rustls with ring (in `full`).
storage-s3 = ["storage", "navree-storage/s3"]
## Google Cloud Storage disks (opt-in, not in `full`).
storage-gcs = ["storage", "navree-storage/gcs"]
## Azure Blob Storage disks (opt-in, not in `full`).
storage-azure = ["storage", "navree-storage/azure"]
## Time zones: zones, the request's zone, local days, send windows,
## holidays and local-time SQL (the IANA database compiled in; in `full`).
time = ["dep:navree-time", "http"]
## L4
session = ["dep:navree-session", "http", "crypto", "db"]
## With `orm` on too, also `navree::orm::validation` (`unique` and `exists`
## rules on models).
validation = ["dep:navree-validation", "http", "db", "navree-orm?/validation"]
## The audit trail; its entries are ORM models (`orm`).
audit = ["dep:navree-audit", "http", "db", "orm"]
## Job queues; failed jobs are ORM models (`orm`).
queue = ["dep:navree-queue", "http", "db", "realtime", "schedule", "orm"]
schedule = ["dep:navree-schedule", "db", "time"]
## With `orm` on too, models can be subjects (`#[model(subject, policy)]`,
## `accessible` queries, `Authorized<Model, A>`).
access = ["dep:navree-access", "http", "db", "navree-orm?/access"]
## Notifications; stored ones are ORM models (`orm`).
notify = ["dep:navree-notify", "http", "db", "mail", "orm"]
## The UI kit of the server-rendered tools: the app shell, components as
## MiniJinja macros, embedded CSS, JS and fonts (light: no new dependencies).
ui = ["dep:navree-ui", "http", "view"]
## The ORM: `#[derive(Model)]` models, the query builder, records,
## collections and pagination on navree-db's pool and unit of work; model
## events and observers, soft deletes, strict modes and pruning (`OrmModule`);
## encrypted and hashed attributes (crypto) and records as API resources
## (api).
orm = [
    "dep:navree-orm",
    "db",
    "events",
    "http",
    "telemetry",
    "crypto",
    "api",
]
## L5
auth = [
    "dep:navree-auth",
    "http",
    "db",
    "crypto",
    "validation",
    "cache",
    "mail",
    "access",
    "http-client",
    "orm",
]
## Workspaces: multi-tenancy with members, roles, invitations and isolation.
workspace = [
    "dep:navree-workspace",
    "http",
    "db",
    "crypto",
    "events",
    "mail",
    "access",
    "time",
]
## L5 (opt-in, not in `full`)
## Redis: shared connections and the Redis drivers of the cache and locks,
## the queue, sessions and the real-time backplane, plus shared rate limits
## (pure Rust, rustls with ring for rediss://; opt-in because it adds the
## redis client and its Lua scripts are only needed with a Redis server).
redis = ["dep:navree-redis", "cache", "queue", "session", "realtime"]
## L6
## Webhooks: signed outgoing deliveries with retries and a delivery log,
## verified incoming webhooks (pure Rust; in `full`).
webhooks = [
    "dep:navree-webhooks",
    "http",
    "crypto",
    "events",
    "http-client",
    "db",
    "workspace",
]
## L6 (opt-in, not in `full`)
## Social sign-in: Google, GitHub, Apple, Microsoft, GitLab, Slack, LinkedIn,
## Discord, X and OpenID Connect providers, linked to navree-auth users.
social = [
    "dep:navree-social",
    "http",
    "crypto",
    "cache",
    "events",
    "http-client",
    "db",
    "auth",
]
## L6 (opt-in, not in `full`)
## OAuth 2.1 authorization server and OpenID Connect provider.
oauth = [
    "dep:navree-oauth",
    "access",
    "auth",
    "crypto",
    "db",
    "http",
    "testing",
    "workspace",
]
## L6 (ecosystem libraries, opt-in: not part of `full`)
## Feature flags: `#[flag]`, `Flags`, `CurrentFlags`, `#[requires_flag]`.
flags = [
    "dep:navree-flags",
    "http",
    "cache",
    "db",
    "events",
    "audit",
    "workspace",
    "auth",
]
## L6 (opt-in, not in `full`)
## GraphQL: `GraphqlModule`, `#[resolver]`, dataloaders, subscriptions.
graphql = [
    "dep:navree-graphql",
    "http",
    "events",
    "db",
    "validation",
    "access",
    "auth",
    "workspace",
]
## L6 (opt-in: not in `full`)
## gRPC, gRPC-Web and Connect services in modules, on tonic.
grpc = ["dep:navree-grpc", "http", "db", "validation", "testing"]
## L6 (ecosystem libraries; opt-in, not in `full`)
## AI SDK: text, structured output and streaming from Anthropic, OpenAI,
## Gemini, Mistral, Ollama and Bedrock; agents with tools; embeddings,
## vector stores and AiFake.
ai = [
    "dep:navree-ai",
    "http",
    "http-client",
    "cache",
    "db",
    "storage",
    "validation",
    "access",
    "auth",
]
## L7 (opt-in, not in `full`)
## Search: full-text and vector search over entities (postgres,
## meilisearch, typesense and memory engines).
search = [
    "dep:navree-search",
    "http",
    "http-client",
    "db",
    "queue",
    "access",
    "workspace",
]
## The embedded Tantivy engine for search (compiles Tantivy in).
search-tantivy = ["search", "navree-search/tantivy"]
## Billing: subscriptions, trials, seats, usage, invoices and the portal
## with Stripe, Paddle or a fake; verified webhooks on the queue.
billing = [
    "dep:navree-billing",
    "http",
    "events",
    "http-client",
    "db",
    "schedule",
    "auth",
    "workspace",
]
## L6 (ecosystem, opt-in: not in `full`)
## MCP servers: `McpModule`, `#[mcp_server]`, streamable HTTP and stdio.
## With `lighthouse` on too, Lighthouse's tools, resource and prompt.
mcp = [
    "dep:navree-mcp",
    "http",
    "cache",
    "db",
    "testing",
    "validation",
    "access",
    "auth",
    "navree-lighthouse?/mcp",
]
## L6 (opt-in, not in `full`)
## Microservices: message and event handlers, `ServiceClient`, the TCP and
## in-memory transports. Each broker is a feature of its own (below).
micro = [
    "dep:navree-micro",
    "http",
    "events",
    "db",
    "testing",
    "validation",
]
## NATS for `micro` (async-nats; core request-reply, JetStream for events).
micro-nats = ["micro", "navree-micro/nats"]
## Kafka for `micro` (a pure-Rust client).
micro-kafka = ["micro", "navree-micro/kafka"]
## RabbitMQ (AMQP 0-9-1) for `micro` (lapin).
micro-rabbitmq = ["micro", "navree-micro/rabbitmq"]
## Redis Streams for `micro`.
micro-redis = ["micro", "navree-micro/redis"]
## MQTT 5 for `micro` (rumqttc).
micro-mqtt = ["micro", "navree-micro/mqtt"]
## L6 (opt-in, not in `full`: it compiles in ICU4X's locale data)
## Localization: `I18nModule`, Fluent files, `t!`, the `Locale` extractor,
## translated validation messages, templates and notifications.
i18n = [
    "dep:navree-i18n",
    "http",
    "view",
    "db",
    "validation",
    "notify",
    "workspace",
]
## L7 (in `full`)
## Lighthouse: application monitoring inside the app. Issues grouped by
## fingerprint, traces, aggregates, alerts and the `/_lighthouse` dashboard.
lighthouse = [
    "dep:navree-lighthouse",
    "telemetry",
    "http",
    "crypto",
    "view",
    "http-client",
    "db",
    "mail",
    "schedule",
    "access",
    "auth",
]
## L7 (in `full`)
## Logbook: the local debugging timeline at `/_logbook` (requests, queries,
## jobs, mail, events, cache, logs) with filters and request replay. Off in
## release builds unless `logbook.enabled = true`.
logbook = [
    "dep:navree-logbook",
    "telemetry",
    "http",
    "view",
    "db",
    "auth",
]
## L7 (in `full`)
## Fleet:supervised queue workers with auto-balancing, recycling and
## graceful restarts, metrics, failed jobs, pause and continue, long-wait
## alerts and a dashboard at `/_fleet` (pure Rust; no system dependency).
fleet = [
    "dep:navree-fleet",
    "access",
    "db",
    "events",
    "http",
    "observe",
    "queue",
    "telemetry",
    "view",
]
## L7 (in `full`)
## Helm: the admin panel generated from your entities.
helm = [
    "dep:navree-helm",
    "http",
    "view",
    "db",
    "crypto",
    "storage",
    "validation",
    "audit",
    "access",
    "auth",
]
## PostgreSQL driver for navree-db.
postgres = ["db", "navree-db/postgres"]
## MySQL and MariaDB driver for navree-db (`mysql://` and `mariadb://` URLs).
mysql = ["db", "navree-db/mysql"]
## navree-validation's `Phone`: E.164 phone numbers (the phonenumber crate).
## Pure Rust; in `full`.
validation-phone = ["validation", "navree-validation/phone"]
## navree-validation's `SafeHtml`: rich text sanitized by the app's
## `HtmlPolicy` (ammonia). Pure Rust; in `full`.
validation-html = ["validation", "navree-validation/html"]
## Opt-in, not in `full`: Dock's library (`dock.toml`, the services' settings,
## the Compose file), for tools and tests. `navree dock` (the CLI) does not need it.
dock = ["dep:navree-dock"]
## Opt-in, not in `full`: Navigator's library (the MCP server for coding
## agents behind `navree mcp`, its tools, and the embedded agent skills of
## `navree skills:install`), for tools and tests. The CLI does not need it.
navigator = ["dep:navree-navigator", "dock"]
## Opt-in, not in `full`: browser testing (navree-browser) for tests, usually
## turned on in `[dev-dependencies]`; it drives Chrome or Chromium over the
## DevTools Protocol, so it needs a browser on the machine at test time.
browser = ["dep:navree-browser", "http"]
## OTLP export of spans (gRPC and HTTP/protobuf) for `observe.tracing`
## (opt-in: it adds the OpenTelemetry SDK, tonic and prost).
otel = ["observe", "navree-observe/otel"]
## Harbor (opt-in, not in `full`): harbor.toml, provisioning and deploys as a
## library. The `navree` CLI has it built in; apps rarely need it.
harbor = ["dep:navree-harbor"]

[dependencies]
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-kernel = { workspace = true }
navree-macros = { workspace = true }

navree-access = { workspace = true, optional = true }
navree-ai = { workspace = true, optional = true }
navree-api = { workspace = true, optional = true }
navree-audit = { workspace = true, optional = true }
navree-auth = { workspace = true, optional = true }
navree-billing = { workspace = true, optional = true }
navree-browser = { workspace = true, optional = true }
navree-workspace = { workspace = true, optional = true }
navree-oauth = { workspace = true, optional = true }
navree-flags = { workspace = true, optional = true }
navree-fleet = { workspace = true, optional = true }
navree-grpc = { workspace = true, optional = true }
navree-search = { workspace = true, optional = true }
navree-cache = { workspace = true, optional = true }
navree-crypto = { workspace = true, optional = true }
navree-db = { workspace = true, optional = true }
navree-dock = { workspace = true, optional = true }
navree-navigator = { workspace = true, optional = true }
navree-events = { workspace = true, optional = true }
navree-graphql = { workspace = true, optional = true }
navree-helm = { workspace = true, optional = true }
navree-harbor = { workspace = true, optional = true }
navree-http = { workspace = true, optional = true }
navree-http-client = { workspace = true, optional = true }
navree-i18n = { workspace = true, optional = true }
navree-lighthouse = { workspace = true, optional = true }
navree-log = { workspace = true, optional = true }
navree-logbook = { workspace = true, optional = true }
navree-mail = { workspace = true, optional = true }
navree-mcp = { workspace = true, optional = true }
navree-micro = { workspace = true, optional = true }
navree-notify = { workspace = true, optional = true }
navree-observe = { workspace = true, optional = true }
navree-orm = { workspace = true, optional = true }
navree-queue = { workspace = true, optional = true }
navree-redis = { workspace = true, optional = true }
navree-realtime = { workspace = true, optional = true }
navree-schedule = { workspace = true, optional = true }
navree-schema = { workspace = true, optional = true }
navree-session = { workspace = true, optional = true }
navree-social = { workspace = true, optional = true }
navree-storage = { workspace = true, optional = true }
navree-telemetry = { workspace = true, optional = true }
navree-testing = { workspace = true, optional = true }
navree-time = { workspace = true, optional = true }
navree-ui = { workspace = true, optional = true }
navree-validation = { workspace = true, optional = true }
navree-view = { workspace = true, optional = true }
navree-webhooks = { workspace = true, optional = true }

# Re-exported as `navree::axum` (extractors such as `Path` and `Query`), with
# the `http` feature.
axum = { workspace = true, optional = true }

[dev-dependencies]
# The `graphql` test's object derives name async-graphql directly, as an
# app's do.
async-graphql = { workspace = true }
# `tests/jose_docs.rs` builds fixture keys by hand.
base64 = { workspace = true }
chrono = { workspace = true }
# The request-pipeline benchmarks (`benches/pipeline.rs`).
criterion = { workspace = true }
garde = { workspace = true }
http-body-util = { workspace = true }
metrics = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
# The gRPC docs example: tonic's generated code names these crates.
prost = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[[test]]
name = "graphql"
required-features = ["graphql"]

# The gRPC docs example through the facade (`cargo test -p navree --features grpc --test grpc`).
[[test]]
name = "grpc"
required-features = ["grpc"]

# Redis through the facade (`cargo test -p navree --features redis --test redis`).
[[test]]
name = "redis"
required-features = ["redis"]

# The request-pipeline micro-benchmarks: `/json` through the whole router,
# a pool read, a validated insert and a unit of work on SQLite
# (`cargo bench -p navree --bench pipeline`).
[[bench]]
name = "pipeline"
harness = false
required-features = ["db", "validation"]
