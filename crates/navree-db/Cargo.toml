[package]
name = "navree-db"
description = "Navree DatabaseModule: SeaORM integration, unit of work, module migrations, seeders, factories and pagination."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## PostgreSQL driver (code paths exist; tests run on SQLite).
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
## MySQL and MariaDB driver (`mysql://` and `mariadb://` URLs).
mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql"]
## MySQL's RSA password exchange, for `caching_sha2_password` accounts on
## connections without TLS (pure Rust; it only encrypts the password with
## the server's public key). Without it, such accounts need TLS.
mysql-rsa = ["mysql", "dep:sqlx", "sqlx/mysql-rsa"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
navree-telemetry = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Only to turn on SQLx's `mysql-rsa` (the `mysql-rsa` feature); the code
# uses SQLx through `sea_orm::sqlx`.
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
# A scripted connection per backend: the MySQL and PostgreSQL statements the
# unit of work, repositories, pagination and migrations send, without a server.
sea-orm = { workspace = true, features = ["mock"] }
tempfile = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing-subscriber = { workspace = true }

# Against a real MySQL server: `NAVREE_TEST_MYSQL_URL` (see tests/mysql/main.rs).
[[test]]
name = "mysql"
path = "tests/mysql/main.rs"
required-features = ["mysql"]
