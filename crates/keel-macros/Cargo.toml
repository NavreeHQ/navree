[package]
name = "keel-macros"
description = "Keel attribute macros: #[module], #[injectable], #[controller] and route attributes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

# Macro tests expand against the runtime crates (allowed as dev-dependencies
# of keel-macros only; see crates/keel/tests/dependency_graph.rs). The DI
# macro tests (Task 12) need the kernel, plus keel-http for
# `#[module(controllers = [..])]`; the controller macro tests (Task 13) add
# axum and friends.
[dev-dependencies]
http = { workspace = true }
keel-http = { workspace = true }
keel-kernel = { workspace = true }
tokio = { workspace = true }
trybuild = { workspace = true }
