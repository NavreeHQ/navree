[package]
name = "navree-oauth"
description = "Navree OAuthServerModule: an OAuth 2.1 authorization server and OpenID Connect provider with scopes mapped to permissions, consent, device codes and personal access tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## The test suite on PostgreSQL (`NAVREE_TEST_DATABASE=postgres` with
## NAVREE_TEST_POSTGRES_URL).
postgres = ["navree-db/postgres"]
## The test suite on MySQL (`NAVREE_TEST_DATABASE=mysql` with NAVREE_TEST_MYSQL_URL).
mysql = ["navree-db/mysql"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
form_urlencoded = { workspace = true }
http = { workspace = true }
navree-access = { workspace = true }
navree-auth = { workspace = true }
navree-bounded = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
# Token digests, and `jose`: Ed25519 (EdDSA) ID tokens and the JWKS.
navree-crypto = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
# The OAuth tables are models (`Client`, `PersonalAccessToken`, ...).
navree-orm = { workspace = true }
# `navree_oauth::testing` drives the flows with navree-testing's TestClient.
navree-testing = { workspace = true }
# Workspace-limited clients pin their tokens with `PinnedWorkspace`.
navree-workspace = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
navree-api = { workspace = true }
# ID token signatures are checked with `ring` directly, apart from the code
# under test.
ring = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
