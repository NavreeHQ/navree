[package]
name = "navree-http-client"
description = "Navree HttpClientModule: outgoing HTTP with retries, timeouts, SSRF policy and fakes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "http", "client", "retry", "ssrf"]
categories = ["web-programming::http-client"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
# `Retry-After` given as an HTTP date.
chrono = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
ipnet = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-glob = { workspace = true }
navree-kernel = { workspace = true }
navree-telemetry = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
