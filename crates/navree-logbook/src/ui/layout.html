<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Logbook{% endblock %}</title>
<link rel="stylesheet" href="{{ base }}/assets/logbook.css">
<script src="{{ base }}/assets/logbook.js" defer></script>
</head>
<body data-base="{{ base }}">
<header class="top">
  <a class="brand" href="{{ base }}">Logbook</a>
  <form class="search" method="get" action="{{ base }}">
    {% if kind %}<input type="hidden" name="type" value="{{ kind }}">{% endif %}
    <input type="search" name="q" value="{{ q }}" placeholder="Filter: user:… tag:… status:4xx route:… slow failed duration>200" aria-label="Filter" autocomplete="off">
  </form>
  <button type="button" class="clear" data-clear="{{ base }}/api/entries">Clear</button>
</header>
{% block body %}{% endblock %}
</body>
</html>
