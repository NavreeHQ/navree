<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{ status }} {{ reason }} · {{ panel.title }}</title>
<link rel="stylesheet" href="{{ panel.base }}/assets/helm.css?v={{ panel.version }}">
<link rel="stylesheet" href="{{ panel.base }}/assets/theme.css?v={{ panel.version }}">
</head>
<body class="auth">
<main class="auth-card card" id="main">
  <p class="status-code">{{ status }}</p>
  <h1>{{ reason }}</h1>
  <p class="lead">{{ message }}</p>
  <p><a class="btn btn-primary" href="{{ panel.base }}">Back to {{ panel.title }}</a></p>
</main>
</body>
</html>
