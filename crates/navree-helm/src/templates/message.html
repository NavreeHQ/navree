{% extends "helm/layout.html" %}
{% block content %}
<div class="page-head">
  <h1>{{ heading }}</h1>
</div>
<section class="card">
  {% if text %}<p class="lead">{{ text }}</p>{% endif %}
  {% if link %}<p><a class="btn btn-primary" href="{{ link }}" rel="noopener noreferrer">{{ link_label }}</a></p>{% endif %}
  <p><a href="{{ back_url }}">Back</a></p>
</section>
{% endblock %}
