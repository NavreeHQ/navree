<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Forbidden · Lighthouse</title>
<link rel="stylesheet" href="{{ mount }}/assets/lighthouse.css">
</head>
<body>
<main class="auth">
  <div class="card">
    <div class="app-name">You can't open Lighthouse</div>
    <div class="muted small">Your account is signed in but lacks the <code>lighthouse.view</code> permission. Ask an administrator to grant it to one of your roles.</div>
    <a class="button" href="{{ mount }}/login">Sign in as someone else</a>
  </div>
</main>
</body>
</html>
