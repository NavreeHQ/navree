<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Two-factor code · Lighthouse</title>
<link rel="stylesheet" href="{{ mount }}/assets/lighthouse.css">
</head>
<body>
<main class="auth">
  <form class="card" method="post" action="{{ mount }}/login/two-factor">
    <div><div class="app-name">Two-factor authentication</div><div class="app-sub">Enter the code from your authenticator app, or a recovery code.</div></div>
    {% if error %}<div class="error-text small" role="alert">{{ error }}</div>{% endif %}
    <label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></label>
    <input type="hidden" name="challenge" value="{{ challenge }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <button class="primary" type="submit">Verify</button>
  </form>
</main>
</body>
</html>
