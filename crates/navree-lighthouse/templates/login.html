<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Lighthouse</title>
<link rel="stylesheet" href="{{ mount }}/assets/lighthouse.css">
</head>
<body>
<main class="auth">
  <form class="card" method="post" action="{{ mount }}/login">
    <div class="brand">
      <div class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9"/><path d="M7.8 4.7a6.14 6.14 0 0 0-.8 7.5"/><circle cx="12" cy="9" r="2"/><path d="M16.2 4.8c2 2 2.26 5.11.8 7.47"/><path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1"/><path d="M9.5 18h5"/><path d="m8 22 4-11 4 11"/></svg></div>
      <div><div class="app-name">Lighthouse</div><div class="app-sub">Sign in with your account</div></div>
    </div>
    {% if error %}<div class="error-text small" role="alert">{{ error }}</div>{% endif %}
    {% if available %}
    <label>Email<input type="email" name="email" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <button class="primary" type="submit">Sign in</button>
    {% endif %}
  </form>
</main>
</body>
</html>
