[package]
name = "navree-lighthouse"
description = "Navree LighthouseModule: application monitoring inside your app. Exceptions, slow requests and queries, failed jobs and outgoing HTTP grouped into issues, per-minute aggregates and traces, alerts to email, Slack and webhooks, and a dashboard at /_lighthouse."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
## MCP tools, a resource and a prompt on the app's MCP server (navree-mcp),
## so agents read and resolve issues. The facade turns it on when both its
## `lighthouse` and `mcp` features are on.
mcp = ["dep:navree-mcp", "dep:navree-validation"]
## PostgreSQL integration tests (`tests/postgres.rs`, with
## NAVREE_TEST_POSTGRES_URL): several processes recording into one database.
## Also the test suite on PostgreSQL (`NAVREE_TEST_DATABASE=postgres`).
postgres = ["navree-db/postgres"]
## The test suite on MySQL (`NAVREE_TEST_DATABASE=mysql` with NAVREE_TEST_MYSQL_URL).
mysql = ["navree-db/mysql"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
cookie = { workspace = true }
form_urlencoded = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
metrics = { workspace = true }
navree-access = { workspace = true }
navree-auth = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-crypto = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
navree-http-client = { workspace = true }
navree-kernel = { workspace = true }
navree-mail = { workspace = true }
navree-mcp = { workspace = true, optional = true }
navree-openapi = { workspace = true }
# The Lighthouse tables are models (issues, occurrences, samples, aggregates, alerts).
navree-orm = { workspace = true }
navree-schedule = { workspace = true }
navree-telemetry = { workspace = true }
# The MCP tools' arguments derive `Validate` (feature `mcp`).
navree-validation = { workspace = true, optional = true }
navree-view = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
navree-queue = { workspace = true }
navree-testing = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
