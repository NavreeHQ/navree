[package]
name = "navree-ui-macros"
description = "The derives of navree-ui (Form, Options, TableRow and FilterBar), used through navree-ui or navree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "ui", "derive"]
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
proc-macro = true

[lints]
workspace = true

# The expansions are tested where they are used: navree-ui's tests.
[dependencies]
heck = { workspace = true }
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
