[package]
name = "navree-notify"
description = "Navree NotifyModule: notifications over mail, database, broadcast, chat, SMS, WhatsApp, web push and native app push, with preferences and a delivery log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "notifications", "sms", "push"]
categories = ["email", "web-programming"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
features = ["ui"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[features]
# The database drivers of the gated server tests (`tests/notify/servers.rs`).
test-postgres = ["navree-db/postgres"]
test-mysql = ["navree-db/mysql"]
## `navree_notify::ui::NotificationBell`: the signed-in user's stored notifications in a Navree UI
## shell, and the routes it uses. The facade turns it on when both `ui` and `notify` are on.
ui = ["dep:navree-ui"]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
form_urlencoded = { workspace = true }
http = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
# VAPID signatures (ES256 through `jose`), push message encryption and
# the SigV4 signatures of SNS requests.
navree-crypto = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
# The Slack, Teams, Twilio, Vonage, SNS, WhatsApp and push service calls.
navree-http-client = { workspace = true }
navree-kernel = { workspace = true }
# `#[notification]`, re-exported next to the `Notification` trait.
navree-macros = { workspace = true }
navree-mail = { workspace = true }
# Stored notifications are models (`notifications::Model`), written by the
# database channel through the ORM, like the delivery log, the opt-outs and
# the push subscriptions.
navree-orm = { workspace = true }
# A new stored notification is told to the recipient's pages on the live hub.
navree-realtime = { workspace = true }
# `notify:release` every minute on the app's scheduler.
navree-schedule = { workspace = true }
navree-telemetry = { workspace = true }
# Quiet hours, send windows and digests on the recipient's clock (`Zone`,
# `SendWindow`, the `Zones` of users and workspaces).
navree-time = { workspace = true }
navree-ui = { workspace = true, optional = true }
# The digest templates, and workspace overrides rendered from text.
navree-view = { workspace = true }
# Numbers in E.164 (`Phone`) for the SMS and WhatsApp channels.
navree-validation = { workspace = true, features = ["phone"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The crate's own tests draw the bell.
navree-notify = { path = ".", features = ["ui"] }
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
navree-testing = { workspace = true }
# A browser's side of web push in the tests (decrypting what was pushed).
ring = { workspace = true }
tokio = { workspace = true }
# The documented configuration block, parsed in `tests/docs_surface.rs`.
toml = { workspace = true }
wiremock = { workspace = true }
