[package]
name = "navree-notify"
description = "Navree NotifyModule: notifications over mail, database, broadcast, Slack, Microsoft Teams, SMS (Twilio, Vonage, Amazon SNS), WhatsApp and web push, with read state, a delivery log, STOP opt-outs, push subscriptions, and preferences per category and channel, digests, quiet hours and send windows on the recipient's clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The database drivers of the gated server tests (`tests/notify/servers.rs`).
postgres = ["navree-db/postgres"]
mysql = ["navree-db/mysql"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
form_urlencoded = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
# VAPID signatures (ES256 through `jose`) and push message encryption.
navree-crypto = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
# The Slack, Teams, Twilio, Vonage, SNS, WhatsApp and push service calls.
navree-http-client = { workspace = true }
navree-kernel = { workspace = true }
# `#[notification]`, re-exported next to the `Notification` trait.
navree-macros = { workspace = true }
navree-mail = { workspace = true }
# Stored notifications are models (`notifications::Model`), written by the
# database channel through the ORM, like the delivery log, the opt-outs and
# the push subscriptions.
navree-orm = { workspace = true }
# `notify:release` every minute on the app's scheduler.
navree-schedule = { workspace = true }
navree-telemetry = { workspace = true }
# Quiet hours, send windows and digests on the recipient's clock (`Zone`,
# `SendWindow`, the `Zones` of users and workspaces).
navree-time = { workspace = true }
# The digest templates, and workspace overrides rendered from text.
navree-view = { workspace = true }
# Numbers in E.164 (`Phone`) for the SMS and WhatsApp channels.
navree-validation = { workspace = true, features = ["phone"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
navree-testing = { workspace = true }
# A browser's side of web push in the tests (decrypting what was pushed).
ring = { workspace = true }
tokio = { workspace = true }
# The documented configuration block, parsed in `tests/docs_surface.rs`.
toml = { workspace = true }
wiremock = { workspace = true }
