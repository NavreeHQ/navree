[package]
name = "navree-domains"
description = "Navree DomainsModule: workspaces on their own domains, verified through DNS, with automatic TLS certificates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "custom-domains", "acme", "tls"]
categories = ["web-programming", "network-programming"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
features = ["lighthouse"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[features]
default = []
## Reports certificates close to expiry to navree-lighthouse.
lighthouse = ["dep:navree-lighthouse"]
# The test suite on PostgreSQL / MySQL (`NAVREE_TEST_DATABASE=postgres` or `mysql`, with
# NAVREE_TEST_POSTGRES_URL / NAVREE_TEST_MYSQL_URL).
test-postgres = ["navree-db/postgres"]
test-mysql = ["navree-db/mysql"]

[dependencies]
bytes = { workspace = true }
chrono = { workspace = true }
# DNS lookups for verification: TXT, CNAME and addresses, the system's
# resolver configuration.
hickory-resolver = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
# ACME orders (Let's Encrypt or any RFC 8555 CA) on ring.
instant-acme = { workspace = true }
# Host lookups are cached for `domains.cache_secs`.
navree-bounded = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
# Certificate private keys and ACME account keys are sealed with the
# application key.
navree-crypto = { workspace = true }
navree-db = { workspace = true }
navree-events = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
navree-lighthouse = { workspace = true, optional = true }
navree-openapi = { workspace = true }
# Domains, certificates, challenges and ACME accounts are navree-orm models.
navree-orm = { workspace = true }
# `domains:verify --due` and `domains:certificates --due` on the scheduler.
navree-schedule = { workspace = true }
# Domains belong to workspaces; the `domain` resolver.
navree-workspace = { workspace = true }
rand = { workspace = true }
# AcmeFake signs certificates with a test root of its own (the rcgen
# instant-acme uses).
rcgen = { workspace = true }
# The ACME client's and the Cloudflare driver's requests.
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# The HTTPS listener of in-process ACME, and certificate probes.
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
# HTTP/2 over TLS against the HTTPS listener.
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util = { workspace = true }
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
navree-access = { workspace = true }
# The crate's own tests report to a LighthouseFake (feature `lighthouse`).
navree-domains = { path = ".", features = ["lighthouse"] }
navree-lighthouse = { workspace = true }
navree-testing = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
