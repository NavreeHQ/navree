[package]
name = "navree-ui-ext-macros"
description = "The file macros of navree-ui's extensions: a component's script and stylesheet read, scoped and hashed when a plugin compiles, used through navree-ui or navree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "ui", "css", "plugin", "macro"]
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
proc-macro = true

[lints]
workspace = true

# The expansions are tested where they are used (plugins/geo); the scoper's rules are tested here.
[dependencies]
# The stylesheet is read with the tokenizer browsers use.
cssparser = { workspace = true }
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
