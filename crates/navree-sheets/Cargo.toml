[package]
name = "navree-sheets"
description = "Navree SheetsModule: CSV and Excel exports (streamed downloads, queued files with signed links) and import pipelines (encoding detection, header mapping, row validation, a staging preview, batched apply, duplicate modes and error files)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## Export headers translated with navree-i18n's Fluent messages, and
## queued exports and imports run in the locale of the request that
## queued them (the facade's `i18n` turns it on).
i18n = ["dep:navree-i18n"]
## PostgreSQL for the tests: with `NAVREE_TEST_POSTGRES_URL` set, the
## import tests run on their own fresh PostgreSQL database.
postgres = ["navree-db/postgres", "navree-queue/postgres"]
## MySQL for the tests: with `NAVREE_TEST_MYSQL_URL` set, the import
## tests run on their own fresh MySQL database.
mysql = ["navree-db/mysql"]

[dependencies]
bytes = { workspace = true }
# XLS reading.
calamine = { workspace = true }
# A guess at the encoding of a legacy CSV upload (Windows-1256, Shift_JIS, ...).
chardetng = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
encoding_rs = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
navree-i18n = { workspace = true, optional = true }
navree-kernel = { workspace = true }
# `#[derive(Exportable)]` and `#[derive(Importable)]`, re-exported.
navree-macros = { workspace = true }
# Queued exports and imports run as operations, imports apply in batches.
navree-queue = { workspace = true }
# The XML of XLSX and ODS workbooks, read as a stream.
quick-xml = { workspace = true }
# Uploads, export files and error files live on a disk.
navree-storage = { workspace = true }
# Row messages, digit folding.
navree-validation = { workspace = true }
# The request's workspace (`InWorkspace`) on the routes.
navree-workspace = { workspace = true }
percent-encoding = { workspace = true }
# XLSX writing.
rust_xlsxwriter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
# The parts of XLSX, XLSB and ODS workbooks, and the sizes they declare.
zip = { workspace = true }

[dev-dependencies]
# The tests run on SQLite files (the driver is opt-in).
navree-db = { workspace = true, features = ["sqlite"] }
navree-access = { workspace = true }
navree-testing = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
