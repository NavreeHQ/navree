[package]
name = "keel-cli"
description = "The keel command-line tool: new, make:*, dev, and forwarding of runtime commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The generators, the dev loop and the forwarding live in a library so the
# integration tests can drive them without spawning the binary.
[lib]
name = "keel_cli"
path = "src/lib.rs"

[[bin]]
name = "keel"
path = "src/main.rs"
# The facade crate is also called `keel`; skip rustdoc for the binary.
doc = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
heck = { workspace = true }
minijinja = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
