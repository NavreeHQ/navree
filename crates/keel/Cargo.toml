[package]
name = "keel"
description = "Keel: a Laravel-class, NestJS-structured application framework on Rust and Tokio (facade crate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["full"]
## Every module crate.
full = [
    "access",
    "api",
    "audit",
    "auth",
    "cache",
    "crypto",
    "db",
    "events",
    "http",
    "http-client",
    "log",
    "mail",
    "notify",
    "observe",
    "queue",
    "realtime",
    "schedule",
    "session",
    "storage",
    "testing",
    "validation",
    "view",
]
# Each module feature turns on the features of the keel crates it builds
# on (spec §3), so `keel::<dependency>` is always there to name their types.
## L2
http = ["dep:keel-http", "dep:axum"]
log = ["dep:keel-log"]
crypto = ["dep:keel-crypto"]
events = ["dep:keel-events"]
view = ["dep:keel-view"]
cache = ["dep:keel-cache"]
http-client = ["dep:keel-http-client"]
## L3
db = ["dep:keel-db", "http"]
testing = ["dep:keel-testing", "http"]
observe = ["dep:keel-observe", "http"]
api = ["dep:keel-api", "http"]
mail = ["dep:keel-mail", "view"]
realtime = ["dep:keel-realtime", "http", "crypto"]
storage = ["dep:keel-storage", "http", "crypto"]
## L4
session = ["dep:keel-session", "http", "crypto", "db"]
validation = ["dep:keel-validation", "http", "db"]
audit = ["dep:keel-audit", "http", "db"]
queue = ["dep:keel-queue", "db"]
schedule = ["dep:keel-schedule", "db"]
access = ["dep:keel-access", "http", "db"]
notify = ["dep:keel-notify", "http", "db", "mail"]
## L5
auth = [
    "dep:keel-auth",
    "http",
    "db",
    "crypto",
    "validation",
    "cache",
    "mail",
    "access",
]
## PostgreSQL driver for keel-db.
postgres = ["db", "keel-db/postgres"]

[dependencies]
keel-config = { workspace = true }
keel-contracts = { workspace = true }
keel-kernel = { workspace = true }
keel-macros = { workspace = true }

keel-access = { workspace = true, optional = true }
keel-api = { workspace = true, optional = true }
keel-audit = { workspace = true, optional = true }
keel-auth = { workspace = true, optional = true }
keel-cache = { workspace = true, optional = true }
keel-crypto = { workspace = true, optional = true }
keel-db = { workspace = true, optional = true }
keel-events = { workspace = true, optional = true }
keel-http = { workspace = true, optional = true }
keel-http-client = { workspace = true, optional = true }
keel-log = { workspace = true, optional = true }
keel-mail = { workspace = true, optional = true }
keel-notify = { workspace = true, optional = true }
keel-observe = { workspace = true, optional = true }
keel-queue = { workspace = true, optional = true }
keel-realtime = { workspace = true, optional = true }
keel-schedule = { workspace = true, optional = true }
keel-session = { workspace = true, optional = true }
keel-storage = { workspace = true, optional = true }
keel-testing = { workspace = true, optional = true }
keel-validation = { workspace = true, optional = true }
keel-view = { workspace = true, optional = true }

# Re-exported as `keel::axum` (extractors such as `Path` and `Query`), with
# the `http` feature.
axum = { workspace = true, optional = true }

[dev-dependencies]
chrono = { workspace = true }
garde = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
