[package]
name = "navree-ui"
description = "Navree's UI toolkit: typed components rendered to HTML on the server, one stylesheet, and a small owned runtime that loads only when a page needs it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## The table's backend: `TableQuery::load`, `export_csv`, `BulkRequest::resolve`
## and stored views, through navree-orm. The facade turns it on when both `ui`
## and `orm` are on.
orm = ["dep:navree-orm", "dep:futures-util", "dep:tokio", "dep:base64"]

[dependencies]
base64 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
navree-orm = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
brotli = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
navree-ui-macros = { workspace = true }
navree-validation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
navree-testing = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
