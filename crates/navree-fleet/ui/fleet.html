<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fleet</title>
<link rel="stylesheet" href="{{ styles }}">
<script src="{{ script }}" defer></script>
</head>
<body data-base="{{ base }}" data-api="{{ api }}" data-login="{{ login }}" data-version="{{ version }}">
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 17h18M5 17l2-8h10l2 8M9 9V5h6v4"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Fleet</span>
        <span class="brand-sub">Queue workers</span>
      </div>
    </div>
    <nav class="sidebar-group" aria-label="Fleet">
      <div class="group-label">Monitor</div>
      <a class="nav-item" href="#overview" data-view="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        <span>Overview</span>
      </a>
      <a class="nav-item" href="#supervisors" data-view="supervisors">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 7h.01M7 17h.01"/></svg>
        <span>Supervisors</span>
        <span class="nav-count" id="count-processes"></span>
      </a>
      <a class="nav-item" href="#jobs" data-view="jobs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span>Jobs</span>
      </a>
      <a class="nav-item" href="#failed" data-view="failed">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
        <span>Failed jobs</span>
        <span class="nav-count" id="count-failed"></span>
      </a>
      <a class="nav-item" href="#metrics" data-view="metrics">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Metrics</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </div>
      <div class="user-text">
        <span class="user-name" id="user-name">Signed out</span>
        <span class="user-sub">Fleet {{ version }}</span>
      </div>
      <button class="icon-button" id="sign-out" type="button" title="Sign out" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-button" id="toggle-sidebar" type="button" title="Toggle the sidebar (Ctrl+B)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <span class="separator" aria-hidden="true"></span>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <span>Fleet</span>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span class="crumb-current" id="crumb">Overview</span>
      </nav>
      <div class="topbar-actions">
        <span class="status" id="fleet-status"><span class="dot"></span><span class="status-text">Loading</span></span>
        <span class="updated" id="updated"></span>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<noscript><p class="noscript">The Fleet dashboard needs JavaScript.</p></noscript>
</body>
</html>
