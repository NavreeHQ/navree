[package]
name = "navree-i18n-macros"
description = "Navree localization macros: embed_locales! embeds a directory of Fluent files in the binary, checking their syntax at compile time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "i18n", "macros"]
categories = ["development-tools::procedural-macro-helpers", "localization"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
fluent-syntax = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
