[package]
name = "navree-cache"
description = "Navree CacheModule: cache stores (a bounded memory store), remember, tags, stale-while-revalidate and atomic locks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "cache", "locks"]
categories = ["caching"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

# `CacheStoreKind` gained `Registered`, which names a driver a plugin
# registers. The enum is `#[non_exhaustive]`, so a new variant is not a
# breaking change (docs/prologue/versioning-and-support.mdx). What stops
# compiling is a cast of a variant to a number (`CacheStoreKind::Redis as
# u8`), which nothing documents.
[package.metadata.cargo-semver-checks.lints]
enum_discriminants_undefined_non_unit_variant = "allow"

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
navree-bounded = { workspace = true }
navree-config = { workspace = true }
navree-contracts = { workspace = true }
navree-kernel = { workspace = true }
navree-telemetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
