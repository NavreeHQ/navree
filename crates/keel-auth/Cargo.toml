[package]
name = "keel-auth"
description = "Keel AuthModule: NestJS-style JWT authentication with rotating refresh tokens, Passport-style strategies and user accounts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
form_urlencoded = { workspace = true }
garde = { workspace = true }
http = { workspace = true }
jsonwebtoken = { workspace = true }
# Only for `impl keel_access::Subject for user::Entity` (no module import).
keel-access = { workspace = true }
keel-cache = { workspace = true }
keel-config = { workspace = true }
keel-contracts = { workspace = true }
keel-crypto = { workspace = true }
keel-db = { workspace = true }
keel-http = { workspace = true }
keel-kernel = { workspace = true }
# keel-mail, qrcode2 and totp-rs: the account flows of plan Task 30
# (password reset mail, TOTP two-factor).
keel-mail = { workspace = true }
keel-validation = { workspace = true }
qrcode2 = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
totp-rs = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
keel-api = { workspace = true }
keel-observe = { workspace = true }
keel-testing = { workspace = true }
# Tests boot MailModule, which needs ViewModule.
keel-view = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
