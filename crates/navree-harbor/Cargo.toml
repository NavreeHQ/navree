[package]
name = "navree-harbor"
description = "Navree Harbor: server provisioning over SSH, zero-downtime releases with health checks and rollbacks, and push-to-deploy, from harbor.toml."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "deploy", "provisioning"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
include = ["src/**", "templates/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
aes-gcm = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
navree-template = { workspace = true }
rand = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
