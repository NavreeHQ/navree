[package]
name = "navree-cli"
description = "The navree command-line tool: new, make:*, dev, dock, and forwarding of runtime commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The generators, the dev loop and the forwarding live in a library so the
# integration tests can drive them without spawning the binary.
[lib]
name = "navree_cli"
path = "src/lib.rs"

[[bin]]
name = "navree"
path = "src/main.rs"
# The facade crate is also called `navree`; skip rustdoc for the binary.
doc = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
heck = { workspace = true }
minijinja = { workspace = true }
# `navree dock`: the CLI's only navree dependency (a tool crate, no runtime crates).
navree-dock = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
# `navree browser:install`: downloads Chrome for Testing (rustls with ring)
# and unpacks the zip.
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
# A local server for the browser:install download tests.
wiremock = { workspace = true }
