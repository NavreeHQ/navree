[package]
name = "navree-cli"
description = "The navree command-line tool: new, make:*, dev, dock, and forwarding of runtime commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The generators, the dev loop and the forwarding live in a library so the
# integration tests can drive them without spawning the binary.
[lib]
name = "navree_cli"
path = "src/lib.rs"

[[bin]]
name = "navree"
path = "src/main.rs"
# The facade crate is also called `navree`; skip rustdoc for the binary.
doc = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
heck = { workspace = true }
minijinja = { workspace = true }
# `navree dock` and `navree mcp` / `navree skills:install`: tool crates, no
# runtime crates (Navigator reads configuration with navree-config, D7).
navree-dock = { workspace = true }
navree-navigator = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
# `tests/navigator.rs`: rmcp's client over `navree mcp`'s stdio, and the
# fixture app's SQLite database.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
