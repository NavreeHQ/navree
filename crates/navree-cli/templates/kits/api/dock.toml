# Local services for development: `navree dock up` starts them in containers
# (Docker or Podman) and writes their settings into .env between
# `# dock:start` and `# dock:end`; `navree dev` and every forwarded command
# pass the same settings to the app. `navree dock:add redis` adds another.

# APP_DATABASE__URL=postgres://navree:navree@127.0.0.1:5432/<app>
[services.postgres]

# APP_MAIL__TRANSPORT=smtp://127.0.0.1:1025; the inbox is at http://localhost:8025
[services.mailpit]
