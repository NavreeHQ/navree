# Local services for development: `navree dock up` starts them in containers
# (Docker or Podman) and writes their settings into .env between
# `# dock:start` and `# dock:end`; `navree dev` and every forwarded command
# pass the same settings to the service. `navree dock:add redis` adds another.

# APP_DATABASE__URL=postgres://navree:navree@127.0.0.1:5432/<service>
[services.postgres]

# APP_MICRO__URL=nats://127.0.0.1:4222 (config/app.toml names the transport),
# with JetStream for durable events; monitoring at http://localhost:8222
[services.nats]
