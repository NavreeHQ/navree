reason = "picomatch 4.0.7 and earlier can take a very long time on a glob of a single-branch repeated extglob, and no fixed version is published. Here it is only part of the build and test tools (Vite, Vitest, Rollup and their file finders, and Nuxt's own kit for @navree/nuxt), which match the project's own glob patterns, never a pattern from outside. Move to the fixed picomatch the day it is published, and drop this entry."
