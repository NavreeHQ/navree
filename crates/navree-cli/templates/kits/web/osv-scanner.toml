# Findings in this app's pnpm-lock.yaml that have no release its tools can
# use. OSV-Scanner reads this file for the lockfile in the same folder only.
# Reviewed 2026-10-31; each entry expires so it gets looked at again.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "Fixed only in minimatch 11.0.1, and two development tools still resolve older lines. minimatch 3.1.5 comes from ESLint 9 (the last 9.x; @eslint/config-array 0.21.2 and @eslint/eslintrc 3.3.7) and from eslint-plugin-import 2.32.0, eslint-plugin-jsx-a11y 6.10.2 and eslint-plugin-react 7.37.5 (all at their latest releases), which call its default export; minimatch 11 has none, so forcing it breaks them (run with minimatch 11, eslint-plugin-react's jsx-pascal-case rule stops with 'TypeError: minimatch is not a function'), and ESLint 10 asks for minimatch 10, which is also affected. minimatch 5.1.9 is pinned exactly by @redocly/openapi-core 1.34.22 (the last 1.x), which openapi-typescript 7.13.0 (the latest) needs, and it too calls the default export. The third line, minimatch 10.2.6 under typescript-estree, is already moved to 11 by an override in pnpm-workspace.yaml. Not reachable with attacker input: ESLint and openapi-typescript (pnpm gen:api) run only on a developer machine and in CI, never in the built app, and the patterns they match come from the app's own ESLint and Redocly settings, which are trusted. Drop this entry once ESLint, its plugins and Redocly release versions that use minimatch 11."
