[package]
name = "navree-telemetry"
description = "Navree telemetry: typed events (requests, queries, jobs, mail, cache, outgoing HTTP, exceptions, logs, AI calls, broadcasts, storage, webhooks, searches, sign-ins, UI operations) delivered to registered sinks, and W3C trace context."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
navree-kernel = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
