[package]
name = "navree-telemetry"
description = "Navree telemetry: typed events (requests, queries, jobs, mail and more) delivered to registered sinks, and W3C trace context."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["navree", "telemetry", "tracing", "events"]
categories = ["development-tools::debugging"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
navree-kernel = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
