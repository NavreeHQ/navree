[package]
name = "navree-validation"
description = "Navree ValidationModule: Valid<T> extractors on garde, field-level messages, async unique/exists rules, international input (phone numbers, sanitized HTML, names and digits in any script, countries, locales)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
## `Phone`: E.164 phone numbers (rlibphonenumber, a port of libphonenumber) and
## `rules::phone`.
phone = ["dep:rlibphonenumber"]
## `SafeHtml`: rich text sanitized by the app's `HtmlPolicy` (ammonia).
html = ["dep:ammonia"]
## Runs the PostgreSQL suite (`NAVREE_TEST_POSTGRES_URL`).
postgres = ["navree-db/postgres"]
## Runs the MySQL suite (`NAVREE_TEST_MYSQL_URL`).
mysql = ["navree-db/mysql"]

[dependencies]
ammonia = { workspace = true, optional = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
form_urlencoded = { workspace = true }
garde = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
icu_locale_core = { workspace = true }
navree-config = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
rlibphonenumber = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
serde_urlencoded = { workspace = true }
thiserror = { workspace = true }
unicode-properties = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
navree-testing = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
