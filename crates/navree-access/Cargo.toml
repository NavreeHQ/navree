[package]
name = "navree-access"
description = "Navree AccessModule: roles, permissions and abilities with record checks and SQL list filters, shared with front ends as CASL JSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The ability engine (`src/engine`) is pure: rules, record checks, CASL JSON
# and SQL list filters. The AccessModule half adds the database tables,
# services, the route authorizer, extractors, endpoints and commands.
[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
navree-contracts = { workspace = true }
navree-db = { workspace = true }
navree-http = { workspace = true }
navree-kernel = { workspace = true }
moka = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
navree-testing = { workspace = true }
proptest = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
