[package]
name = "navis-auth"
description = "Navis AuthModule: NestJS-style JWT authentication with rotating refresh tokens, Passport-style strategies and user accounts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
form_urlencoded = { workspace = true }
garde = { workspace = true }
http = { workspace = true }
jsonwebtoken = { workspace = true }
# Only for `impl navis_access::Subject for user::Entity` (no module import).
navis-access = { workspace = true }
navis-cache = { workspace = true }
navis-config = { workspace = true }
navis-contracts = { workspace = true }
navis-crypto = { workspace = true }
navis-db = { workspace = true }
navis-http = { workspace = true }
navis-kernel = { workspace = true }
# navis-mail, qrcode2 and totp-rs: the account flows of plan Task 30
# (password reset mail, TOTP two-factor).
navis-mail = { workspace = true }
navis-validation = { workspace = true }
qrcode2 = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
totp-rs = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
navis-api = { workspace = true }
navis-observe = { workspace = true }
navis-testing = { workspace = true }
# Tests boot MailModule, which needs ViewModule.
navis-view = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
