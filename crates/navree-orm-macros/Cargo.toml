[package]
name = "navree-orm-macros"
description = "Navree ORM macros: #[derive(Model)] and #[scopes] (re-exported by navree-orm)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

# The expansions are tested where they are used: navree-orm's tests (derive
# behaviour and the compile-fail cases under tests/ui).
[dependencies]
# Checks `datetime_format` casts' formats when the model compiles.
chrono = { workspace = true }
heck = { workspace = true }
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
