[package]
name = "navree-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "libFuzzer targets for the parsers of untrusted input (a separate workspace: it needs a nightly toolchain)."

[package.metadata]
cargo-fuzz = true

# Not part of the root workspace: libFuzzer needs nightly and sanitizer flags.
[workspace]

[lib]
name = "navree_fuzz"
path = "src/lib.rs"

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
http = "1.5.0"
# The handler's body of `http_compression`, and the gzip it is checked with.
http-body = "1.0.1"
flate2 = "1.1.10"
# The HTTP/2 `:protocol` of a handshake.
hyper = { version = "1.12.0", features = ["http2", "server"] }
libfuzzer-sys = "0.4.13"
bytes = "1.12.1"
futures = { version = "0.3.34", default-features = false, features = ["executor"] }
# How `http_multipart` reads a `Content-Type`, and the header lines its
# reference reads.
httparse = "1.10.1"
mime = "0.3.17"
navree-auth = { path = "../crates/navree-auth" }
navree-cli = { path = "../crates/navree-cli" }
navree-config = { path = "../crates/navree-config" }
navree-contracts = { path = "../crates/navree-contracts" }
navree-crypto = { path = "../crates/navree-crypto" }
navree-directory = { path = "../crates/navree-directory" }
navree-glob = { path = "../crates/navree-glob" }
navree-documents = { path = "../crates/navree-documents", default-features = false, features = ["docx"] }
navree-domains = { path = "../crates/navree-domains" }
navree-http = { path = "../crates/navree-http" }
navree-kernel = { path = "../crates/navree-kernel" }
navree-logbook = { path = "../crates/navree-logbook" }
navree-mail = { path = "../crates/navree-mail", features = ["inbound"] }
navree-api = { path = "../crates/navree-api" }
navree-mcp = { path = "../crates/navree-mcp", features = ["fuzzing"] }
navree-micro = { path = "../crates/navree-micro" }
navree-oauth = { path = "../crates/navree-oauth" }
navree-openapi = { path = "../crates/navree-openapi" }
navree-pdf = { path = "../crates/navree-pdf" }
navree-phone = { path = "../crates/navree-phone" }
navree-schedule = { path = "../crates/navree-schedule" }
navree-search = { path = "../crates/navree-search", features = ["fuzzing"] }
navree-sheets = { path = "../crates/navree-sheets", features = ["fuzzing"] }
navree-sso = { path = "../crates/navree-sso", features = ["fuzzing"] }
navree-template = { path = "../crates/navree-template" }
navree-testing = { path = "../crates/navree-testing" }
navree-time = { path = "../crates/navree-time" }
navree-ui = { path = "../crates/navree-ui" }
navree-validation = { path = "../crates/navree-validation", features = ["phone", "html", "fuzzing"] }
navree-webhooks = { path = "../crates/navree-webhooks" }
rqrr = { version = "0.11.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "io-util", "time", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
# The independent URL parser `validation_parsers` checks the `url` rule against,
# and `validation_html` the schemes of sanitized URLs.
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde", "v7"] }
# The packages the `docx_read` target builds.
zip = { version = "9.1.2", default-features = false }
base64 = "0.23.1"

[profile.release]
debug = 1
# libFuzzer's panic hook aborts on every panic, including one that the code
# under test would catch with `catch_unwind`: a caught panic is still a bug.
overflow-checks = true
debug-assertions = true

# One target per parser of untrusted input (see CONTRIBUTING.md, "Fuzzing").

[[bin]]
name = "auth_jwt"
path = "fuzz_targets/auth_jwt.rs"
test = false
doc = false
bench = false

