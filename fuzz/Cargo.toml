[package]
name = "navree-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "libFuzzer targets for the parsers of untrusted input (a separate workspace: it needs a nightly toolchain)."

[package.metadata]
cargo-fuzz = true

# Not part of the root workspace: libFuzzer needs nightly and sanitizer flags.
[workspace]

[lib]
name = "navree_fuzz"
path = "src/lib.rs"

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
garde = { version = "0.23.0", default-features = false, features = ["derive"] }
http = "1.5.0"
libfuzzer-sys = "0.4.13"
axum = { version = "0.8.9", default-features = false }
futures = { version = "0.3.34", default-features = false, features = ["executor"] }
navree-auth = { path = "../crates/navree-auth" }
navree-config = { path = "../crates/navree-config" }
navree-contracts = { path = "../crates/navree-contracts" }
navree-crypto = { path = "../crates/navree-crypto" }
navree-directory = { path = "../crates/navree-directory" }
navree-domains = { path = "../crates/navree-domains" }
navree-http = { path = "../crates/navree-http" }
navree-kernel = { path = "../crates/navree-kernel" }
navree-logbook = { path = "../crates/navree-logbook" }
navree-mail = { path = "../crates/navree-mail", features = ["inbound"] }
navree-mcp = { path = "../crates/navree-mcp", features = ["fuzzing"] }
navree-micro = { path = "../crates/navree-micro" }
navree-oauth = { path = "../crates/navree-oauth" }
navree-schedule = { path = "../crates/navree-schedule" }
navree-search = { path = "../crates/navree-search", features = ["fuzzing"] }
navree-sso = { path = "../crates/navree-sso", features = ["fuzzing"] }
navree-testing = { path = "../crates/navree-testing" }
navree-time = { path = "../crates/navree-time" }
navree-validation = { path = "../crates/navree-validation", features = ["phone", "html"] }
navree-webhooks = { path = "../crates/navree-webhooks" }
rqrr = { version = "0.11.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "io-util", "time", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
utoipa = "6.0.0"
uuid = { version = "1.29.0", features = ["serde", "v7"] }
base64 = "0.23.1"

[profile.release]
debug = 1
# libFuzzer's panic hook aborts on every panic, including one that the code
# under test would catch with `catch_unwind`: a caught panic is still a bug.
overflow-checks = true
debug-assertions = true

# One target per parser of untrusted input (see CONTRIBUTING.md, "Fuzzing").

[[bin]]
name = "auth_jwt"
path = "fuzz_targets/auth_jwt.rs"
test = false
doc = false
bench = false

