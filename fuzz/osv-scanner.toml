# Known findings with no fixed release their dependents can use. Reviewed 2026-11-10;
# each entry expires so it gets looked at again.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2026-12-10
reason = "SQLite before 3.54.0 can return uninitialized page-cache memory when it opens a database together with a crafted -wal file whose page size differs. The bundled SQLite comes from libsqlite3-sys 0.37 through sqlx-sqlite 0.9.0, which allows libsqlite3-sys below 0.38 only; the fix is in libsqlite3-sys 0.39, which sqlx has not released yet. The fuzz targets open no database file that a less trusted party wrote. Drop this entry when sqlx 0.9.1 is released."
