# cargo-deny policy for the Navree workspace. CI runs `cargo deny check` on
# every pull request, on pushes to main and daily (.github/workflows/supply-chain.yml).
# Run it locally with `cargo deny check` (install: `cargo install --locked cargo-deny`).
#
# Changes to this file need a review from the code owners (.github/CODEOWNERS).

[graph]
# Check what a build with every feature compiles, for every target. That is
# the widest graph; a crate that only shows up on Windows or behind a feature
# is still held to the policy.
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) is an
# error. The advisory database is fetched on each run.
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Only what osv-scanner.toml already ignores, with the same reason. cargo-deny
# has no expiry field, so the date is in the reason: review (and drop) the
# entry on or before it, in both files.
ignore = []

[bans]
# Several versions of one crate bloat the build and the audit surface, so they
# warn. Each one that exists today is named under `skip` below with the
# reason; a new duplicate shows up as a warning in CI and should either be
# removed or added there with a reason.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# C TLS and crypto stacks are not allowed: Navree uses rustls and ring, and
# the RSA crate has an unfixed timing side channel (RUSTSEC-2023-0071).
deny = [
    { crate = "openssl", reason = "Use rustls. OpenSSL needs a system library and is not part of the supported TLS stack." },
    { crate = "openssl-sys", reason = "Use rustls. OpenSSL needs a system library and is not part of the supported TLS stack." },
    { crate = "native-tls", reason = "Use rustls. native-tls pulls in OpenSSL, Secure Transport or SChannel." },
    { crate = "rsa", reason = "RUSTSEC-2023-0071 (Marvin timing attack) has no fix. Use ring for RSA." },
]

# Duplicate versions that exist today (cargo-deny warns about new ones).
# The newest version of each crate stays unlisted; each older version below
# is named with who pulls it in. Remove an entry when its parent moves on.
