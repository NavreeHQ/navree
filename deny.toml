    { crate = "aes@0.8.4", reason = "Pulled in only by pkcs5@0.7.1; the rest of the tree is on 0.9.3." },
    { crate = "alloc-no-stdlib@2.0.4", reason = "Pulled in only by alloc-stdlib@0.2.4, brotli-decompressor@5.0.3; the rest of the tree is on 3.0.0." },
