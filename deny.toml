[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one git dependency: docx-rs 0.4.22 needs zip 8 (RUSTSEC-2026-0367, -0368,
# -0369, fixed in zip 9). The pinned commit moves it to zip 9.0.4
# (bokuweb/docx-rs#944). Drop this when a docx-rs release has the fix.
allow-git = ["https://github.com/bokuweb/docx-rs"]

[licenses]
version = 2
# Derived from `cargo deny list`: what the tree uses today. Dual-licensed
# crates ("A OR B") pass when either side is on this list, so self_cell
# (Apache-2.0 OR GPL-2.0-only) and r-efi (MIT OR Apache-2.0 OR
# LGPL-2.1-or-later) need nothing from the copyleft side.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# MPL-2.0 is file-level copyleft: fine to depend on and link, as long as the
# crates' own files stay unmodified and available. They come in through
# scraper's CSS engine (selectors, cssparser) and its number formatting.
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
]
