name: Windows table

# The data table of the Windows client and its gallery: built and tested with the dotnet command
# alone, then the gallery is started and pictured. It needs no Rust: the table does not call the core.

on:
  push:
    branches: ["feat/native-windows-table"]
    paths:
      - "packages/windows/**"
      - ".github/workflows/native-windows-table.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  table:
    name: Table and gallery
    runs-on: windows-2025
    timeout-minutes: 40
    concurrency:
      group: native-windows-table-${{ github.ref }}
      cancel-in-progress: true
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore
        shell: pwsh
        working-directory: packages/windows
        run: |
          dotnet restore tests/Navree.Controls.Tests/Navree.Controls.Tests.csproj
          dotnet restore demo/Navree.Gallery/Navree.Gallery.csproj

      - name: Build
        shell: pwsh
        working-directory: packages/windows
        run: |
          dotnet build tests/Navree.Controls.Tests/Navree.Controls.Tests.csproj -c Release --no-restore
          dotnet build demo/Navree.Gallery/Navree.Gallery.csproj -c Release --no-restore

      - name: Unit tests
        shell: pwsh
        working-directory: packages/windows
        run: dotnet test tests/Navree.Controls.Tests/Navree.Controls.Tests.csproj -c Release --no-build --logger "trx;LogFileName=controls.trx" --logger "console;verbosity=normal" --results-directory "$env:RUNNER_TEMP/trx"

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-table-test-reports
          if-no-files-found: ignore
          path: ${{ runner.temp }}/trx
          retention-days: 14

      # The gallery is started with the scenarios to run; each time it is ready a picture of its window is taken.
      - name: The winapp command
        continue-on-error: true
        uses: microsoft/setup-WinAppCli@9288bd0729bd3f71e2ed1b9eb247dc91470b824e # v0.3

      - name: Run the gallery and take pictures
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Gallery/bin/Release -Recurse -Filter Navree.Gallery.exe | Select-Object -First 1
          if (-not $exe) { throw "the gallery was not built" }
          powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/run-gallery.ps1 -Exe $exe.FullName -OutDir "$env:RUNNER_TEMP\gallery" -Run "table,pointer,rows100k,stick,anchor"

      - name: What the gallery measured
        if: always()
        shell: pwsh
        run: |
          foreach ($name in 'script.txt', 'results.txt', 'analysis.txt') {
            "---- $name"
            if (Test-Path "$env:RUNNER_TEMP/gallery/$name") { Get-Content "$env:RUNNER_TEMP/gallery/$name" } else { "(not written)" }
          }

      # The same tables at larger text and in the system's high contrast colours. The system may not take
      # either on a hosted machine, so what it was told and what the gallery read are both kept.
      - name: Run the gallery at larger text
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Gallery/bin/Release -Recurse -Filter Navree.Gallery.exe | Select-Object -First 1
          $key = 'HKCU:\Software\Microsoft\Accessibility'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          try {
            foreach ($scale in 150, 225) {
              Set-ItemProperty -Path $key -Name TextScaleFactor -Value $scale -Type DWord -Force
              Start-Sleep -Seconds 2
              powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/run-gallery.ps1 -Exe $exe.FullName -OutDir "$env:RUNNER_TEMP\gallery-text$scale" -Run "tabletext" -Seconds 200
            }
          } finally {
            Remove-ItemProperty -Path $key -Name TextScaleFactor -ErrorAction SilentlyContinue
          }

      - name: Run the gallery in high contrast
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Gallery/bin/Release -Recurse -Filter Navree.Gallery.exe | Select-Object -First 1
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/set-contrast.ps1 -On
            powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/run-gallery.ps1 -Exe $exe.FullName -OutDir "$env:RUNNER_TEMP\gallery-contrast" -Run "tabletext" -Seconds 200
          } finally {
            powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/set-contrast.ps1 -Off
          }

      - name: Keep the larger text and high contrast pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-gallery-settings
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/gallery-text150
            ${{ runner.temp }}/gallery-text225
            ${{ runner.temp }}/gallery-contrast
          retention-days: 30

      - name: Keep the pictures and measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-gallery
          if-no-files-found: ignore
          path: ${{ runner.temp }}/gallery
          retention-days: 30
