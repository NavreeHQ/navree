# navree-storage and navree-plugin-godam against real cloud object-store
# emulators on Linux: MinIO (S3), fake-gcs-server (Google Cloud Storage) and
# Azurite (Azure Blob Storage), each pinned by container image digest.
name: Storage

on:
  push:
    branches: [main]
    paths:
      - "crates/navree-storage/**"
      - "crates/navree-crypto/**"
      - "crates/navree-http/**"
      - "crates/navree-config/**"
      - "crates/navree-contracts/**"
      - "crates/navree-kernel/**"
      - "crates/navree-telemetry/**"
      - "plugins/godam/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/storage.yml"
  pull_request:
    paths:
      - "crates/navree-storage/**"
      - "crates/navree-crypto/**"
      - "crates/navree-http/**"
      - "crates/navree-config/**"
      - "crates/navree-contracts/**"
      - "crates/navree-kernel/**"
      - "crates/navree-telemetry/**"
      - "plugins/godam/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/storage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navree-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_BACKTRACE: "1"
      NAVREE_TEST_REQUIRE_SERVICES: "1"
      NAVREE_TEST_S3_URL: http://navreetest:navreetest-secret@127.0.0.1:9000/navree-test
      NAVREE_TEST_GCS_URL: http://127.0.0.1:4443/navree-test
      NAVREE_TEST_AZURE_URL: http://127.0.0.1:10000/devstoreaccount1/navree-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start MinIO, fake-gcs-server and Azurite
        run: |
          docker run --detach --name minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=navreetest \
            --env MINIO_ROOT_PASSWORD=navreetest-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data

          docker run --detach --name fake-gcs \
            --publish 127.0.0.1:4443:4443 \
            fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef \
            -scheme http -port 4443 -external-url http://127.0.0.1:4443 -public-host 127.0.0.1:4443 -backend memory

          docker run --detach --name azurite \
            --publish 127.0.0.1:10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --inMemoryPersistence --skipApiVersionCheck --loose

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null \
              && curl --fail --silent http://127.0.0.1:4443/storage/v1/b >/dev/null \
              && (exec 3<>/dev/tcp/127.0.0.1/10000) 2>/dev/null; then
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
                'http://127.0.0.1:4443/storage/v1/b?project=navree-test' \
                --header 'Content-Type: application/json' --data '{"name":"navree-test"}')"
              if [ "$status" = 200 ] || [ "$status" = 409 ]; then
                exit 0
              fi
            fi
            sleep 1
          done
          echo "One or more storage emulators did not start" >&2
          docker logs minio >&2 || true
          docker logs fake-gcs >&2 || true
          docker logs azurite >&2 || true
          exit 1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test navree-storage (all features)
        run: cargo test --locked -p navree-storage --all-features --no-fail-fast

      - name: Test navree-storage (no cloud features)
        env:
          NAVREE_TEST_REQUIRE_SERVICES: ""
        run: cargo test --locked -p navree-storage --no-default-features --no-fail-fast

      - name: Test navree-plugin-godam
        run: cargo test --locked -p navree-plugin-godam --no-fail-fast

      - name: Show emulator logs on failure
        if: ${{ failure() }}
        run: |
          for name in minio fake-gcs azurite; do
            echo "::group::$name"
            docker logs --tail 60 "$name" 2>&1 || true
            echo "::endgroup::"
          done
