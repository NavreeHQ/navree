# Every Rust test suite in the workspace, on Linux and on Windows.
#
# Linux runs against real servers: SQLite, PostgreSQL 17 with TimescaleDB,
# MySQL 8.4, MariaDB and MongoDB 8.0 (replica set rs0), plus Redis, an S3
# server, Google Cloud Storage and Azure Blob emulators, Qdrant, pgvector,
# Typesense, Meilisearch, stripe-mock, Pebble, NATS, MQTT, Kafka, RabbitMQ and
# four Mailpit servers (plain, with login, STARTTLS, TLS).
# scripts/ci-services.sh starts them from scripts/services/compose.yml; the
# suites find them through NAVREE_TEST_* variables.
# NAVREE_TEST_REQUIRE_SERVICES=1 turns a missing server, Chrome, Node.js or
# FFmpeg into a failure instead of a skip. Each run keeps its output (cargo
# test ... -- --show-output) and a step counts the "skipped" notices in it: a
# service test that skipped itself fails the job.
# The job builds every test binary once (all features), then runs:
#
# 1. the whole workspace on SQLite, with the servers up for the suites that
#    name them (unit tests, integration tests, doctests);
# 2. the 26 crates that take their database from NAVREE_TEST_DATABASE again on
#    PostgreSQL and on MySQL;
# 3. the crates with code that only exists when a feature is off, on their
#    default features;
# 4. the navree-mcp suite that drives the official TypeScript SDK.
#
# Windows runs the workspace on SQLite (a hosted Windows runner has no Linux
# containers, so the suites that name a server print SKIPPED and pass), with
# Chrome, Node.js and FFmpeg.
#
# Once a month a third job builds the projects `navree new` generates (the API,
# SaaS and microservice kits) and runs their own tests and lints: the suites
# marked `#[ignore]` in navree-cli, minutes each.
#
# The schedule is not on every push: a run takes about an hour and a half on
# a two-core Linux runner, and Windows minutes count twice. Linux runs weekly;
# Windows and the generated projects run monthly. Estimated minutes (from the
# CPU time of a local build and test run of the workspace, not yet measured on
# the runners): Linux about 100 a run, Windows about 80 a run (160 billed), the
# generated projects about 75; about 670 billed minutes a month. Compiling the
# workspace's own crates dominates, so the dependency cache saves little. Run
# the workflow by hand (workflow_dispatch) after changing a crate that nothing
# else covers, and before a release on both platforms.
#
# Not run here: the measurements marked `#[ignore]` in navree-http and
# navree-db (timings printed for a person to read), the fixture rewriter in
# navree-cli (`config_fixtures`), the fuzz targets (fuzz.yml) and the Playwright
# and evidence suites (they are not Rust suites).
name: Rust suites

on:
  schedule:
    # Sundays 03:47 UTC: Linux.
    - cron: "47 3 * * 0"
    # The first of the month, 04:47 UTC: Windows and the generated projects.
    - cron: "47 4 1 * *"
  workflow_dispatch:
    inputs:
      linux:
        description: Linux (real servers)
        type: boolean
        default: true
      windows:
        description: Windows (SQLite)
        type: boolean
        default: true
      generated:
        description: Generated projects (slow)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rust-suites-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Debug info makes test binaries several times larger and nothing here reads
  # it; no incremental state is kept between runs.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # The crates whose suites take their database from NAVREE_TEST_DATABASE
  # (sqlite, postgres or mysql).
  DATABASE_CRATES: >-
    navree-access navree-ai navree-audit navree-auth navree-billing
    navree-directory navree-domains navree-flags navree-fleet navree-helm
    navree-i18n navree-integrations navree-lighthouse navree-logbook
    navree-media navree-notify navree-oauth navree-queue navree-search
    navree-settings navree-sheets navree-social navree-sso navree-webhooks
    navree-workflows navree-workspace
  # The crates with code or tests that only exist when a feature is off.
  FEATURE_OFF_CRATES: >-
    navree-documents navree-helm navree-logbook navree-media navree-micro
    navree-observe navree-search navree-sheets navree-storage navree-validation

jobs:
  linux:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 3 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.linux)
    # MongoDB refuses to start on Linux kernels 6.19 through 7.0.13 (a TCMalloc
    # incompatibility; see the warning in the MongoDB 8.0 release notes), and
    # the ubuntu-24.04 image from 2026-10-25 ships such a kernel (the same
    # reason mongodb.yml runs on ubuntu-22.04). Move back to ubuntu-latest once
    # its kernel is 7.0.14 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # Fail instead of skipping when a server, Chrome, Node.js or FFmpeg is
      # missing.
      NAVREE_TEST_REQUIRE_SERVICES: "1"
      # Dock starts and removes its own Redis and Mailpit containers.
      NAVREE_TEST_DOCKER: "1"
      # The Software-as-a-Service kit's web app: pnpm install, lint, test and build.
      NAVREE_TEST_KIT_WEB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          # The test binaries of the whole workspace are several gigabytes.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL"
          df --human-readable /

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # navree-cli's suites format and lint the projects they generate.
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A cold build is the longest step: keep what it compiled when a
          # test fails, so the next run starts from it.
          cache-on-failure: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/crm-web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/crm-web/pnpm-lock.yaml

      - name: Install FFmpeg, find Chrome
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          # navree-documents takes Chrome from this variable.
          chrome="$(command -v google-chrome)"
          "$chrome" --version
          echo "NAVREE_BROWSER_CHROME=$chrome" >> "$GITHUB_ENV"
          # A runner may refuse unprivileged user namespaces, which Chrome's
          # sandbox needs (the key does not exist on every image).
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build every test binary
        run: |
          # The images download while the compiler works (the network and the
          # CPU are not competing), the servers start once it is done.
          scripts/ci-services.sh pull &
          pulling=$!
          cargo test --locked --workspace --all-features --no-run
          wait "$pulling"
          df --human-readable /

      - name: Build crm-web
        # The browser journeys of crm-api drive its production build.
        run: |
          pnpm --dir apps/crm-web install --frozen-lockfile
          pnpm --dir apps/crm-web build

      - name: Start the servers
        id: servers
        run: scripts/ci-services.sh start

      - name: Test the workspace on SQLite
        shell: bash
        run: |
          mkdir -p target/logs
          cargo test --locked --workspace --all-features --no-fail-fast -- --show-output 2>&1 | tee target/logs/sqlite.log

      - name: Test on PostgreSQL
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        shell: bash
        env:
          NAVREE_TEST_DATABASE: postgres
        run: |
          packages=()
          for crate in $DATABASE_CRATES; do packages+=(--package "$crate"); done
          cargo test --locked --all-features --no-fail-fast --tests "${packages[@]}" -- --show-output 2>&1 | tee target/logs/postgres.log

      - name: Test on MySQL
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        shell: bash
        env:
          NAVREE_TEST_DATABASE: mysql
        run: |
          packages=()
          for crate in $DATABASE_CRATES; do packages+=(--package "$crate"); done
          cargo test --locked --all-features --no-fail-fast --tests "${packages[@]}" -- --show-output 2>&1 | tee target/logs/mysql.log

      - name: Count the skipped service tests
        # With NAVREE_TEST_REQUIRE_SERVICES=1 a service test fails instead of
        # skipping, so a "skipped" notice that is not on the list of by-design
        # skips (scripts/services/skips.allow) means a test did not check
        # that.
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        shell: bash
        run: |
          status=0
          for log in target/logs/sqlite.log target/logs/postgres.log target/logs/mysql.log; do
            echo "::group::$log"
            scripts/ci-services.sh check-skips "$log" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Test with the default features
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        env:
          # The server suites are compiled out of these builds.
          NAVREE_TEST_REQUIRE_SERVICES: ""
        run: |
          packages=()
          for crate in $FEATURE_OFF_CRATES; do packages+=(--package "$crate"); done
          cargo test --locked --no-fail-fast --tests "${packages[@]}"

      - name: Test navree-mcp against the TypeScript SDK
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        run: |
          npm ci --prefix e2e/mcp-sdk --ignore-scripts
          cargo test --locked --workspace --all-features --test sdk_conformance -- --ignored --nocapture

      - name: Show the servers' logs after a failure
        if: ${{ failure() }}
        run: |
          for name in $(docker ps --all --format '{{.Names}}' | grep '^navree-ci-'); do
            echo "::group::$name"
            docker logs --tail 60 "$name" 2>&1 || true
            echo "::endgroup::"
          done

  windows:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 4 1 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.windows)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/crm-web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/crm-web/pnpm-lock.yaml

      - name: Install FFmpeg, find Chrome
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version | Select-Object -First 1
          # navree-documents takes Chrome from this variable.
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $chrome)) { throw "Chrome is not at $chrome" }
          "NAVREE_BROWSER_CHROME=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Build every test binary
        run: cargo test --locked --workspace --all-features --no-run

      - name: Build crm-web
        # The browser journeys of crm-api drive its production build.
        run: |
          pnpm --dir apps/crm-web install --frozen-lockfile
          pnpm --dir apps/crm-web build

      - name: Test the workspace on SQLite
        run: cargo test --locked --workspace --all-features --no-fail-fast

      - name: Test with the default features
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $packages = "$env:FEATURE_OFF_CRATES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { '--package'; $_ }
          cargo test --locked --no-fail-fast --tests @packages

  generated:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 4 1 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.generated)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL"
          df --human-readable /

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Test the generated projects
        # Each test generates a project that depends on this checkout, builds
        # it (the framework compiles once into target/generated-kits, shared by
        # the kits), and runs its tests, clippy and its own commands.
        run: >-
          cargo test --locked --package navree-cli --all-features --no-fail-fast
          --test generated_app --test generated_kits --test navigator
          -- --ignored --test-threads 1
