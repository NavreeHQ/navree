# Static analysis: Semgrep (the registry's Rust, TypeScript, JavaScript, React,
# GitHub Actions and Dockerfile rulesets plus Navree's own rules in .semgrep/)
# and Gitleaks (the git history and the working tree). A finding fails the job.
#
# Each job sends its SARIF reports to GitHub code scanning and keeps them, with
# the text reports, as a workflow artifact. A pull request from a fork has no
# permission to write to code scanning, so its reports stay an artifact, and
# so do those of a private repository, which code scanning does not accept
# without a paid plan. Both
# jobs run scripts/sast.sh, the same script as a local run (see "Static
# analysis" in CONTRIBUTING.md), which holds the scanner images, pinned by
# digest.
#
# Runs on pushes to main, on pull requests and every week. On a pull request
# Semgrep reports only what the change introduces (diff-aware); the weekly
# run scans everything again, so a registry rule that learns something new
# fails here rather than staying hidden.
name: SAST

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      # The whole history, so the pull request's base commit is there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the custom rules against their fixtures
        run: scripts/sast.sh semgrep-test
      - name: Scan with Semgrep
        env:
          SEMGREP_BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: scripts/sast.sh semgrep
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() && github.event.repository.private == false && hashFiles('sast-reports/semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: sast-reports/semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: semgrep-reports
          path: sast-reports/
          if-no-files-found: ignore
          retention-days: 30

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Every commit on a push to main and on the weekly run; on a pull
      # request, the commits it adds. The working tree is always scanned.
      - name: Scan for secrets
        env:
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--all' }}
        run: scripts/sast.sh secrets
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() && github.event.repository.private == false && hashFiles('sast-reports/gitleaks-history.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: sast-reports/gitleaks-history.sarif
          category: gitleaks-history
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() && github.event.repository.private == false && hashFiles('sast-reports/gitleaks-tree.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: sast-reports/gitleaks-tree.sarif
          category: gitleaks-tree
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: gitleaks-reports
          path: sast-reports/
          if-no-files-found: ignore
          retention-days: 30
