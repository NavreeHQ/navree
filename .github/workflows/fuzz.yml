# Fuzzing of the parsers that handle untrusted input (the targets in fuzz/:
# one per parser, see CONTRIBUTING.md, "Fuzzing").
#
# - Pushes to main that touch a fuzzed crate or fuzz/ run every target for 60
#   seconds.
# - A nightly schedule runs every target for 10 minutes (and trims each
#   corpus afterwards).
# - Corpora are cached between runs, so every run starts from what the
#   earlier ones found; the committed seeds (fuzz/seeds) are always read too.
# - A crash fails the target's job and its input is uploaded as an artifact.
#
# The nightly toolchain and cargo-fuzz are pinned here and in fuzz/Dockerfile:
# change them together.
name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - "crates/navree-auth/**"
      - "crates/navree-config/**"
      - "crates/navree-contracts/**"
      - "crates/navree-crypto/**"
      - "crates/navree-directory/**"
      - "crates/navree-domains/**"
      - "crates/navree-http/**"
      - "crates/navree-mail/**"
      - "crates/navree-mcp/**"
      - "crates/navree-logbook/**"
      - "crates/navree-micro/**"
      - "crates/navree-oauth/**"
      - "crates/navree-schedule/**"
      - "crates/navree-search/**"
      - "crates/navree-sso/**"
      - "crates/navree-time/**"
      - "crates/navree-validation/**"
      - "crates/navree-webhooks/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        default: "60"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  NIGHTLY: nightly-2026-10-20
  CARGO_FUZZ: 0.13.2
  CARGO_INCREMENTAL: "0"

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - auth_jwt
          - config_sources
          - host_names
          - http_client_ip
          - http_cors
          - jose_keys
          - jose_token
          - mail_inbound
          - mcp_protocol
          - mcp_server
          - micro_envelope
          - qr_roundtrip
          - schedule_cron
          - scim_filter
          - small_parsers
          - search_query
          - sso_saml_metadata
          - sso_saml_response
          - sso_xml
          - time_parse
          - totp_uri
          - validation_international
          - webhooks_signatures
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '600' || github.event.inputs.seconds || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.NIGHTLY }}

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ }}

      # The build of every target is shared: only the first job of a run
      # pays for it, and only runs on main save it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          shared-key: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore the corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # Seeds are read from fuzz/seeds/<target>; what the run finds is
      # written to fuzz/corpus/<target>. `-timeout` is the hang limit of one
      # input, `-rss_limit_mb` the memory limit.
      - name: Fuzz ${{ matrix.target }} for ${{ env.SECONDS_PER_TARGET }} seconds
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}" "fuzz/seeds/${{ matrix.target }}"
          cargo fuzz run "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" "fuzz/seeds/${{ matrix.target }}" \
            -- -max_total_time="${SECONDS_PER_TARGET}" -timeout=10 -rss_limit_mb=2048 -max_len=8192

      - name: Trim the corpus
        if: github.event_name == 'schedule'
        run: cargo fuzz cmin "${{ matrix.target }}" "fuzz/corpus/${{ matrix.target }}"

      - name: Save the corpus
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
