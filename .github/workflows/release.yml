# Publishes a release when a tag v<version> is pushed (the merge commit of
# the release pull request that release-prepare.yml opened):
#
# 1. verify: the tag matches the workspace version, `cargo xtask release
#    check` passes, every crate is built as it will be published (`cargo
#    xtask release publish --dry-run`) and the npm packages pack.
# 2. github-release: a draft GitHub Release with the version's CHANGELOG.md
#    section.
# 3. binaries: the `navree` CLI for Linux, macOS and Windows, attached to the
#    draft with a SHA-256 file each.
# 4. crates (environment `crates-io`, which asks for an approval): `cargo
#    xtask release publish`, in dependency order. It resumes: run the job
#    again after a stop, and the crates the registry has are skipped.
#    Crates that exist on crates.io publish with trusted publishing, a fresh
#    30-minute token for every 25 crates. A crate's very first publish needs
#    an API token instead: store it in the environment as CARGO_REGISTRY_TOKEN
#    for that release (scopes publish-new and publish-update, crates
#    `navree*`, a day's expiry) and delete it afterwards. 75 new crates take
#    about 12 hours at crates.io's rate for new crates, longer than a job may
#    run, so the first release publishes from a maintainer's machine with the
#    same command and this job then finds every crate published.
# 5. npm (environment `npm`, which asks for an approval): the five
#    `@navree/*` packages with provenance (`pnpm -r publish`, which skips a
#    version npm has already). The secret NPM_TOKEN is used when set (a
#    package's first publish); otherwise npm's trusted publishing.
# 6. publish-release: the draft becomes the release; the branch docs/<major>.x
#    moves to the tag, and the website and the skeleton repository are told
#    (with the secret RELEASE_DISPATCH_TOKEN, when set).
#
# sbom.yml also runs on the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    # The dry run builds every crate as it will be published.
    timeout-minutes: 240
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL"
          df --human-readable /

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: The tag is the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.name == "navree") | .version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::the tag $TAG does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release checks
        run: cargo xtask release check

      - name: Build every crate as it will be published
        # Stages Navigator's files, then `cargo publish --dry-run` of every
        # crate, and lists which the registry has already.
        run: cargo xtask release publish --dry-run

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/js/pnpm-lock.yaml

      - name: Pack the npm packages
        working-directory: packages/js
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p ../../target/npm
          pnpm -r pack --pack-destination ../../target/npm
          ls -l ../../target/npm

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "[] ]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\nInstall the CLI with `cargo install navree-cli`, or download it below. Add Navree to an app with `cargo add navree`.\n' >> notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag $prerelease \
              --title "Navree $VERSION" --notes-file notes.md
          fi

  binaries:
    needs: [verify, github-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build the CLI
        shell: bash
        run: |
          # Navigator embeds the copies the published crate carries.
          cargo xtask release stage
          cargo build --release --locked --package navree-cli --bin navree --target ${{ matrix.target }}

      - name: Package and attach
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="navree-cli-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "../target/$TARGET/release/navree.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
            sha256sum "$archive" > "$archive.sha256"
          else
            cp "../target/$TARGET/release/navree" "$name/"
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
            if command -v sha256sum > /dev/null; then
              sha256sum "$archive" > "$archive.sha256"
            else
              shasum -a 256 "$archive" > "$archive.sha256"
            fi
          fi
          gh release upload "$TAG" "$archive" "$archive.sha256" --clobber

  crates:
    needs: verify
    runs-on: ubuntu-latest
    # The most a job may run; run it again to resume after a stop.
    timeout-minutes: 350
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Publish the crates
        env:
          FIRST_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # The verify job built every crate as published, on this commit.
          if [ -n "$FIRST_PUBLISH_TOKEN" ]; then
            export CARGO_REGISTRY_TOKEN="$FIRST_PUBLISH_TOKEN"
            cargo xtask release publish --skip-verify
          else
            cargo xtask release publish --skip-verify --trusted-publishing
          fi

      - name: Keep the publish log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-log-${{ github.ref_name }}-${{ github.run_attempt }}
          path: target/release/publish-*.log
          if-no-files-found: ignore

  npm:
    needs: [verify, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: packages/js/pnpm-lock.yaml

      - name: Build the packages
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish the packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Private packages (@navree/deepmerge) are skipped, and so is a
          # version npm already has. `workspace:*` becomes the exact version.
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          pnpm -r publish --access public --provenance --no-git-checks

      - name: Check that npm has every package
        # `pnpm -r publish` also succeeds when it publishes nothing (it skips
        # any version it believes npm has), so ask npm for each one.
        run: |
          missing=0
          for file in */package.json; do
            if [ "$(jq -r '.private // false' "$file")" = true ]; then
              continue
            fi
            spec="$(jq -r '.name + "@" + .version' "$file")"
            found=""
            for _ in 1 2 3 4 5 6; do
              found="$(npm view "$spec" version 2> /dev/null || true)"
              [ -n "$found" ] && break
              sleep 10
            done
            if [ -n "$found" ]; then
              echo "$spec is on npm"
            else
              echo "::error::$spec is not on npm"
              missing=1
            fi
          done
          exit "$missing"

  publish-release:
    needs: [verify, binaries, crates, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false

      - name: Move the docs branch to the release
        # navree.com builds its docs from docs/<major>.x, so it describes
        # the released version. Not for pre-releases.
        if: ${{ !contains(needs.verify.outputs.version, '-') }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: git push --force origin "HEAD:refs/heads/docs/${VERSION%%.*}.x"

      - name: Tell the website and the skeleton
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RELEASE_DISPATCH_TOKEN is not set: deploy the website and regenerate the skeleton by hand"
            exit 0
          fi
          for repo in NavreeHQ/website NavreeHQ/skeleton; do
            gh api "repos/$repo/dispatches" \
              --field event_type=navree-release \
              --field "client_payload[version]=$VERSION"
          done
