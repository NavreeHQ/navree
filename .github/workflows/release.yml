# Publishes a release when a tag v<version> is pushed (the merge commit of
# the release pull request that release-prepare.yml opened):
#
# 1. verify: the tag matches the workspace version, `cargo xtask release
#    check` passes, every crate is built as it will be published (`cargo
#    xtask release publish --dry-run`) and the npm packages pack.
# 2. github-release: a draft GitHub Release with the version's CHANGELOG.md
#    section.
# 3. binaries: the `navree` CLI for Linux, macOS and Windows, attached to the
#    draft with a SHA-256 file each.
# 4. apple-package: the Apple client's runtime core, built on a Mac for an
#    iPhone, the iOS simulator and a Mac, attached to the draft as
#    NavreeCore.xcframework.zip, with the Swift package that downloads it
#    (navree-swift-<version>.tar.gz), each with a SHA-256 file
#    (packages/apple/scripts/swift-package.sh).
# 5. android-package: the Android client as Maven packages. The runtime core
#    is built for arm64-v8a and x86_64 (packages/android/scripts/build-core.sh),
#    and com.navree:navree-native and com.navree:navree-push-fcm are published
#    to a folder at the release's version, each with its POM, its sources jar
#    and its javadoc jar (packages/android/scripts/maven-package.sh). The
#    folder is attached to the draft as navree-android-<version>.tar.gz, with
#    a SHA-256 file. Nothing here needs Maven Central.
# 6. windows-package: the Windows client as NuGet packages. The runtime core
#    is built as a DLL for win-x64, the eight libraries under
#    packages/windows/src are built at the release's version and packed
#    (packages/windows/scripts/pack.ps1), and the eight packages are attached
#    to the draft in one file, navree-windows-<version>.zip, with a SHA-256
#    file. Nothing here needs nuget.org.
# 7. crates (environment `crates-io`, which asks for an approval): `cargo
#    xtask release publish`, in dependency order. It resumes: run the job
#    again after a stop, and the crates the registry has are skipped.
#    Crates that exist on crates.io publish with trusted publishing, a fresh
#    30-minute token for every 25 crates. A crate's very first publish needs
#    an API token instead: store it in the environment as CARGO_REGISTRY_TOKEN
#    for that release (scopes publish-new and publish-update, the new crates
#    only, a few days' expiry). The job uses it for the crates crates.io has
#    no version of and trusted publishing for all the others, and stops at a
#    new crate when the secret is not set. Afterwards delete the secret,
#    revoke the token and add the new crate's trusted publisher.
# 8. npm (environment `npm`, which asks for an approval): the five
#    `@navree/*` packages with provenance (`pnpm -r publish`, which skips a
#    version npm has already). The secret NPM_TOKEN is used when set (a
#    package's first publish); otherwise npm's trusted publishing.
# 9. maven-central (environment `maven-central`), after the crates: the
#    Android packages of step 5 are signed, uploaded through the Central
#    Portal's publishing API and waited for until the Portal says they are
#    published (packages/android/scripts/maven-central.sh). It resumes: a
#    version Maven Central has already is left as it is. The environment's
#    secrets are MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD (a Portal
#    user token), MAVEN_GPG_PRIVATE_KEY and MAVEN_GPG_PASSPHRASE (the signing
#    key). Until they are set the job publishes nothing, says so in a notice
#    and passes. packages/android/README.md says what is set up once.
# 10. nuget (environment `nuget`), after the crates: the Windows packages of
#    step 6 are pushed to nuget.org (`dotnet nuget push`, which leaves a
#    version nuget.org has already as it is). The environment's secret is
#    NUGET_API_KEY. Until it is set the job publishes nothing, says so in a
#    notice and passes. packages/windows/README.md says what is set up once.
# 11. publish-release: the draft becomes the release; the branch docs/<major>.x
#    moves to the tag, and the website and the skeleton repository are told
#    (with the secret RELEASE_DISPATCH_TOKEN, when set), and so is the Swift
#    package's repository, named by the variable SWIFT_PACKAGE_REPO, which
#    then commits and tags the package of this version
#    (packages/apple/release/update.yml).
#
# sbom.yml also runs on the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    # The dry run builds every crate as it will be published.
    timeout-minutes: 240
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL"
          df --human-readable /

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: The tag is the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.name == "navree") | .version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::the tag $TAG does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release checks
        run: cargo xtask release check

      - name: Build every crate as it will be published
        # Stages Navigator's files, then `cargo publish --dry-run` of every
        # crate, and lists which the registry has already.
        run: cargo xtask release publish --dry-run

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: packages/js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/js/pnpm-lock.yaml

      - name: Pack the npm packages
        working-directory: packages/js
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p ../../target/npm
          pnpm -r pack --pack-destination ../../target/npm
          ls -l ../../target/npm

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "[] ]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\nInstall the CLI with `cargo install navree-cli`, or download it below. Add Navree to an app with `cargo add navree`.\n' >> notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag $prerelease \
              --title "Navree $VERSION" --notes-file notes.md
          fi

  binaries:
    needs: [verify, github-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build the CLI
        shell: bash
        run: |
          # Navigator embeds the copies the published crate carries.
          cargo xtask release stage
          cargo build --release --locked --package navree-cli --bin navree --target ${{ matrix.target }}

      - name: Package and attach
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="navree-cli-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "../target/$TARGET/release/navree.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
            sha256sum "$archive" > "$archive.sha256"
          else
            cp "../target/$TARGET/release/navree" "$name/"
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
            if command -v sha256sum > /dev/null; then
              sha256sum "$archive" > "$archive.sha256"
            else
              shasum -a 256 "$archive" > "$archive.sha256"
            fi
          fi
          gh release upload "$TAG" "$archive" "$archive.sha256" --clobber

  apple-package:
    needs: [verify, github-release]
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin

      - name: Build the core
        run: bash packages/apple/scripts/build-core.sh

      - name: Make the Swift package and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          packages/apple/scripts/swift-package.sh "$VERSION" \
            "https://github.com/NavreeHQ/navree/releases/download/$TAG" dist
          gh release upload "$TAG" \
            dist/NavreeCore.xcframework.zip dist/NavreeCore.xcframework.zip.sha256 \
            "dist/navree-swift-$VERSION.tar.gz" "dist/navree-swift-$VERSION.tar.gz.sha256" \
            --clobber

  android-package:
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # The Gradle the Android client job of native.yml builds and tests the
      # client with: the two are changed together.
      GRADLE_VERSION: "9.6.0"
      GRADLE_SHA256: bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Build the core
        run: bash packages/android/scripts/build-core.sh

      # JDK 17 and Gradle, which comes from its own site and is checked
      # against a fixed sum, and platform 36: as in native.yml.
      - name: JDK and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Platform 36
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          "$sdk" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"

      - name: Make the Maven packages and attach them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          bash packages/android/scripts/maven-package.sh "$VERSION" dist
          gh release upload "$TAG" \
            "dist/navree-android-$VERSION.tar.gz" "dist/navree-android-$VERSION.tar.gz.sha256" \
            --clobber

      # The maven-central job takes them from here: it reads nothing from the
      # draft release, which only a token that may write can see.
      - name: Keep the packages for the maven-central job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-package
          path: |
            dist/navree-android-${{ needs.verify.outputs.version }}.tar.gz
            dist/navree-android-${{ needs.verify.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  windows-package:
    needs: [verify, github-release]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      # The core as a DLL for 64-bit Windows, which Navree.Core's package carries.
      - name: Build the core
        shell: bash
        run: |
          cargo rustc -p navree-native-core --locked --release --target x86_64-pc-windows-msvc --crate-type cdylib
          mkdir -p packages/windows/native/win-x64
          cp target/x86_64-pc-windows-msvc/release/navree_native_core.dll packages/windows/native/win-x64/
          ls -l packages/windows/native/win-x64

      # Navree.Shell and the seven libraries it stands on: restored from the
      # lock files kept beside each project (CI is true, so a restore that
      # would change a package fails), then built at the release's version.
      - name: Build the libraries
        shell: pwsh
        working-directory: packages/windows
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          dotnet restore src/Navree.Shell/Navree.Shell.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/Navree.Shell/Navree.Shell.csproj -c Release --no-restore "-p:Version=${env:VERSION}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Make the NuGet packages and attach them
        shell: pwsh
        working-directory: packages/windows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/pack.ps1 -Version $env:VERSION -Out ../../dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $env:TAG "../../dist/navree-windows-${env:VERSION}.zip" "../../dist/navree-windows-${env:VERSION}.zip.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The nuget job takes them from here: it reads nothing from the draft
      # release, which only a token that may write can see.
      - name: Keep the packages for the nuget job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: |
            dist/navree-windows-${{ needs.verify.outputs.version }}.zip
            dist/navree-windows-${{ needs.verify.outputs.version }}.zip.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  crates:
    needs: verify
    runs-on: ubuntu-latest
    # The most a job may run; run it again to resume after a stop.
    timeout-minutes: 350
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Publish the crates
        env:
          # Used only for a crate crates.io has no version of; empty in most releases.
          NAVREE_FIRST_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # The verify job built every crate as published, on this commit.
        run: cargo xtask release publish --skip-verify --trusted-publishing

      - name: Keep the publish log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-log-${{ github.ref_name }}-${{ github.run_attempt }}
          path: target/release/publish-*.log
          if-no-files-found: ignore

  npm:
    needs: [verify, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: packages/js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: packages/js/pnpm-lock.yaml

      - name: Build the packages
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish the packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Private packages (@navree/deepmerge) are skipped, and so is a
          # version npm already has. `workspace:*` becomes the exact version.
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          pnpm -r publish --access public --provenance --no-git-checks

      - name: Check that npm has every package
        # `pnpm -r publish` also succeeds when it publishes nothing (it skips
        # any version it believes npm has), so ask npm for each one. A new
        # version can take minutes to show in `npm view` (at 1.0.1 one took
        # two and a half), so the packages get ten minutes between them.
        run: |
          missing=()
          for file in */package.json; do
            if [ "$(jq -r '.private // false' "$file")" != true ]; then
              missing+=("$(jq -r '.name + "@" + .version' "$file")")
            fi
          done
          deadline=$((SECONDS + 600))
          while :; do
            still=()
            for spec in "${missing[@]}"; do
              if [ -n "$(npm view "$spec" version 2> /dev/null || true)" ]; then
                echo "$spec is on npm"
              else
                still+=("$spec")
              fi
            done
            missing=("${still[@]}")
            if [ "${#missing[@]}" -eq 0 ] || [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            sleep 15
          done
          for spec in "${missing[@]}"; do
            echo "::error::$spec is not on npm"
          done
          [ "${#missing[@]}" -eq 0 ]

  maven-central:
    needs: [verify, android-package, crates]
    runs-on: ubuntu-latest
    # The Central Portal checks an upload and then publishes it; the job waits
    # for both. Run it again after a stop: what Maven Central has is left.
    timeout-minutes: 90
    environment: maven-central
    permissions:
      contents: read
    steps:
      - name: Is Maven Central set up
        id: setup
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ] || [ -z "$MAVEN_GPG_PRIVATE_KEY" ]; then
            echo "::notice::the Android client was not published to Maven Central: the environment maven-central does not have the secrets MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD and MAVEN_GPG_PRIVATE_KEY (packages/android/README.md says what to set up). The release has the packages as navree-android-$VERSION.tar.gz"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.setup.outputs.ready == 'true'
        with:
          persist-credentials: false
          sparse-checkout: packages/android/scripts

      - name: The packages
        if: steps.setup.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-package
          path: ${{ runner.temp }}/android

      - name: Publish to Maven Central
        if: steps.setup.outputs.ready == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/android"
          sha256sum -c "navree-android-$VERSION.tar.gz.sha256"
          tar -xzf "navree-android-$VERSION.tar.gz"
          bash "$GITHUB_WORKSPACE/packages/android/scripts/maven-central.sh" "$RUNNER_TEMP/android/navree-android" "$VERSION"

  nuget:
    needs: [verify, windows-package, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget
    permissions:
      contents: read
    steps:
      - name: Is nuget.org set up
        id: setup
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::the Windows client was not published to nuget.org: the environment nuget does not have the secret NUGET_API_KEY (packages/windows/README.md says what to set up). The release has the packages as navree-windows-$VERSION.zip"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: The packages
        if: steps.setup.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package
          path: ${{ runner.temp }}/windows

      - name: Publish to nuget.org
        if: steps.setup.outputs.ready == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
          DOTNET_NOLOGO: "true"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          cd "$RUNNER_TEMP/windows"
          sha256sum -c "navree-windows-$VERSION.zip.sha256"
          unzip -q "navree-windows-$VERSION.zip" -d packages
          ls -l packages
          # A version nuget.org has already is left as it is (--skip-duplicate),
          # so the job can be run again after a stop.
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" --skip-duplicate
          done

  publish-release:
    # maven-central and nuget pass when their registry is not set up yet (they
    # publish nothing and say so), so neither can hold a release back for that.
    needs: [verify, binaries, apple-package, android-package, windows-package, crates, npm, maven-central, nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false

      - name: Move the docs branch to the release
        # navree.com builds its docs from docs/<major>.x, so it describes
        # the released version. Not for pre-releases.
        if: ${{ !contains(needs.verify.outputs.version, '-') }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: git push --force origin "HEAD:refs/heads/docs/${VERSION%%.*}.x"

      - name: Tell the website and the skeleton
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RELEASE_DISPATCH_TOKEN is not set: deploy the website and regenerate the skeleton by hand"
            exit 0
          fi
          for repo in NavreeHQ/website NavreeHQ/skeleton; do
            gh api "repos/$repo/dispatches" \
              --field event_type=navree-release \
              --field "client_payload[version]=$VERSION"
          done

      - name: Tell the Swift package's repository
        # The repository named by the variable SWIFT_PACKAGE_REPO (for
        # example NavreeHQ/navree-swift) runs packages/apple/release/update.yml,
        # which commits and tags this version's package from the release.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          REPO: ${{ vars.SWIFT_PACKAGE_REPO }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -z "$REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "::notice::the Swift package was not updated: set the variable SWIFT_PACKAGE_REPO and give RELEASE_DISPATCH_TOKEN access to that repository (packages/apple/release/update.yml says how)"
            exit 0
          fi
          gh api "repos/$REPO/dispatches" \
            --field event_type=navree-release \
            --field "client_payload[version]=$VERSION"
