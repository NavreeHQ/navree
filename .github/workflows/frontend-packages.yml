# Builds and tests the front-end npm packages in packages/js (@navree/client,
# @navree/bff, @navree/next, @navree/nuxt, @navree/theme): typecheck and Vitest
# for each, then the smoke checks, which build a Next.js and a Nuxt app on the
# packages and run them against a scripted Navree API.
name: Front-end packages

on:
  push:
    branches: [main]
    paths:
      - "packages/js/**"
      - ".github/workflows/frontend-packages.yml"
  pull_request:
    paths: ["packages/js/**", ".github/workflows/frontend-packages.yml"]
  schedule:
    # Sundays at 06:17 UTC, after the weekly Rust suites.
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @navree/next --filter @navree/nuxt smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
