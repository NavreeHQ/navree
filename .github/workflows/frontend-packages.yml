# Builds and tests the front-end npm packages in packages/js (@navree/client,
# @navree/bff, @navree/next, @navree/nuxt, @navree/theme): typecheck and Vitest
# for each, then the smoke checks, which build a Next.js and a Nuxt app on the
# packages and run them against a scripted Navree API.
#
# The crm job runs the packages against the real CRM API: both CRM front ends are
# built on them (apps/crm-web on @navree/next, apps/crm-nuxt on @navree/nuxt), and
# their browser journeys drive crm-api, which is compiled from this checkout.
name: Front-end packages

on:
  push:
    branches: [main]
    paths:
      - "packages/js/**"
      - "apps/crm-web/**"
      - "apps/crm-nuxt/**"
      - ".github/workflows/frontend-packages.yml"
  pull_request:
    paths: ["packages/js/**", ".github/workflows/frontend-packages.yml"]
  schedule:
    # Sundays at 06:17 UTC, after the weekly Rust suites.
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @navree/next --filter @navree/nuxt smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  crm:
    # Not on pull requests: it compiles crm-api, which takes a while.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # One build of crm-api for both front ends' journeys.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CRM_API_BIN: ${{ github.workspace }}/target/debug/crm-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            packages/js/pnpm-lock.yaml
            apps/crm-web/pnpm-lock.yaml
            apps/crm-nuxt/pnpm-lock.yaml
      - name: Build the packages
        run: |
          pnpm --dir packages/js install --frozen-lockfile
          pnpm --dir packages/js build
      - name: Build crm-api
        run: cargo build --locked --package crm-api
      - name: crm-web on @navree/next
        run: |
          pnpm --dir apps/crm-web install --frozen-lockfile
          pnpm --dir apps/crm-web typecheck
          pnpm --dir apps/crm-web test
          pnpm --dir apps/crm-web exec playwright install --with-deps chromium
          E2E_REAL_API=1 pnpm --dir apps/crm-web e2e
      - name: crm-nuxt on @navree/nuxt
        run: |
          pnpm --dir apps/crm-nuxt install --frozen-lockfile
          pnpm --dir apps/crm-nuxt typecheck
          pnpm --dir apps/crm-nuxt test
          pnpm --dir apps/crm-nuxt exec playwright install --with-deps chromium
          pnpm --dir apps/crm-nuxt e2e
