# Prepares a release: started by hand with a version number, it sets that
# version everywhere (`cargo xtask release prepare`: the workspace, the exact
# requirements between Navree's crates, the npm packages, Cargo.lock and a
# drafted CHANGELOG.md section), checks the result (`cargo xtask release
# check`) and opens the release pull request from the branch prepare/v<version>.
#
# Edit the changelog section in the pull request. The suites, the release
# checks (release-checks.yml, with the stack job) and the semver check run on
# it; when it is merged, tag the merge commit `v<version>` and release.yml
# publishes.
#
# A pull request opened with the workflow's own token starts no workflows (a
# GitHub rule). Store a fine-grained token with "contents" and "pull requests"
# write access to this repository as the secret RELEASE_PR_TOKEN so the checks
# start by themselves; without it, close and reopen the pull request to start
# them.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, such as 1.2.3 or 2.0.0-rc.1
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not a version (1.2.3, or 2.0.0-rc.1)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog draft reads the commits since the last tag.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: cargo xtask release prepare "$VERSION"

      - name: Check the release
        run: cargo xtask release check

      - name: Open the pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          branch="prepare/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add --all
          git commit --message "build(release): version $VERSION"
          git push --force origin "$branch"
          section="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "[] ]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          body="$(printf 'Sets %s everywhere: the crates and their exact requirements on each other, the CLI and the starter kits, the npm packages and Cargo.lock.\n\nEdit the changelog section in `CHANGELOG.md` before merging. After the merge, tag the merge commit `v%s` to publish.\n\n### Changelog draft\n\n%s\n' "$VERSION" "$VERSION" "$section")"
          if gh pr view "$branch" --json number > /dev/null 2>&1; then
            gh pr edit "$branch" --title "Release $VERSION" --body "$body"
          else
            gh pr create --base "$BASE" --head "$branch" --title "Release $VERSION" --body "$body"
          fi
