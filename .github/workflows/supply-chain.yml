# Supply-chain gates for the Rust dependency tree:
#
# - cargo-deny (deny.toml): advisories, banned crates (openssl, native-tls,
#   rsa), allowed licenses and allowed sources.
# - cargo-vet (supply-chain/): every third-party crate is audited or exempted.
#
# Runs on pull requests, on pushes to main, and daily so a newly published
# advisory fails a run even when nothing in the repository changed. The tool
# versions are pinned so a new release can't change the result without a
# change here.
#
# The advisories check is its own job: it depends on the advisory database
# rather than on the pull request, so you may leave it out of the required
# status checks if an unrelated new advisory shouldn't block merging.
name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check ${{ matrix.checks }}
        run: cargo deny --locked check ${{ matrix.checks }}

  cargo-vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-vet@0.10.3
      - name: cargo vet
        run: cargo vet --locked
