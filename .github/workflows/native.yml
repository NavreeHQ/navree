name: Native clients

on:
  push:
    branches: [main, "feat/native**"]
    paths:
      - "crates/navree-native/**"
      - "crates/navree-native-core/**"
      - "packages/android/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "crates/navree-native/**"
      - "crates/navree-native-core/**"
      - "packages/android/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

jobs:
  # The runtime core: the protocol's tests and its own, a C program built
  # against its header, and the libraries the phones' clients link. Nothing
  # here needs a Mac: a static library is an archive, which is written without
  # Apple's linker.
  core:
    name: Runtime core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: native-core-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-linux-android,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The crate the core stands on: every example envelope read and held to
      # the schema, and a tree at the depth limit read without running out of stack.
      - name: The protocol's tests
        run: cargo test -p navree-native

      # Every transcript replayed, each held to the schema; ten thousand rows
      # a page at a time; the deepest tree the protocol allows on 512 KiB of stack.
      - name: The core's tests
        run: cargo test -p navree-native-core

      - name: Lints, with the Kotlin glue
        run: cargo clippy -p navree-native-core --all-targets --features jni -- -D warnings

      # The header and the library agree, and a C program can drive the core.
      - name: A C program against the header
        run: bash crates/navree-native-core/tests/c/run.sh

      # Android: shared libraries with the glue for com.navree.core.Core, linked
      # with the runner's NDK for API 26, named, and laid out for 16 KB pages.
      - name: Android libraries
        env:
          LINK: -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-soname,libnavree_native_core.so
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk/aarch64-linux-android26-clang" \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="$LINK" \
            cargo rustc -p navree-native-core --locked --release --features jni --target aarch64-linux-android --crate-type cdylib
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ndk/x86_64-linux-android26-clang" \
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS="$LINK" \
            cargo rustc -p navree-native-core --locked --release --features jni --target x86_64-linux-android --crate-type cdylib
          for target in aarch64-linux-android x86_64-linux-android; do
            library="target/$target/release/libnavree_native_core.so"
            # The five functions of the C interface and the four native methods
            # of the Kotlin class are in each library.
            "$ndk/llvm-nm" -D --defined-only "$library" | awk '{print $3}' | grep -E '^(navree_|Java_)' | sort | tee "$target.symbols"
            test "$(grep -c '^navree_' "$target.symbols")" -eq 5
            test "$(grep -c '^Java_com_navree_core_Core_native' "$target.symbols")" -eq 4
            # Every part of the library that is loaded is laid out for 16 KB pages.
            "$ndk/llvm-readelf" -lW "$library" | awk '$1 == "LOAD" && $NF != "0x4000" { print "a part laid out for " $NF; bad = 1 } END { exit bad }'
            # It says its own name, and needs nothing but the system's own libraries.
            "$ndk/llvm-readelf" -dW "$library" | grep -E 'SONAME|NEEDED'
            "$ndk/llvm-readelf" -dW "$library" | grep -q 'SONAME.*libnavree_native_core.so'
          done

      # iOS: static libraries for a device and for a simulator on Apple silicon.
      - name: iOS libraries
        run: |
          set -o pipefail
          # The NDK's tools read Apple's object files as well as Android's.
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            library="target/$target/release/libnavree_native_core.a"
            cargo rustc -p navree-native-core --release --target "$target" --crate-type staticlib -- --print native-static-libs 2>&1 | tee "$target.log"
            # What an app links beside the library, as the compiler says it.
            sed 's/\x1b\[[0-9;]*m//g' "$target.log" | grep -o 'native-static-libs: .*' | sed 's/native-static-libs: //' | tail -1 > "$target.needs" || true
            # The five functions of the C interface are in each library.
            # (One part of the archive is the compiler's own notes, which the tool can't read.)
            { "$ndk/llvm-nm" -g --defined-only "$library" 2>/dev/null || true; } | awk '{print $3}' | { grep -E '^_navree_' || true; } | sort -u | tee "$target.symbols"
            test "$(wc -l < "$target.symbols")" -eq 5
            # Which of Apple's systems each of its parts says it was built for.
            "$ndk/llvm-objdump" --macho --private-headers "$library" 2>/dev/null | grep -E '^ *(platform|minos) ' | sort | uniq -c || true
          done

      # One folder a client's build takes whole: the header, a library for each
      # system and processor, the commit they were built from, what an Apple app
      # links beside its library, and a checksum of each file.
      - name: Lay the libraries out
        run: |
          out=dist/navree-native-core
          mkdir -p "$out/include" "$out/android/arm64-v8a" "$out/android/x86_64" "$out/ios/device" "$out/ios/simulator"
          cp crates/navree-native-core/include/navree_core.h "$out/include/"
          cp target/aarch64-linux-android/release/libnavree_native_core.so "$out/android/arm64-v8a/"
          cp target/x86_64-linux-android/release/libnavree_native_core.so "$out/android/x86_64/"
          cp target/aarch64-apple-ios/release/libnavree_native_core.a "$out/ios/device/"
          cp target/aarch64-apple-ios-sim/release/libnavree_native_core.a "$out/ios/simulator/"
          printf 'device: %s\nsimulator: %s\n' "$(cat aarch64-apple-ios.needs)" "$(cat aarch64-apple-ios-sim.needs)" > "$out/ios/links.txt"
          echo "$GITHUB_SHA" > "$out/COMMIT"
          (cd "$out" && find . -type f ! -name SHA256SUMS | sort | xargs sha256sum > SHA256SUMS && cat SHA256SUMS && cat ios/links.txt && du -ah . | sort -k2)

      - name: Keep the libraries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navree-native-core
          if-no-files-found: error
          path: dist/navree-native-core
          retention-days: 30

  # The Android client: built against platform 36 with the core's libraries
  # from the job above, its JVM tests run, and its APKs kept for the screens.
  android:
    name: Android client
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: native-android-${{ github.ref }}
      cancel-in-progress: true
    env:
      GRADLE_VERSION: "9.6.0"
      GRADLE_SHA256: bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The core's libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navree-native-core
          path: ${{ runner.temp }}/navree-native-core

      - name: The core's libraries in the client
        run: |
          core="$RUNNER_TEMP/navree-native-core"
          (cd "$core" && sha256sum -c SHA256SUMS)
          for abi in arm64-v8a x86_64; do
            mkdir -p "navree-native/src/main/jniLibs/$abi"
            cp "$core/android/$abi/libnavree_native_core.so" "navree-native/src/main/jniLibs/$abi/"
          done
          cat "$core/COMMIT"

      # JDK 17 and Gradle 9.6.0, which the Android Gradle plugin 9.5 needs;
      # Gradle comes from its own site and is checked against a fixed sum.
      - name: JDK and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Platform 36
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          "$sdk" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"

      - name: Gradle's caches
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('packages/android/**/*.gradle.kts', 'packages/android/gradle/libs.versions.toml') }}
          restore-keys: android-gradle-

      # The library and the demo, the JVM tests (the protocol's models against
      # every example answer, the placement rules), and the device tests' APK.
      - name: Build and test
        run: |
          gradle --console=plain --stacktrace \
            :navree-native:testDebugUnitTest \
            :navree-native:assembleDebugAndroidTest \
            :navree-push-fcm:assembleDebug \
            :demo:assembleDebug

      - name: Keep Gradle's caches
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('packages/android/**/*.gradle.kts', 'packages/android/gradle/libs.versions.toml') }}

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          if-no-files-found: ignore
          path: packages/android/navree-native/build/reports/tests
          retention-days: 14

      - name: Keep the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          if-no-files-found: error
          path: |
            packages/android/navree-native/build/outputs/apk/androidTest/debug/*.apk
            packages/android/demo/build/outputs/apk/debug/*.apk
          retention-days: 14

  # The store, inbox and board demos, answering native clients, for the device
  # tests to run against: the screens they photograph are the servers' answers of now.
  android-demo:
    name: Demos for the Android screens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: native-android-demo-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-store-demo

      - name: Build the demos
        run: cargo build -p store-demo -p inbox-demo -p board-demo --features store-demo/native-preview,inbox-demo/native-preview,board-demo/native-preview

      - name: Keep the demos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-demos
          if-no-files-found: error
          path: |
            target/debug/store-demo
            target/debug/inbox-demo
            target/debug/board-demo
          retention-days: 7

  # The device tests on an emulator, on a phone and on a tablet: each screen in
  # four looks (light, dark, the largest text, right to left), photographed.
  android-screens:
    name: Android screens (${{ matrix.device }})
    needs: [android, android-demo]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_7
          - device: tablet
            profile: pixel_tablet
    env:
      IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - name: The APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: ${{ runner.temp }}/apks

      - name: The demos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-demos
          path: ${{ runner.temp }}/demo

      # The emulator reaches this machine as 10.0.2.2: the store at 8095, the inbox at 8096, the board at 8097.
      - name: Serve the demos
        run: |
          cd "$RUNNER_TEMP/demo"
          chmod +x store-demo inbox-demo board-demo
          PORT=8095 STORE_SIMULATOR=off STORE_DATABASE_URL="sqlite://$RUNNER_TEMP/demo/store.db?mode=rwc" \
            nohup ./store-demo > store.log 2>&1 &
          PORT=8096 INBOX_SIMULATOR=off INBOX_SCALE=2000 INBOX_DATABASE_URL="sqlite://$RUNNER_TEMP/demo/inbox.db?mode=rwc" \
            nohup ./inbox-demo > inbox.log 2>&1 &
          PORT=8097 BOARD_SIMULATOR=off BOARD_DATABASE_URL="sqlite://$RUNNER_TEMP/demo/board.db?mode=rwc" \
            nohup ./board-demo > board.log 2>&1 &
          for port in 8095 8096 8097; do
            for _ in $(seq 1 240); do
              if curl -s -o /dev/null "http://127.0.0.1:$port/"; then echo "port $port answers"; break; fi
              sleep 1
            done
            curl -s -o /dev/null -w "$port shell %{http_code}\n" -H 'X-Navree-Native: 1' \
              -H 'X-Navree-Client: platform=android; form=phone; vocab=0; scheme=light; text=1.00' \
              -H 'Accept: application/vnd.navree.native+json' "http://127.0.0.1:$port/_navree/native/shell"
          done

      # The emulator runs on the processor's own virtualisation.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The emulator
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          adb="$ANDROID_HOME/platform-tools/adb"
          # The tools and the emulator look for the device in one folder only when both are told it.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" --install emulator platform-tools "$IMAGE" > /dev/null
          echo no | "$sdk/avdmanager" create avd -n screens -k "$IMAGE" -d "${{ matrix.profile }}" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          "$ANDROID_HOME/emulator/emulator" -avd screens -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -accel on -gpu swiftshader_indirect -memory 4096 -cores 4 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          booted=0
          for _ in $(seq 1 120); do
            if [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=1; break; fi
            sleep 5
          done
          if [ "$booted" != 1 ]; then
            echo "the emulator did not start"
            tail -100 "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$adb" shell settings put global "$scale" 0
          done
          "$adb" shell wm size
          "$adb" shell wm density

      - name: Screens
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" install -r -t "$RUNNER_TEMP"/apks/navree-native/build/outputs/apk/androidTest/debug/*.apk
          status=0
          for look in light dark large rtl; do
            night=no; scale=1.0; rtl=0
            case "$look" in
              dark) night=yes ;;
              large) scale=2.0 ;;
              rtl) rtl=1 ;;
            esac
            "$adb" shell cmd uimode night "$night"
            "$adb" shell settings put system font_scale "$scale"
            # Right to left as the developer option sets it: the system property, the setting, and a
            # change of configuration so the system and every app lay themselves out again.
            if [ "$rtl" = 1 ]; then
              for _ in 1 2 3; do "$adb" root && break; sleep 5; done
              "$adb" wait-for-device
              "$adb" shell setprop debug.force_rtl true
              "$adb" shell settings put global debug.force_rtl 1
              "$adb" shell settings put system font_scale 1.05
              sleep 3
              "$adb" shell settings put system font_scale "$scale"
              sleep 3
            fi
            "$adb" shell am instrument -w -e look "$look" -e device "${{ matrix.device }}" -e store http://10.0.2.2:8095 -e inbox http://10.0.2.2:8096 -e board http://10.0.2.2:8097 \
              com.navree.client.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/instrument-$look.txt"
            if ! grep -q '^OK (' "$RUNNER_TEMP/instrument-$look.txt"; then status=1; fi
          done
          mkdir -p "$RUNNER_TEMP/screens"
          "$adb" pull /data/local/tmp/navree-screens "$RUNNER_TEMP/screens/" || true
          cp "$RUNNER_TEMP"/instrument-*.txt "$RUNNER_TEMP/screens/"
          "$adb" logcat -d > "$RUNNER_TEMP/screens/logcat.txt" || true
          cp "$RUNNER_TEMP"/demo/*.log "$RUNNER_TEMP/screens/" || true
          ls -R "$RUNNER_TEMP/screens"
          exit $status

      - name: Keep the screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screens-${{ matrix.device }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/screens
          retention-days: 30
