name: Native clients

on:
  push:
    branches: [main, "feat/native**"]
    paths:
      - "crates/navree-native/**"
      - "crates/navree-native-core/**"
      - "packages/android/**"
      - "packages/windows/**"
      - "apps/store-demo/**"
      - "apps/inbox-demo/**"
      - "apps/board-demo/**"
      - "packages/apple/**"
      - "xtask/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "crates/navree-native/**"
      - "crates/navree-native-core/**"
      - "packages/android/**"
      - "packages/windows/**"
      - "apps/store-demo/**"
      - "apps/inbox-demo/**"
      - "apps/board-demo/**"
      - "packages/apple/**"
      - "xtask/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

jobs:
  # What the push changed, so that a job runs only when what it is for changed. For a push to a branch other than main, the files
  # between the commit the branch stood at before the push and the commit it stands at now are looked at, with plain git; for a pull
  # request, for main, for a branch that is new, and whenever that commit cannot be fetched, everything counts as changed.
  changes:
    name: What the push changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.diff.outputs.core }}
      android: ${{ steps.diff.outputs.android }}
      apple: ${{ steps.diff.outputs.apple }}
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Which jobs are concerned
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          everything=true
          files=""
          if [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ] && [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            if git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null && files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"; then
              everything=false
              echo "changed since $BEFORE:"
              printf '%s\n' "$files"
            fi
          fi
          if [ "$everything" = true ]; then echo "everything counts as changed"; fi
          flag() { if [ "$everything" = true ] || printf '%s\n' "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          crates='^crates/navree-native(-core)?/'
          demos='^apps/(store|inbox|board)-demo/'
          flow='^\.github/workflows/native\.yml$'
          echo "core=$(flag "$crates|$flow")" >> "$GITHUB_OUTPUT"
          echo "android=$(flag "$crates|^packages/android/|$demos|$flow")" >> "$GITHUB_OUTPUT"
          echo "apple=$(flag "$crates|^packages/apple/|^xtask/|$demos|$flow")" >> "$GITHUB_OUTPUT"
          echo "windows=$(flag "$crates|^packages/windows/|^xtask/|$demos|$flow")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # The runtime core: the protocol's tests and its own, a C program built
  # against its header, and the libraries the phones' clients link. Nothing
  # here needs a Mac: a static library is an archive, which is written without
  # Apple's linker.
  core:
    name: Runtime core
    needs: changes
    # The Android and Apple clients take the core's libraries from this job, so it runs when any of the three is concerned.
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.apple == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: native-core-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-linux-android,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The crate the core stands on: every example envelope read and held to
      # the schema, and a tree at the depth limit read without running out of stack.
      - name: The protocol's tests
        run: cargo test -p navree-native

      # Every transcript replayed, each held to the schema; ten thousand rows
      # a page at a time; the deepest tree the protocol allows on 512 KiB of stack.
      - name: The core's tests
        run: cargo test -p navree-native-core

      - name: Lints, with the Kotlin glue
        run: cargo clippy -p navree-native-core --all-targets --features jni -- -D warnings

      # The header and the library agree, and a C program can drive the core.
      - name: A C program against the header
        run: bash crates/navree-native-core/tests/c/run.sh

      # Android: shared libraries with the glue for com.navree.core.Core, linked
      # with the runner's NDK for API 26, named, and laid out for 16 KB pages.
      # The script builds the two and checks each of those: the five functions
      # of the C interface and the four native methods of the Kotlin class,
      # every loaded part laid out for 16 KB pages, and the library's own name.
      # A release builds the libraries it publishes with the same script
      # (release.yml's android-package job).
      - name: Android libraries
        run: bash packages/android/scripts/build-core.sh

      # Apple: static libraries for an iPhone, for a simulator on Apple silicon, and for a Mac on Apple silicon.
      - name: Apple libraries
        run: |
          set -o pipefail
          # The NDK's tools read Apple's object files as well as Android's.
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin; do
            library="target/$target/release/libnavree_native_core.a"
            cargo rustc -p navree-native-core --release --target "$target" --crate-type staticlib -- --print native-static-libs 2>&1 | tee "$target.log"
            # What an app links beside the library, as the compiler says it.
            sed 's/\x1b\[[0-9;]*m//g' "$target.log" | grep -o 'native-static-libs: .*' | sed 's/native-static-libs: //' | tail -1 > "$target.needs" || true
            # The five functions of the C interface are in each library.
            # (One part of the archive is the compiler's own notes, which the tool can't read.)
            { "$ndk/llvm-nm" -g --defined-only "$library" 2>/dev/null || true; } | awk '{print $3}' | { grep -E '^_navree_' || true; } | sort -u | tee "$target.symbols"
            test "$(wc -l < "$target.symbols")" -eq 5
            # Which of Apple's systems each of its parts says it was built for.
            "$ndk/llvm-objdump" --macho --private-headers "$library" 2>/dev/null | grep -E '^ *(platform|minos) ' | sort | uniq -c || true
          done

      # One folder a client's build takes whole: the header, a library for each
      # system and processor, the commit they were built from, what an Apple app
      # links beside its library, and a checksum of each file.
      - name: Lay the libraries out
        run: |
          out=dist/navree-native-core
          mkdir -p "$out/include" "$out/android/arm64-v8a" "$out/android/x86_64" "$out/ios/device" "$out/ios/simulator" "$out/macos"
          cp crates/navree-native-core/include/navree_core.h "$out/include/"
          cp target/aarch64-linux-android/release/libnavree_native_core.so "$out/android/arm64-v8a/"
          cp target/x86_64-linux-android/release/libnavree_native_core.so "$out/android/x86_64/"
          cp target/aarch64-apple-ios/release/libnavree_native_core.a "$out/ios/device/"
          cp target/aarch64-apple-ios-sim/release/libnavree_native_core.a "$out/ios/simulator/"
          cp target/aarch64-apple-darwin/release/libnavree_native_core.a "$out/macos/"
          printf 'device: %s\nsimulator: %s\n' "$(cat aarch64-apple-ios.needs)" "$(cat aarch64-apple-ios-sim.needs)" > "$out/ios/links.txt"
          printf 'macos: %s\n' "$(cat aarch64-apple-darwin.needs)" > "$out/macos/links.txt"
          echo "$GITHUB_SHA" > "$out/COMMIT"
          (cd "$out" && find . -type f ! -name SHA256SUMS | sort | xargs sha256sum > SHA256SUMS && cat SHA256SUMS && cat ios/links.txt && cat macos/links.txt && du -ah . | sort -k2)

      - name: Keep the libraries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navree-native-core
          if-no-files-found: error
          path: dist/navree-native-core
          retention-days: 30

  # The Android client: built against platform 36 with the core's libraries
  # from the job above, its JVM tests run, and its APKs kept for the screens.
  android:
    name: Android client
    needs: [changes, core]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: native-android-${{ github.ref }}
      cancel-in-progress: true
    env:
      # release.yml's android-package job builds what a release publishes with this same Gradle: the two are changed together.
      GRADLE_VERSION: "9.6.0"
      GRADLE_SHA256: bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The core's libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navree-native-core
          path: ${{ runner.temp }}/navree-native-core

      - name: The core's libraries in the client
        run: |
          core="$RUNNER_TEMP/navree-native-core"
          (cd "$core" && sha256sum -c SHA256SUMS)
          for abi in arm64-v8a x86_64; do
            mkdir -p "navree-native/src/main/jniLibs/$abi"
            cp "$core/android/$abi/libnavree_native_core.so" "navree-native/src/main/jniLibs/$abi/"
          done
          cat "$core/COMMIT"

      # JDK 17 and Gradle 9.6.0, which the Android Gradle plugin 9.5 needs;
      # Gradle comes from its own site and is checked against a fixed sum.
      - name: JDK and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Platform 36
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          "$sdk" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"

      - name: Gradle's caches
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('packages/android/**/*.gradle.kts', 'packages/android/gradle/libs.versions.toml') }}
          restore-keys: android-gradle-

      # The library and the demo, the JVM tests (the protocol's models against
      # every example answer, the placement rules), and the device tests' APK.
      - name: Build and test
        run: |
          gradle --console=plain --stacktrace \
            :navree-native:testDebugUnitTest \
            :navree-native:assembleDebugAndroidTest \
            :navree-push-fcm:assembleDebug \
            :demo:assembleDebug

      # The scripts' own tests: the walk's helpers (a screen is never read from an older dump, and what is
      # absent is said only of a dump that was made), the reading of a run of the device tests, the script
      # put at the start of every document of the web view, run in node against a page that changes what the script could use, the script
      # of the document that takes an origin's service workers and caches away when a session has ended, run
      # in node against an origin that holds some, and the check that the pictures of a device are pictures.
      - name: The scripts' own tests
        run: |
          python3 -I scripts/ui_test.py
          python3 -I scripts/read_run_test.py
          python3 -I scripts/document_script_test.py
          python3 -I scripts/site_wipe_test.py
          python3 -I scripts/pictures_check_test.py
          bash scripts/walk_test.sh

      # The demo as a store ships it (not debuggable), signed with a key made here, to time a start on.
      - name: Release build of the demo
        id: release
        continue-on-error: true
        run: |
          gradle --console=plain :demo:assembleRelease
          apk=$(ls demo/build/outputs/apk/release/*.apk | head -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass releasepass -keypass releasepass \
            -alias release -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Demo"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass pass:releasepass \
            --key-pass pass:releasepass --out demo/build/outputs/apk/release/demo-release-signed.apk "$apk"

      # A release build that was not made or not signed is not a green run with nothing said.
      - name: Say that the release build was not made
        if: steps.release.outcome == 'failure'
        run: |
          echo "::warning title=Release build of the demo::The release build of the demo was not assembled or not signed in this run, so no start of a build as a store ships it is timed."
          echo "The release build of the demo was not assembled or not signed in this run: its starts are not timed." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Gradle's caches
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('packages/android/**/*.gradle.kts', 'packages/android/gradle/libs.versions.toml') }}

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          if-no-files-found: ignore
          path: packages/android/navree-native/build/reports/tests
          retention-days: 14

      - name: Keep the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          if-no-files-found: error
          path: |
            packages/android/navree-native/build/outputs/apk/androidTest/debug/*.apk
            packages/android/demo/build/outputs/apk/debug/*.apk
            packages/android/demo/build/outputs/apk/release/demo-release-signed.apk
          retention-days: 14

      # What a release gives Maven Central, without the upload (release.yml's android-package and maven-central jobs do the
      # same with the release's version and the project's key): com.navree:navree-native and com.navree:navree-push-fcm
      # published to a folder at a version of the run's own, each checked for its POM, its sources jar and its javadoc jar,
      # and the library for the runtime core of both ABIs; then every file signed with a key made here, and all of it packed
      # as the Central Portal takes it.
      - name: The Maven packages
        run: |
          bash scripts/maven-package.sh 0.0.0 "$RUNNER_TEMP/maven"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase gate --quick-generate-key "Navree gate <gate@navree.invalid>" ed25519 sign 1d
          key="$(gpg --batch --pinentry-mode loopback --passphrase gate --armor --export-secret-keys)"
          gpgconf --kill gpg-agent
          MAVEN_GPG_PRIVATE_KEY="$key" MAVEN_GPG_PASSPHRASE=gate \
            bash scripts/maven-central.sh --bundle-only "$RUNNER_TEMP/maven/navree-android" 0.0.0 "$RUNNER_TEMP/maven/navree-android-0.0.0.zip"

      - name: Keep the Maven packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-packages
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/maven/navree-android-0.0.0.tar.gz
            ${{ runner.temp }}/maven/navree-android-0.0.0.tar.gz.sha256
            ${{ runner.temp }}/maven/navree-android-0.0.0.zip
          retention-days: 14

  # The store, inbox and board demos, answering native clients, for the device
  # tests to run against: the screens they photograph are the servers' answers of now.
  android-demo:
    name: Demos for the Android screens
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: native-android-demo-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-store-demo

      - name: Build the demos
        run: cargo build -p store-demo -p inbox-demo -p board-demo --features store-demo/native-preview,inbox-demo/native-preview,board-demo/native-preview

      - name: Keep the demos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-demos
          if-no-files-found: error
          path: |
            target/debug/store-demo
            target/debug/inbox-demo
            target/debug/board-demo
          retention-days: 7

      # After the demos are kept, so the ones the devices use are the ones built above and not a build made for tests.
      - name: Test the demos' native answers
        run: cargo test -p store-demo -p inbox-demo -p board-demo --features store-demo/native-preview,inbox-demo/native-preview,board-demo/native-preview --test native

  # The device tests on an emulator, on a phone and on a tablet: each screen in
  # four looks (light, dark, the largest text, right to left), photographed.
  # The tablet is two jobs, on its side and upright: four looks to a job, each
  # job with the whole of the time limit.
  android-screens:
    name: Android screens (${{ matrix.name }})
    needs: [changes, android, android-demo]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          # `tests` is how many device tests end in a look on that device, skipped ones included: the number in the run's `OK (N tests)`.
          # `held` is how the device is held, and `name` what the job, its upload and the device tests call the device held so.
          - device: phone
            name: phone
            held: portrait
            profile: pixel_7
            tests: 123
          - device: tablet
            name: tablet
            held: landscape
            profile: pixel_tablet
            tests: 123
          - device: tablet
            name: tablet-portrait
            held: portrait
            profile: pixel_tablet
            tests: 123
    env:
      IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packages/android/scripts

      - name: The APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: ${{ runner.temp }}/apks

      - name: The demos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-demos
          path: ${{ runner.temp }}/demo

      # The emulator reaches this machine as 10.0.2.2: the store at 8095, the inbox at 8096, the board at 8097.
      - name: Serve the demos
        run: |
          cd "$RUNNER_TEMP/demo"
          chmod +x store-demo inbox-demo board-demo
          PORT=8095 STORE_SIMULATOR=off STORE_DATABASE_URL="sqlite://$RUNNER_TEMP/demo/store.db?mode=rwc" \
            nohup ./store-demo > store.log 2>&1 &
          PORT=8096 INBOX_SIMULATOR=off INBOX_SCALE=2000 INBOX_DATABASE_URL="sqlite://$RUNNER_TEMP/demo/inbox.db?mode=rwc" \
            nohup ./inbox-demo > inbox.log 2>&1 &
          PORT=8097 BOARD_SIMULATOR=off BOARD_DATABASE_URL="sqlite://$RUNNER_TEMP/demo/board.db?mode=rwc" \
            nohup ./board-demo > board.log 2>&1 &
          # The demo app's own build reaches its server at 8787: the walk uses this one.
          PORT=8787 STORE_SIMULATOR=off STORE_DATABASE_URL="sqlite://$RUNNER_TEMP/demo/walk.db?mode=rwc"             nohup ./store-demo > walk-server.log 2>&1 &
          for port in 8095 8096 8097 8787; do
            for _ in $(seq 1 240); do
              if curl -s -o /dev/null "http://127.0.0.1:$port/"; then echo "port $port answers"; break; fi
              sleep 1
            done
            curl -s -o /dev/null -w "$port shell %{http_code}\n" -H 'X-Navree-Native: 1' \
              -H 'X-Navree-Client: platform=android; form=phone; vocab=0; scheme=light; text=1.00' \
              -H 'Accept: application/vnd.navree.native+json' "http://127.0.0.1:$port/_navree/native/shell"
          done

      # The emulator runs on the processor's own virtualisation.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The emulator
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          adb="$ANDROID_HOME/platform-tools/adb"
          # The tools and the emulator look for the device in one folder only when both are told it.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" --install emulator platform-tools "$IMAGE" > /dev/null
          echo no | "$sdk/avdmanager" create avd -n screens -k "$IMAGE" -d "${{ matrix.profile }}" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          "$ANDROID_HOME/emulator/emulator" -avd screens -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -accel on -gpu swiftshader_indirect -memory 4096 -cores 4 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          booted=0
          for _ in $(seq 1 120); do
            if [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=1; break; fi
            sleep 5
          done
          if [ "$booted" != 1 ]; then
            echo "the emulator did not start"
            tail -100 "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$adb" shell settings put global "$scale" 0
          done
          "$adb" shell wm size
          "$adb" shell wm density

      # What the web view's engine costs the first time something asks for it, asked first by each of the two
      # things that start it, each in a process of its own, three times. The numbers are in the run's summary.
      # A run in which an install failed, the instrument crashed or a test did not pass, or that left no
      # numbers, fails the step.
      - name: The web view's engine, timed
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" install -r -t "$RUNNER_TEMP"/apks/navree-native/build/outputs/apk/androidTest/debug/*.apk
          echo "### The web view's engine, the first time it is asked for (${{ matrix.device }}, an emulator)" >> "$GITHUB_STEP_SUMMARY"
          : > "$RUNNER_TEMP/no-skips.txt"
          status=0
          for method in theFirstNativeRequestStartsTheEngineThroughTheCookieJar theGuardOnServiceWorkersStartsTheEngineWhenItIsAskedFirst; do
            for run in 1 2 3; do
              file="$RUNNER_TEMP/engine-$method-$run.txt"
              "$adb" logcat -c
              "$adb" shell am instrument -r -w -e cold 1 -e look light -e device "${{ matrix.device }}" -e class "com.navree.client.WebEngineStartTest#$method" \
                com.navree.client.test/androidx.test.runner.AndroidJUnitRunner > "$file"
              python3 -I packages/android/scripts/read_run.py "$file" --look light --count 1 --skips "$RUNNER_TEMP/no-skips.txt" || status=1
              numbers=$("$adb" logcat -d -s WebEngineStart:I | grep 'WebEngineStart' | sed 's/^.*WebEngineStart *: *//')
              if [ -z "$numbers" ]; then
                echo "::error title=The web view's engine, timed::$method, run $run, left no numbers."
                status=1
              fi
              echo "$numbers" | tee -a "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            done
          done
          exit $status

      - name: Screens
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" install -r -t "$RUNNER_TEMP"/apks/navree-native/build/outputs/apk/androidTest/debug/*.apk
          status=0
          # What a run of the device tests said, read from the statuses of its tests (`-r`), not from the line
          # `OK (N tests)`, which counts a test that skipped on an assumption as run and so cannot see one: the
          # run finished, no test failed, as many tests ended as this device is expected to end (`matrix.tests`),
          # and the tests that skipped are the ones scripts/device-skips.txt lists for this look, no more and no fewer.
          read_run() {
            local file=$1 what=$2 look=$3 expected=$4
            sed -n '/^INSTRUMENTATION_RESULT/,$p' "$file" | head -200
            if [ -n "$expected" ]; then
              python3 -I packages/android/scripts/read_run.py "$file" --look "$look" --count "$expected" --skips packages/android/scripts/device-skips.txt
            else
              python3 -I packages/android/scripts/read_run.py "$file" --look "$look"
            fi
          }
          # A tablet is pictured on its side and upright, each in a job of its own; a phone upright.
          orientations="${{ matrix.held }}"
          "$adb" shell settings put system accelerometer_rotation 0
          for orientation in $orientations; do
          # The tablet's image does not turn when the system is told to rotate (its display stays wide),
          # so upright is the display made 1600 wide and 2560 tall: the window a tablet held upright has.
          name="${{ matrix.device }}"
          "$adb" shell settings put system user_rotation 0
          if [ "${{ matrix.device }}" = tablet ] && [ "$orientation" = portrait ]; then
            name=tablet-portrait
            "$adb" shell wm size 1600x2560
          else
            "$adb" shell wm size reset
          fi
          sleep 3
          for look in light dark large rtl; do
            night=no; scale=1.0
            case "$look" in
              dark) night=yes ;;
              large) scale=2.0 ;;
            esac
            "$adb" shell cmd uimode night "$night"
            "$adb" shell settings put system font_scale "$scale"
            "$adb" shell am instrument -r -w -e look "$look" -e device "$name" -e store http://10.0.2.2:8095 -e inbox http://10.0.2.2:8096 -e board http://10.0.2.2:8097 \
              com.navree.client.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/instrument-$name-$look.txt"
            read_run "$RUNNER_TEMP/instrument-$name-$look.txt" "device tests $name $look" "$look" "${{ matrix.tests }}" || status=1
          done
          done
          exit $status

      # What the device wrote, kept even when the tests failed; a missing piece is said, not skipped.
      - name: What the device wrote
        if: always()
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" shell wm size reset
          mkdir -p "$RUNNER_TEMP/screens"
          if ! "$adb" pull /data/local/tmp/navree-screens "$RUNNER_TEMP/screens/"; then
            echo "::warning title=Screens::The pictures and notes were not found on the device."
          fi
          cp "$RUNNER_TEMP"/instrument-*.txt "$RUNNER_TEMP/screens/" || echo "::warning title=Screens::No run of the device tests left its output."
          "$adb" logcat -d > "$RUNNER_TEMP/screens/logcat.txt" || echo "::warning title=Screens::The device's log was not read."
          cp "$RUNNER_TEMP"/demo/*.log "$RUNNER_TEMP/screens/" || echo "::warning title=Screens::The demos' logs were not found."
          ls -R "$RUNNER_TEMP/screens"

      # The pictures are part of what this job proves: a device whose frames came out black (the same size, one colour) is an error, with the host image said.
      - name: The pictures are pictures
        if: always()
        run: python3 -I packages/android/scripts/pictures_check.py "$RUNNER_TEMP/screens/navree-screens"

      # The demo app itself, on the phone: a start second by second with and without a network,
      # back, turning, a link, a form, the app ended by the system and opened again.
      - name: Walk
        if: always() && matrix.device == 'phone'
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" install -r "$RUNNER_TEMP"/apks/demo/build/outputs/apk/debug/demo-debug.apk
          "$adb" shell cmd uimode night no
          "$adb" shell settings put system font_scale 1.0
          chmod +x packages/android/scripts/walk.sh
          status=0
          ADB="$adb" OUT="$RUNNER_TEMP/walk" packages/android/scripts/walk.sh || status=$?
          cp "$RUNNER_TEMP"/demo/walk-server.log "$RUNNER_TEMP/walk/" || echo "::warning title=Walk::The log of the walk's server was not found."
          exit $status

      # The first frame of the build a store would ship, timed (`am start -W`, three cold starts). Only the first
      # frame: the release build is not allowed plain http, so it cannot reach the demo's server at 10.0.2.2 and
      # never shows a page. Each way this can fail is its own warning on the run and a line in the summary; a
      # run in which the release build starts has no warning.
      - name: First frame of the release build
        if: always() && matrix.device == 'phone'
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          warn() {
            echo "::warning title=First frame of the release build::$1"
            echo "The first frame of the release build is not timed in this run: $1" >> "$GITHUB_STEP_SUMMARY"
          }
          apk=$(ls "$RUNNER_TEMP"/apks/demo/build/outputs/apk/release/demo-release-signed.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then warn "no release build was made."; exit 0; fi
          "$adb" uninstall com.navree.demo > /dev/null
          if ! "$adb" install -r "$apk"; then warn "the release build was made but could not be installed."; exit 0; fi
          chmod +x packages/android/scripts/walk.sh
          if ! ADB="$adb" OUT="$RUNNER_TEMP/walk-release" ONLY=starts FIRST_SCREEN=no BUILD="the release build" packages/android/scripts/walk.sh; then
            warn "the release build was installed but a start did not begin or the app was not running after its first frame (see walk.txt in the android-walk-release artifact)."
          fi

      - name: Keep the starts of the release build
        if: always() && matrix.device == 'phone'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-walk-release
          if-no-files-found: ignore
          path: ${{ runner.temp }}/walk-release
          retention-days: 30

      - name: Keep the walk
        if: always() && matrix.device == 'phone'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-walk
          if-no-files-found: ignore
          path: ${{ runner.temp }}/walk
          retention-days: 30

      - name: Keep the screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screens-${{ matrix.name }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/screens
          retention-days: 30

  # The Apple client: the core's libraries from the job above made into an
  # XCFramework (iPhone, simulator and Mac), the package's tests on the Mac
  # and in an iPhone simulator, the Mac and menu-bar demo apps built, the
  # protocol's screens drawn with NavreeShots, the live store, inbox and board
  # demos walked on a Mac and on simulators, and the demo app's UI test passes
  # run in light, dark, the largest text size, right to left and an iPad's
  # regular width, once on the current Xcode and once on the one before; and,
  # on the current Xcode, the Swift package a release makes and the project
  # `navree native:init` writes (Starter/), built.
  apple:
    name: Apple client (Xcode ${{ matrix.xcode }})
    needs: [changes, core]
    if: needs.changes.outputs.apple == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    concurrency:
      group: native-apple-${{ github.ref }}-${{ matrix.xcode }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.6"
            passes: light dark ipad
          - runner: xcode-27
            xcode: "27.2"
            passes: light dark light-largest dark-largest rtl ipad
    defaults:
      run:
        shell: bash
        working-directory: packages/apple
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
    steps:
      - name: Tools on the runner
        working-directory: .
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          ls -d /Applications/Xcode*.app
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version
          swift --version
      - name: The core's libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navree-native-core
          path: ${{ runner.temp }}/navree-native-core
      # The header and the artifact's libraries as one XCFramework, the
      # package's binary target (never committed): an iPhone's, the
      # simulator's, and the Mac's.
      - name: The core as an XCFramework
        id: core
        run: |
          bash scripts/build-core.sh --from "$RUNNER_TEMP/navree-native-core"
          ls -R NavreeCore.xcframework | head -30
          test -d NavreeCore.xcframework/macos-arm64
          echo "mac=true" >> "$GITHUB_OUTPUT"
      - name: Restore XcodeGen
        id: xcodegen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xcodegen
          key: xcodegen-${{ env.XCODEGEN_VERSION }}
      - name: Install XcodeGen
        if: steps.xcodegen.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d ~/xcodegen
      - name: Keep XcodeGen
        if: steps.xcodegen.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xcodegen
          key: xcodegen-${{ env.XCODEGEN_VERSION }}
      - name: Put XcodeGen on the path
        run: |
          echo "$HOME/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      # The Swift package a release makes (its manifest checked and built
      # against the core's zip), and Starter/, which is what `navree
      # native:init` writes (a test of navree-cli keeps the two equal),
      # built for the simulator and the Mac. Once, on the current Xcode.
      - name: The Swift package and the Starter
        if: matrix.xcode == '27.2' && steps.core.outputs.mac == 'true'
        run: |
          mkdir -p build/logs
          bash scripts/swift-package.sh 0.0.0 https://example.invalid/navree "$RUNNER_TEMP/swift-package" \
            2>&1 | tee build/logs/swift-package.log
          cd Starter
          xcodegen generate
          xcodebuild -project Dukaan.xcodeproj -scheme Dukaan -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/starter" build 2>&1 | tee ../build/logs/starter-ios.log | tail -20
          xcodebuild -project Dukaan.xcodeproj -scheme DukaanMac -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/starter" build 2>&1 | tee ../build/logs/starter-mac.log | tail -20
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: apple-live-demos-${{ matrix.xcode }}
      - name: Package tests on the Mac
        if: steps.core.outputs.mac == 'true'
        run: |
          mkdir -p build/logs
          swift test 2>&1 | tee build/logs/swift-test.log
      - name: Package tests in an iPhone simulator
        run: |
          mkdir -p build/logs
          if [ "${{ steps.core.outputs.mac }}" != "true" ]; then
            swift build --target NavreeDesign 2>&1 | tee build/logs/swift-build.log
          fi
          bash scripts/test-in-simulator.sh
      - name: Mac apps, NavreeShots, and live store, inbox and board walks
        run: |
          LIVE_IPAD="${{ matrix.xcode == '27.2' && 'true' || 'false' }}" bash scripts/verify-mac-and-live.sh
      - name: Demo app screens in an iPhone simulator
        run: |
          xcodegen --version
          PASSES="${{ matrix.passes }}" bash scripts/demo-screens.sh
      - name: Keep the screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-screens-xcode-${{ matrix.xcode }}
          path: |
            packages/apple/build/screens
            packages/apple/build/shots
            packages/apple/build/mac-evidence
            packages/apple/build/live-sim-evidence
            packages/apple/build/live-walk
          if-no-files-found: warn
          retention-days: 30
      - name: Keep the logs and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-results-xcode-${{ matrix.xcode }}
          path: |
            packages/apple/build/core/links.txt
            packages/apple/build/logs
            packages/apple/build/results
          if-no-files-found: warn
          retention-days: 14

  # The Windows client: the core built as a DLL, the solution built and tested with
  # the dotnet command alone, and the demo started from its build folder and pictured.
  # It runs twice. "image" is the runner as it comes. "plain" hides Visual Studio and
  # the Windows SDK before the solution is built, to show the build needs neither.
  windows:
    name: Windows client (${{ matrix.variant }})
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: [image, plain]
    concurrency:
      group: native-windows-${{ matrix.variant }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      CI: "true"
      WINAPP_VERSION: "0.8.0"
      # What the audit of the walks counts, added over every look of the three demos (nine files): the most it may count today. The
      # job fails when a count goes above its number; a number is brought down when the count is. The counts move a little from one run
      # to the next (a popup open, a table that has realised a row or not), so the two that count something today (104 controls with
      # no name, 104 parts past the edge) are written with fifteen in a hundred added, and the two that count nothing are written as
      # nothing: one target under 24 px or one text cut fails the job. "no name" is the in-process audit's own count, which asks a
      # control's own peer and so calls a list row nameless (the system's tool names it).
      AUDIT_NO_NAME: "120"
      AUDIT_SMALL_TARGETS: "0"
      AUDIT_TEXTS_CUT: "0"
      AUDIT_PAST_EDGE: "120"
      # What the press run proves: how many of its checks must pass.
      PRESS_PASSES: "7"
      # Checks that say FAIL today because the page does not do the thing yet: one pattern for each. A check that says FAIL and is not named
      # here fails the job; one named here that says PASS is told so, and its line is taken off in the change that fixed it. None is named now:
      # every line that was has been seen to pass in the cloud.
      KNOWN_FAILS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-core

      # The core as a DLL for 64-bit Windows, which the bridge imports and the apps carry.
      - name: The core as a DLL
        shell: bash
        run: |
          cargo rustc -p navree-native-core --locked --release --target x86_64-pc-windows-msvc --crate-type cdylib
          mkdir -p packages/windows/native/win-x64
          cp target/x86_64-pc-windows-msvc/release/navree_native_core.dll packages/windows/native/win-x64/
          ls -l packages/windows/native/win-x64

      # The five functions of the C interface are exported by the DLL.
      - name: The DLL's exports
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $exports = & $dumpbin.FullName /exports packages/windows/native/win-x64/navree_native_core.dll | Select-String '\snavree_(core|bytes)_'
          $exports
          if (@($exports).Count -ne 5) { throw "expected five exported functions, found $(@($exports).Count)" }

      # The C# models are written by the program that writes the Kotlin and Swift ones, from the
      # same schema; its own tests run, and what it writes is what the build then reads.
      - name: The generator's tests, and the C# models written
        shell: bash
        run: |
          cargo test --locked -p xtask --lib native_models
          cargo run --locked -q -p xtask -- native-models
          ls -l packages/windows/src/Navree.Protocol/Models.cs

      - name: Keep the written models
        if: matrix.variant == 'image'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-models
          if-no-files-found: error
          path: packages/windows/src/Navree.Protocol/Models.cs
          retention-days: 14

      - name: What the runner has
        shell: pwsh
        working-directory: packages/windows
        run: |
          dotnet --list-sdks
          dotnet --version
          dotnet --list-runtimes
          if (Test-Path "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe") {
            & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -property displayName
          } else { "no vswhere" }
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          "nuget sources of the solution:"
          dotnet nuget list source
          "nuget sources of the machine:"
          Push-Location $env:RUNNER_TEMP
          dotnet nuget list source
          Pop-Location
          Get-ChildItem "${env:ProgramFiles(x86)}\NuGet\Config" -ErrorAction SilentlyContinue | ForEach-Object { "machine config: $($_.FullName)"; Get-Content $_.FullName }

      # What a machine with only the .NET SDK has: no Visual Studio and no Windows SDK.
      - name: Hide Visual Studio and the Windows SDK
        if: matrix.variant == 'plain'
        shell: pwsh
        run: |
          $folders = @(
            "$env:ProgramFiles\Microsoft Visual Studio",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio",
            "${env:ProgramFiles(x86)}\Windows Kits",
            "${env:ProgramFiles(x86)}\Microsoft SDKs"
          )
          foreach ($folder in $folders) {
            if (Test-Path -LiteralPath $folder) {
              try {
                Rename-Item -LiteralPath $folder -NewName ((Split-Path $folder -Leaf) + ' (hidden)') -ErrorAction Stop
                "hidden: $folder"
              } catch { "not hidden: $folder ($($_.Exception.Message))" }
            } else { "not there: $folder" }
          }
          # Visual Studio's installer leaves machine-wide NuGet settings (a source and a fallback folder) that point into its own folders.
          $offline = Get-ChildItem "${env:ProgramFiles(x86)}\NuGet\Config" -Filter 'Microsoft.VisualStudio.*.config' -ErrorAction SilentlyContinue
          foreach ($config in $offline) {
            Rename-Item -LiteralPath $config.FullName -NewName ($config.Name + '.hidden')
            "hidden: $($config.FullName)"
          }

      # The dotnet command alone: restore, then build the whole solution. Restoring is from the lock files kept beside each project
      # (CI is true on this runner, which makes a restore that would change a package fail), and the versions it used are printed.
      - name: Restore
        shell: pwsh
        working-directory: packages/windows
        run: |
          dotnet restore Navree.Native.sln
          if ('${{ matrix.variant }}' -eq 'image') { dotnet restore demo/Navree.Demo.Packaged/Navree.Demo.Packaged.csproj }
          "packages restored, from the lock files:"
          Get-ChildItem -Recurse -Filter packages.lock.json | ForEach-Object {
            $locked = Get-Content $_.FullName -Raw | ConvertFrom-Json
            foreach ($framework in $locked.dependencies.PSObject.Properties) {
              foreach ($package in $framework.Value.PSObject.Properties) { if ($package.Value.type -ne 'Project') { "$($package.Name) $($package.Value.resolved)" } }
            }
          } | Sort-Object -Unique

      - name: Build
        shell: pwsh
        working-directory: packages/windows
        run: dotnet build Navree.Native.sln -c Release --no-restore

      # The demo and the gallery start from their built folders with nothing registered, so the folders are kept:
      # either can be started on another Windows machine.
      - name: Keep the built demo and gallery
        if: matrix.variant == 'plain'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-demo
          if-no-files-found: error
          path: |
            packages/windows/demo/Navree.Demo/bin/Release
            packages/windows/demo/Navree.Gallery/bin/Release
          retention-days: 14

      - name: Unit tests
        shell: pwsh
        working-directory: packages/windows
        run: dotnet test Navree.Native.sln -c Release --no-build --logger trx --results-directory "$env:RUNNER_TEMP/trx"

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-reports-${{ matrix.variant }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/trx
          retention-days: 14

      # What a release gives nuget.org, without the push (release.yml's windows-package and nuget jobs do the same with the
      # release's version): each library under src/ packed from what was built above, at a version of the run's own, and
      # every package read back for what an app needs of it: its id and version, the licence, its library, the other
      # libraries as dependencies at that same version, a WinUI library's resources, and in Navree.Core the core's DLL.
      # Once, on the machine that has only the .NET SDK.
      - name: The NuGet packages
        if: matrix.variant == 'plain'
        shell: pwsh
        working-directory: packages/windows
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/pack.ps1 -Version 0.0.0 -Out "$env:RUNNER_TEMP/nuget"

      - name: Keep the NuGet packages
        if: matrix.variant == 'plain'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/nuget/navree-windows-0.0.0.zip
            ${{ runner.temp }}/nuget/navree-windows-0.0.0.zip.sha256
          retention-days: 14

      # A tool that drives and pictures a running app, at the version written in WINAPP_VERSION: the one release the job's
      # pictures, accessibility trees and package are made with, and the job says which it found.
      - name: The winapp command
        if: matrix.variant == 'image'
        uses: microsoft/setup-WinAppCli@9288bd0729bd3f71e2ed1b9eb247dc91470b824e # v0.3
        with:
          version: v${{ env.WINAPP_VERSION }}

      - name: The winapp version in use
        if: matrix.variant == 'image'
        shell: pwsh
        run: |
          $said = (& winapp --version 2>&1 | Out-String).Trim()
          "winapp says: $said"
          if ($said -notmatch [regex]::Escape($env:WINAPP_VERSION)) { throw "winapp $env:WINAPP_VERSION was asked for and the machine has: $said" }

      # The demo is started from its build folder, with no registration, and its window is
      # pictured every way there is; the report says which ways worked on this runner. The step
      # fails when the demo did not start, showed no window, or its three walks made no picture.
      - name: Start the demo and take pictures
        if: matrix.variant == 'image'
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Demo/bin/Release -Recurse -Filter Navree.Demo.exe | Select-Object -First 1
          if (-not $exe) { throw "the demo was not built" }
          Get-ChildItem $exe.Directory.FullName | Select-Object -First 400 | ForEach-Object { $_.Name } | Out-File "$env:RUNNER_TEMP\demo-files.txt"
          powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/take-pictures.ps1 -Exe $exe.FullName -OutDir "$env:RUNNER_TEMP\pictures"
          Copy-Item "$env:RUNNER_TEMP\demo-files.txt" "$env:RUNNER_TEMP\pictures\"

      # The drawn kinds (charts, rings, gauges, flags and the composition kinds) on their own, at three widths, in light, dark and
      # right to left; the screens are written for the purpose, and the protocol's own examples.
      - name: Evidence, pictures of the drawn kinds
        if: matrix.variant == 'image'
        continue-on-error: true
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Demo/bin/Release -Recurse -Filter Navree.Demo.exe | Select-Object -First 1
          $folder = Split-Path -Parent $exe.FullName
          $out = "$env:RUNNER_TEMP\pictures\kinds"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($look in @(@('--light'), @('--dark'), @('--light', '--rtl'))) {
            $arguments = @('--kinds', $out) + $look
            $run = Start-Process -FilePath $exe.FullName -ArgumentList $arguments -WorkingDirectory $folder -PassThru
            if (-not $run.WaitForExit(480000)) { "the kinds walk $($look -join ' ') did not end in 480 seconds"; Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem $out | ForEach-Object { "$($_.Name) $($_.Length)" }
          Get-ChildItem $out -Filter '*kinds.txt' | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName }
          $log = Join-Path $folder 'navree-demo.log'
          if (Test-Path $log) { Copy-Item $log (Join-Path $out 'navree-demo.log') }

      # The store, inbox and board demos, answering the client for real (SQLite, on this machine). Each is walked in light, dark
      # and right to left (the widest window in light only): every destination at 480, 840, 1280 and 1800 wide; the first two links
      # of a destination that lead to another screen are pushed and pictured (a screen that only a third link reaches is not
      # walked); the first three sheets, dialogs or popovers a screen holds are opened at 840 wide only. Each picture is the window
      # as the screen shows it, with what is over it. The step fails when a demo's server does not answer or a walk does not end.
      - name: Build the store, inbox and board demos
        if: matrix.variant == 'image'
        run: cargo build --locked -p store-demo -p inbox-demo -p board-demo --features store-demo/native-preview,inbox-demo/native-preview,board-demo/native-preview

      # The servers are started in the step that walks them: a process left running by a step does not outlive it on this runner.
      - name: Walk every screen of the three demos
        if: matrix.variant == 'image'
        shell: pwsh
        run: |
          $problems = @()
          $folder = "$env:RUNNER_TEMP\demos"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $ids = @()
          $servers = @(
            @{ name = 'store'; port = 8095; simulator = 'STORE_SIMULATOR'; database = 'STORE_DATABASE_URL'; extra = @{} },
            @{ name = 'inbox'; port = 8096; simulator = 'INBOX_SIMULATOR'; database = 'INBOX_DATABASE_URL'; extra = @{ INBOX_SCALE = '2000' } },
            @{ name = 'board'; port = 8097; simulator = 'BOARD_SIMULATOR'; database = 'BOARD_DATABASE_URL'; extra = @{} }
          )
          try {
            foreach ($server in $servers) {
              $env:PORT = [string]$server.port
              Set-Item -Path "env:$($server.simulator)" -Value 'off'
              Set-Item -Path "env:$($server.database)" -Value "sqlite://$($server.name).db?mode=rwc"
              foreach ($key in $server.extra.Keys) { Set-Item -Path "env:$key" -Value $server.extra[$key] }
              $run = Start-Process -FilePath "$PWD\target\debug\$($server.name)-demo.exe" -WorkingDirectory $folder -PassThru -RedirectStandardOutput "$folder\$($server.name).log" -RedirectStandardError "$folder\$($server.name).err.log"
              $ids += $run.Id
            }
            $diagnosis = "$folder\diagnosis.txt"
            foreach ($server in $servers) {
              $up = $false
              for ($i = 0; $i -lt 240 -and -not $up; $i++) {
                try { Invoke-WebRequest -Uri "http://127.0.0.1:$($server.port)/" -UseBasicParsing -TimeoutSec 3 | Out-Null; $up = $true } catch { if ($_.Exception.Response) { $up = $true } else { Start-Sleep -Seconds 1 } }
              }
              "$($server.name) on $($server.port): " + $(if ($up) { 'answers' } else { 'did not answer' })
              if (-not $up) { $problems += "the $($server.name) demo's server did not answer" }
            }
            $ids | ForEach-Object { $p = Get-Process -Id $_ -ErrorAction SilentlyContinue; "process ${_}: " + $(if ($p) { $p.ProcessName + ' alive' } else { 'gone' }) } | Out-File $diagnosis
            Get-Content $diagnosis

            $exe = Get-ChildItem packages/windows/demo/Navree.Demo/bin/Release -Recurse -Filter Navree.Demo.exe | Select-Object -First 1
            $out = "$env:RUNNER_TEMP\full"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            $apps = @(@('store', 8095), @('inbox', 8096), @('board', 8097))
            $looks = @(@('--light'), @('--dark'), @('--light', '--rtl'))
            foreach ($app in $apps) {
              foreach ($look in $looks) {
                $arguments = @('--full', $out, '--name', $app[0], '--server', "http://127.0.0.1:$($app[1])") + $look
                $run = Start-Process -FilePath $exe.FullName -ArgumentList $arguments -WorkingDirectory $exe.Directory.FullName -PassThru
                if (-not $run.WaitForExit(900000)) { $problems += "the walk of $($app[0]) $($look -join ' ') did not end in 900 seconds"; Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue }
                else { "the walk of $($app[0]) $($look -join ' ') ended" }
              }
              # What a person does in the app, with each thing's outcome said: forward and back, more rows, a search, a form's errors, a message sent, a second window, signing out.
              $run = Start-Process -FilePath $exe.FullName -ArgumentList @('--checks', $out, '--name', $app[0], '--server', "http://127.0.0.1:$($app[1])", '--light') -WorkingDirectory $exe.Directory.FullName -PassThru
              if (-not $run.WaitForExit(600000)) { $problems += "the checks of $($app[0]) did not end in 600 seconds"; Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue }
              else { "the checks of $($app[0]) ended" }
              # The store's orders table under a hand: the wheel and the keys to the end of the rows held, a right click on a row and its menu.
              if ($app[0] -eq 'store') {
                $run = Start-Process -FilePath $exe.FullName -ArgumentList @('--hands', $out, '--server', "http://127.0.0.1:$($app[1])", '--light') -WorkingDirectory $exe.Directory.FullName -PassThru
                if (-not $run.WaitForExit(300000)) { $problems += "the hands on the table did not end in 300 seconds"; Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue }
                else { "the hands on the table ended" }
                if (Test-Path "$out\hands.txt") { Get-Content "$out\hands.txt" }
              }
              # A popover of the inbox opened with the real pointer and taken away with Escape.
              if ($app[0] -eq 'inbox') {
                $run = Start-Process -FilePath $exe.FullName -ArgumentList @('--popover', $out, '--server', "http://127.0.0.1:$($app[1])", '--light') -WorkingDirectory $exe.Directory.FullName -PassThru
                if (-not $run.WaitForExit(240000)) { $problems += "the popover check did not end in 240 seconds"; Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue }
                else { "the popover check ended" }
                if (Test-Path "$out\popover.txt") { Get-Content "$out\popover.txt" }
              }
              # What a person meets when an answer arrives while they are in the middle of something: the page is brought up to date where it stands, and
              # each scenario reads that what the person was using is the same object afterwards, with what they did still in it and the focus where it was.
              $run = Start-Process -FilePath $exe.FullName -ArgumentList @('--page', "$out\page-$($app[0])", '--server', "http://127.0.0.1:$($app[1])", '--light') -WorkingDirectory $exe.Directory.FullName -PassThru
              if (-not $run.WaitForExit(600000)) { $problems += "the page walk of $($app[0]) did not end in 600 seconds"; Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue }
              else { "the page walk of $($app[0]) ended" }
              if (Test-Path "$out\page-$($app[0])\page.txt") { Get-Content "$out\page-$($app[0])\page.txt" }
              # A card of the board moved with the real keys, a real click on its menu and the real pointer, and what the server kept.
              if ($app[0] -eq 'board') {
                $run = Start-Process -FilePath $exe.FullName -ArgumentList @('--moves', $out, '--server', "http://127.0.0.1:$($app[1])", '--light') -WorkingDirectory $exe.Directory.FullName -PassThru
                if (-not $run.WaitForExit(480000)) { $problems += "the moves of a card did not end in 480 seconds"; Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue }
                else { "the moves of a card ended" }
                if (Test-Path "$out\moves.txt") { Get-Content "$out\moves.txt" }
              }
            }
            # The same walk with no server, on the protocol's own pages: a disclosure, a pane that waits for its page, and the form with a colour field and a file field
            # (a colour chosen with the keyboard, files chosen through a picker the walk supplies, what the walk's own server received read by hash).
            $run = Start-Process -FilePath $exe.FullName -ArgumentList @('--page', "$out\page-fixtures", '--light') -WorkingDirectory $exe.Directory.FullName -PassThru
            if (-not $run.WaitForExit(600000)) { $problems += "the page walk of the fixtures did not end in 600 seconds"; Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue }
            else { "the page walk of the fixtures ended" }
            if (Test-Path "$out\page-fixtures\page.txt") { Get-Content "$out\page-fixtures\page.txt" }
            # Signing out empties what the web view keeps, read from the web view: a web page that stores a cookie and a value is shown,
            # left, and the person signs out with the answer a server gives; the web page shown after says what it finds. No server is needed.
            $run = Start-Process -FilePath $exe.FullName -ArgumentList @('--wipe', $out, '--light') -WorkingDirectory $exe.Directory.FullName -PassThru
            if (-not $run.WaitForExit(300000)) { $problems += "the wipe check did not end in 300 seconds"; Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue }
            else { "the wipe check ended" }
            if (Test-Path "$out\wipe.txt") { Get-Content "$out\wipe.txt" }
            # A screen the shell presents as a sheet is pushed at 480, 840 and 1280 wide, from the protocol's own examples (no demo server
            # presents a route as a sheet): the sheet must show what the screen holds.
            $run = Start-Process -FilePath $exe.FullName -ArgumentList @('--sheet', $out, '--light') -WorkingDirectory $exe.Directory.FullName -PassThru
            if (-not $run.WaitForExit(300000)) { $problems += "the sheet walk did not end in 300 seconds"; Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue }
            else { "the sheet walk ended" }
            if (Test-Path "$out\sheet.txt") { Get-Content "$out\sheet.txt" }
            Get-ChildItem $out -Filter '*-checks.txt' | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName }
            Get-ChildItem $out -Filter '*-faults.txt' | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName }
            $log = Join-Path $exe.Directory.FullName 'navree-demo.log'
            if (Test-Path $log) { Copy-Item $log (Join-Path $out 'navree-demo.log') }
          } finally {
            foreach ($id in $ids) { Stop-Process -Id $id -Force -ErrorAction SilentlyContinue }
          }
          if ($problems) { $problems | ForEach-Object { "PROBLEM: $_" }; throw "the walks did not all run: $($problems -join '; ')" }

      # What the walks found decides the job: every check line the demos wrote (the page walks' too) is read, and any that says FAIL fails it; a run that
      # wrote no checks, or stopped before its last line, fails it; and the audit's counts are added over every look and may not
      # pass the numbers written at the top of this job.
      - name: What the walks found
        if: always() && matrix.variant == 'image'
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\full"
          $failed = @()
          $known = @($env:KNOWN_FAILS -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $stillFailing = @()
          foreach ($file in 'store-checks.txt', 'inbox-checks.txt', 'board-checks.txt', 'wipe.txt', 'sheet.txt', 'hands.txt', 'popover.txt', 'moves.txt', 'page-store\page.txt', 'page-inbox\page.txt', 'page-board\page.txt', 'page-fixtures\page.txt') {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) { $failed += "$file was not written"; continue }
            $lines = Get-Content $path
            $passes = @($lines | Where-Object { $_ -match '\[(check|hands|popover|moves|page)\] PASS' }).Count
            $fails = @($lines | Where-Object { $_ -match '\[(check|hands|popover|moves|page)\] FAIL' })
            $unknown = @($fails | Where-Object { $line = $_; -not ($known | Where-Object { $line -match $_ }) })
            $stillFailing += $fails | Where-Object { $line = $_; $known | Where-Object { $line -match $_ } }
            "$file : $passes passed, $($fails.Count) failed ($($fails.Count - $unknown.Count) of them named in KNOWN_FAILS)"
            $fails | ForEach-Object { "    $_" }
            $failed += $unknown | ForEach-Object { "$file : $_" }
            if ($lines[-1] -notmatch ' done$') { $failed += "$file stopped before its last line" }
            if ($passes -eq 0) { $failed += "$file holds no passing check" }
          }
          $faultFiles = @(Get-ChildItem $out -Filter '*-faults.txt')
          "audit files: $($faultFiles.Count)"
          if ($faultFiles.Count -ne 9) { $failed += "expected nine audit files (three demos, three looks), found $($faultFiles.Count)" }
          $sum = @(0, 0, 0, 0)
          foreach ($file in $faultFiles) {
            foreach ($line in Get-Content $file.FullName) {
              if ($line -match ': (\d+) controls with no name, (\d+) targets under 24 px, (\d+) texts cut, (\d+) parts past') {
                for ($i = 0; $i -lt 4; $i++) { $sum[$i] += [int]$Matches[$i + 1] }
              }
            }
          }
          $limits = @([int]$env:AUDIT_NO_NAME, [int]$env:AUDIT_SMALL_TARGETS, [int]$env:AUDIT_TEXTS_CUT, [int]$env:AUDIT_PAST_EDGE)
          $names = @('controls with no name', 'targets under 24 px', 'texts cut', 'parts past the window edge')
          for ($i = 0; $i -lt 4; $i++) {
            "audit: $($names[$i]) $($sum[$i]) (at most $($limits[$i]))"
            if ($sum[$i] -gt $limits[$i]) { $failed += "the audit counts $($sum[$i]) $($names[$i]), more than the $($limits[$i]) written in this job" }
          }
          foreach ($pattern in ($known | Where-Object { $_ -notmatch '^\[press' })) {
            if (-not ($stillFailing | Where-Object { $_ -match $pattern })) { "NOTE: '$pattern' no longer fails: take it off KNOWN_FAILS" }
          }
          if ($failed) { $failed | ForEach-Object { "FAILED: $_" }; throw "the walks found $($failed.Count) thing(s) wrong" }

      - name: Keep the pictures of every screen
        if: always() && matrix.variant == 'image'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-every-screen
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/full
            ${{ runner.temp }}/demos/*.log
            ${{ runner.temp }}/demos/*.txt
          retention-days: 30

      # The picture of the whole screen is written whether the demo started or not, so it proves nothing: the window of the demo
      # was pictured by one of the ways that picture the window, and the walks made pictures of the app's own content.
      - name: A picture of the demo was taken
        if: always() && matrix.variant == 'image'
        shell: pwsh
        run: |
          $folder = "$env:RUNNER_TEMP/pictures"
          $window = @(Get-ChildItem $folder -Filter 'window-*.png' -ErrorAction SilentlyContinue)
          $content = @(Get-ChildItem "$folder/walk" -Filter *.png -ErrorAction SilentlyContinue)
          $window | ForEach-Object { "$($_.Name) $($_.Length) bytes" }
          "the walks made $($content.Count) pictures of the app's content"
          if (-not $window) { throw "no picture of the demo's window was taken" }
          if (-not $content) { throw "the walks made no picture of the app's content" }

      - name: Keep the pictures
        if: always() && matrix.variant == 'image'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-pictures
          if-no-files-found: ignore
          path: ${{ runner.temp }}/pictures
          retention-days: 30

      - name: Keep the core's DLL
        if: always() && matrix.variant == 'image'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navree-native-core-windows
          if-no-files-found: error
          path: packages/windows/native/win-x64/navree_native_core.dll
          retention-days: 30

      # The demo's place in Windows, with no package: the count on the taskbar, the icon in the notification area, the
      # small window, settings, a notification, more windows, the full screen, what comes from outside. The report says
      # what the system accepted and what it only was asked.
      - name: Evidence, the place in Windows, no package
        if: always() && matrix.variant == 'image'
        continue-on-error: true
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Demo/bin/Release -Recurse -Filter Navree.Demo.exe | Select-Object -First 1
          if (-not $exe) { throw "the demo was not built" }
          powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/take-system-pictures.ps1 -Exe $exe.FullName -OutDir "$env:RUNNER_TEMP\system-unpackaged"

      - name: Keep the pictures of the place in Windows, no package
        if: always() && matrix.variant == 'image'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-system-unpackaged
          if-no-files-found: ignore
          path: ${{ runner.temp }}/system-unpackaged
          retention-days: 30

      # Evidence, not a proof: the demo as a package: its pictures are drawn, a development certificate is made, and the package is built and signed.
      # Then the same walk is run with package identity, through the loose layout the winapp command registers from the same
      # manifest, which is what lets the features that need identity be tried.
      - name: Evidence, the demo as a package
        if: always() && matrix.variant == 'image'
        continue-on-error: true
        shell: powershell
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowAllTrustedApps /d 1
          $project = "packages/windows/demo/Navree.Demo.Packaged/Navree.Demo.Packaged.csproj"
          $out = "$env:RUNNER_TEMP\package"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/make-assets.ps1 -Out packages/windows/demo/Navree.Demo.Packaged/Assets
          winapp cert generate --manifest packages/windows/demo/Navree.Demo.Packaged/Package.appxmanifest --output "$out\devcert.pfx" --export-cer --install 2>&1 | Tee-Object -FilePath "$out\cert.txt"
          winapp pack $project -c Release --arch x64 --cert "$out\devcert.pfx" --output "$out\Navree.Demo.msix" 2>&1 | Tee-Object -FilePath "$out\pack.txt"
          Get-ChildItem $out | ForEach-Object { "$($_.Name) $($_.Length)" }
          if (-not (Test-Path "$out\Navree.Demo.msix")) { throw "the package was not built" }

      # Only the package leaves the runner. The key it was signed with, the certificate and the tool's log stay on it: the
      # repository is public, and a key that is kept is a key that anyone may sign with.
      - name: Keep the package
        if: always() && matrix.variant == 'image'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-demo-package
          if-no-files-found: ignore
          path: ${{ runner.temp }}/package/*.msix
          retention-days: 30

      - name: Evidence, the place in Windows, with package identity
        if: always() && matrix.variant == 'image'
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/take-system-pictures.ps1 -Project packages/windows/demo/Navree.Demo.Packaged/Navree.Demo.Packaged.csproj -Packaged -OutDir "$env:RUNNER_TEMP\system-packaged"

      - name: Keep the pictures of the place in Windows, with package identity
        if: always() && matrix.variant == 'image'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-system-packaged
          if-no-files-found: ignore
          path: ${{ runner.temp }}/system-packaged
          retention-days: 30

      # The data table on its own in the gallery: each time the gallery says a table is ready a picture of its window is taken,
      # and what the scenarios measured (rows made, scroll positions, keys and the pointer) is written beside the pictures.
      - name: Evidence, the data table in the gallery
        if: always() && matrix.variant == 'image'
        continue-on-error: true
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Gallery/bin/Release -Recurse -Filter Navree.Gallery.exe | Select-Object -First 1
          if (-not $exe) { throw "the gallery was not built" }
          powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/run-gallery.ps1 -Exe $exe.FullName -OutDir "$env:RUNNER_TEMP\gallery" -Run "table,pointer,rows100k,stick,anchor"

      - name: What the gallery measured
        if: always() && matrix.variant == 'image'
        shell: pwsh
        run: |
          foreach ($name in 'script.txt', 'results.txt', 'analysis.txt') {
            "---- $name"
            if (Test-Path "$env:RUNNER_TEMP/gallery/$name") { Get-Content "$env:RUNNER_TEMP/gallery/$name" } else { "(not written)" }
          }

      - name: Keep the pictures and measurements of the data table
        if: always() && matrix.variant == 'image'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-gallery
          if-no-files-found: ignore
          path: ${{ runner.temp }}/gallery
          retention-days: 30

      # The store demo on the recorded answers, with the real pointer and keys: the order number is pressed, a quantity is typed
      # and Restock is pressed, the Filter button is opened and a box ticked. The demo writes what the core was asked to send.
      - name: Press the buttons of the store demo
        if: always() && matrix.variant == 'image'
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Demo/bin/Release -Recurse -Filter Navree.Demo.exe | Select-Object -First 1
          if (-not $exe) { throw "the demo was not built" }
          powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/run-gallery.ps1 -Exe $exe.FullName -OutDir "$env:RUNNER_TEMP\press" -Run "press" -Seconds 300

      - name: What was pressed, and what the core was asked to send
        if: always() && matrix.variant == 'image'
        shell: pwsh
        run: |
          foreach ($name in 'press.txt', 'script.txt') {
            "---- $name"
            if (Test-Path "$env:RUNNER_TEMP/press/$name") { Get-Content "$env:RUNNER_TEMP/press/$name" } else { "(not written)" }
          }
          $log = Get-ChildItem packages/windows/demo/Navree.Demo/bin/Release -Recurse -Filter navree-demo.log | Select-Object -First 1
          if ($log) { "---- navree-demo.log"; Get-Content $log.FullName }
          # The press run is a proof: every line that says FAIL fails the job, and so does a run that passed fewer checks than PRESS_PASSES.
          $press = "$env:RUNNER_TEMP/press/press.txt"
          if (-not (Test-Path $press)) { throw "the press run wrote no press.txt" }
          $lines = Get-Content $press
          $passes = @($lines | Where-Object { $_ -match '\[press\] PASS' }).Count
          $fails = @($lines | Where-Object { $_ -match '\[press\] FAIL' })
          $known = @($env:KNOWN_FAILS -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $unknown = @($fails | Where-Object { $line = $_; -not ($known | Where-Object { $line -match $_ }) })
          "press: $passes passed, $($fails.Count) failed ($($fails.Count - $unknown.Count) of them named in KNOWN_FAILS; at least $env:PRESS_PASSES must pass)"
          $fails | ForEach-Object { "    $_" }
          $unknown | ForEach-Object { "FAILED: $_" }
          foreach ($pattern in ($known | Where-Object { $_ -match '^\[press' })) {
            if (-not ($fails | Where-Object { $_ -match $pattern })) { "NOTE: '$pattern' no longer fails: take it off KNOWN_FAILS" }
          }
          if ($unknown.Count -gt 0 -or $passes -lt [int]$env:PRESS_PASSES -or $lines[-1] -notmatch ' done$') { throw "the press run did not pass" }

      - name: Keep what was pressed
        if: always() && matrix.variant == 'image'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-pressing
          if-no-files-found: ignore
          path: ${{ runner.temp }}/press
          retention-days: 30

      # The same tables at larger text and in the system's high contrast colours. The system may not take either on a hosted
      # machine, so what it was told and what the gallery read are both kept. These come last: they change the machine.
      - name: Evidence, the data table at larger text
        if: always() && matrix.variant == 'image'
        continue-on-error: true
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Gallery/bin/Release -Recurse -Filter Navree.Gallery.exe | Select-Object -First 1
          $key = 'HKCU:\Software\Microsoft\Accessibility'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          try {
            foreach ($scale in 150, 225) {
              Set-ItemProperty -Path $key -Name TextScaleFactor -Value $scale -Type DWord -Force
              Start-Sleep -Seconds 2
              powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/run-gallery.ps1 -Exe $exe.FullName -OutDir "$env:RUNNER_TEMP\gallery-text$scale" -Run "tabletext" -Seconds 200
            }
          } finally {
            Remove-ItemProperty -Path $key -Name TextScaleFactor -ErrorAction SilentlyContinue
          }

      - name: Evidence, the data table in high contrast
        if: always() && matrix.variant == 'image'
        continue-on-error: true
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Gallery/bin/Release -Recurse -Filter Navree.Gallery.exe | Select-Object -First 1
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/set-contrast.ps1 -On
            powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/run-gallery.ps1 -Exe $exe.FullName -OutDir "$env:RUNNER_TEMP\gallery-contrast" -Run "tabletext" -Seconds 200
          } finally {
            powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/set-contrast.ps1 -Off
          }

      # The box that chooses a row, drawn on a page of its own in two ways, each in a process of its own so that a way
      # that stops the app costs one page: in light and dark, then in the system's high contrast colours.
      - name: Evidence, the chosen box in light and dark
        if: always() && matrix.variant == 'image'
        continue-on-error: true
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Gallery/bin/Release -Recurse -Filter Navree.Gallery.exe | Select-Object -First 1
          foreach ($way in 'states') {
            powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/run-gallery.ps1 -Exe $exe.FullName -OutDir "$env:RUNNER_TEMP\box-$way" -Run "contrast-$way" -Seconds 90
          }

      - name: Evidence, the chosen box in high contrast
        if: always() && matrix.variant == 'image'
        continue-on-error: true
        shell: powershell
        run: |
          $exe = Get-ChildItem packages/windows/demo/Navree.Gallery/bin/Release -Recurse -Filter Navree.Gallery.exe | Select-Object -First 1
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/set-contrast.ps1 -On
            foreach ($way in 'states') {
              powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/run-gallery.ps1 -Exe $exe.FullName -OutDir "$env:RUNNER_TEMP\box-contrast-$way" -Run "contrast-$way" -Seconds 90
            }
          } finally {
            powershell -NoProfile -ExecutionPolicy Bypass -File packages/windows/scripts/set-contrast.ps1 -Off
          }

      - name: Keep the larger text and high contrast pictures
        if: always() && matrix.variant == 'image'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-gallery-settings
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/gallery-text150
            ${{ runner.temp }}/gallery-text225
            ${{ runner.temp }}/gallery-contrast
            ${{ runner.temp }}/box-states
            ${{ runner.temp }}/box-contrast-states
          retention-days: 30

      # What the generator wrote is what is committed: a stale model fails the run, after the rest has run.
      - name: The written models are the committed ones
        if: always()
        shell: bash
        run: |
          status="$(git status --porcelain -- packages xtask)"
          echo "$status"
          test -z "$status"
