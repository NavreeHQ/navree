name: Native

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/navree-native/**"
      - "crates/navree-native-core/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ---------------------------------------------------------------------------
  # The runtime core: its tests, a C program built against its header, and the
  # libraries the phones' clients link. Nothing here needs a Mac: a static
  # library is an archive, which is written without Apple's linker.
  # ---------------------------------------------------------------------------
  core:
    name: Runtime core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-linux-android,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Every transcript replayed, each held to the schema; the scale test.
      - name: Tests
        run: cargo test -p navree-native-core

      - name: Lints, with the Kotlin glue
        run: cargo clippy -p navree-native-core --all-targets --features jni -- -D warnings

      # The header and the library agree, and a C program can drive the core.
      - name: A C program against the header
        run: bash crates/navree-native-core/tests/c/run.sh

      # Android: shared libraries with the glue for com.navree.core.Core, linked
      # with the runner's NDK for API 26 and laid out for 16 KB pages.
      - name: Android libraries
        env:
          PAGES: -C link-arg=-Wl,-z,max-page-size=16384
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk/aarch64-linux-android26-clang" \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="$PAGES" \
            cargo rustc -p navree-native-core --release --features jni --target aarch64-linux-android --crate-type cdylib
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ndk/x86_64-linux-android26-clang" \
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS="$PAGES" \
            cargo rustc -p navree-native-core --release --features jni --target x86_64-linux-android --crate-type cdylib
          # The four native methods of the Kotlin class are in each library.
          for target in aarch64-linux-android x86_64-linux-android; do
            count=$("$ndk/llvm-nm" -D --defined-only "target/$target/release/libnavree_native_core.so" | grep -c ' T Java_com_navree_core_Core_native')
            test "$count" -eq 4
          done

      - name: iOS libraries
        run: |
          cargo rustc -p navree-native-core --release --target aarch64-apple-ios --crate-type staticlib
          cargo rustc -p navree-native-core --release --target aarch64-apple-ios-sim --crate-type staticlib

      - name: Keep the libraries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navree-native-core
          if-no-files-found: error
          path: |
            crates/navree-native-core/include/navree_core.h
            target/aarch64-linux-android/release/libnavree_native_core.so
            target/x86_64-linux-android/release/libnavree_native_core.so
            target/aarch64-apple-ios/release/libnavree_native_core.a
            target/aarch64-apple-ios-sim/release/libnavree_native_core.a
