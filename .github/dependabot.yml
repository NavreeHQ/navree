# Dependabot version updates for the parts of the repository that ship.
# Security updates (on in the repository settings) cover every lockfile,
# including the benchmark apps, whenever an advisory is published.
#
# @types/node follows the Node.js major the code runs on (24 on the build
# machines, 22 on the server), so its major updates are ignored in every npm
# directory; raise it by hand together with the runtime.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/website
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      website-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/crm-web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      crm-web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /packages/js
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      packages-js-minor-and-patch:
        update-types: [minor, patch]
      # @navree/next and @navree/nuxt share one TanStack Table major, so its
      # React and Vue adapters move in one pull request. Minor and patch
      # updates already land in the group above; this one takes the majors.
      tanstack-table:
        patterns: ["@tanstack/*-table"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        patterns: ["*"]
