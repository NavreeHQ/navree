# Each listener has settings of its own.
per_listener_settings true

# Anyone may connect.
listener 1883
allow_anonymous true

# A login is required: navree / navree-secret (the password file
# scripts/ci-services.sh writes).
listener 1884
allow_anonymous false
password_file /mosquitto/state/passwd

# A login is required, over TLS (the certificate scripts/ci-services.sh
# writes; no public authority signed it).
listener 8883
allow_anonymous false
password_file /mosquitto/state/passwd
certfile /mosquitto/state/cert.pem
keyfile /mosquitto/state/key.pem
