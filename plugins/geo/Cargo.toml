[package]
name = "navree-plugin-geo"
description = "Maps and places for a Navree app: a map component and a drop-point form field, the worked example of a plugin's own UI components."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# Application code: unsafe stays forbidden.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
# A path rather than `workspace = true`: on Rust 1.95, the minimum version, Cargo
# cannot turn off default features that the workspace entry leaves on. A plugin
# outside this repository writes
# `navree = { version = "1.3", features = ["ui", "ui-extension-files"] }`.
navree = { path = "../../crates/navree", default-features = false, features = ["ui", "ui-extension-files"] }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
navree = { path = "../../crates/navree", default-features = false, features = ["ui", "ui-extension-files", "testing", "browser", "session", "crypto"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
