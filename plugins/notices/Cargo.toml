[package]
name = "navree-plugin-notices"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "A notice board for a housing society or office. Not an official Navree package."
license = "MIT OR Apache-2.0"
keywords = ["navree-plugin", "navree"]
readme = "README.md"

[package.metadata.navree.plugin]
title = "Notice board"
module = "NoticesModule::from_config()"
features = ["helm", "orm", "queue", "schedule", "ui", "view"]
config = ["notices"]
env = ["APP_NOTICES__DIGEST_FROM"]
grants = { member = ["notices.read"], admin = ["notices.read", "notices.publish"] }

[features]
test-postgres = ["navree/postgres"]
test-mysql = ["navree/mysql"]

[dependencies]
http = "1.5.0"
navree = { path = "../../crates/navree", default-features = false, features = ["helm", "orm", "queue", "schedule", "ui", "view"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
navree = { path = "../../crates/navree", default-features = false, features = ["helm", "orm", "queue", "schedule", "ui", "view", "i18n", "testing", "sqlite"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
