notes = "Diff reviewed. Adds hwb() color parsing, angle units on hsl() and hsla() hues and slash alpha separators; matches CSS Syntax Level 3 non-ASCII identifier code points; parses PaintOrder into a stack array without heap allocation; returns TransformOriginError instead of panicking on malformed transform-origin input. No new dependencies, no build script, no unsafe, no I/O. Published from github:linebender/resvg."

[[audits.syn]]
