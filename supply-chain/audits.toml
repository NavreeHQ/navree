[[audits.sqlx-core]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.9.0 -> 0.9.1"
notes = "Diff read. TLS is split into a connector built once per connect options and a handshake that takes the host name each time; the choice of verifier (WebPKI with the roots, or the ones that pass over certificate or name checks when the options ask) is the same code as before, and the name is still checked on every handshake. connect_tcp takes IP literals without brackets and sets TCP_NODELAY; RustlsSocket::poll_flush only writes pending records; the pool's idle counter can no longer wrap; a .sql file in a migrations folder whose name is not <version>_<description>.sql is an error unless sqlx.toml says warn or ignore; AnyConnection::close_hard closes hard; [u8; N] works in Any. sha2 0.11, time 0.3.48, an opt-in aws-lc-rs feature. No unsafe, no build script; the files read are the certificate files and the migrations folder, as before. Published by abonander, as 0.9.0 was."

[[audits.sqlx-macros]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.9.0 -> 0.9.1"
notes = "Diff read. The version, the pins on sqlx-core and sqlx-macros-core and one forwarding feature; no source change. Published by abonander, as 0.9.0 was."

[[audits.sqlx-macros-core]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.9.0 -> 0.9.1"
notes = "Diff read. The query macros look for .env files only from the manifest folder up to the workspace root, which they learn by running cargo metadata --no-deps (the cargo of the build; an existing call, now made on the first expansion in every crate); an unreadable .env is passed over when a database URL or SQLX_OFFLINE is already set. The environment variables read are the same, nothing is written, and the describe connection sets plan_cache_mode through sqlx-postgres. The type derives keep integer reprs only and refuse repr(C) alone on an enum. sha2 0.11 without default features. No unsafe, no build script. Published by abonander, as 0.9.0 was."

[[audits.sqlx-mysql]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.9.0 -> 0.9.1"
notes = "Diff read. The connect-time SET quotes and escapes charset, collation and time zone, which closes an SQL injection through those URL parameters; packet decoding checks lengths before every read (handshake, length-encoded strings, EOF and ERR packets, binary and text rows), refuses more than 4096 columns and packets over 1 GiB, and returns errors where it panicked; authentication uses the nonce of an AuthSwitchRequest and sends an empty response for an empty password. TLS: the options move into SslOptions with a cached connector that every setter clears, tls-sni-servername is opt-in, and each ssl-mode checks what it checked before. No unsafe, no build script, no new I/O. Published by abonander, as 0.9.0 was."

[[audits.sqlx-postgres]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.9.0 -> 0.9.1"
notes = "Diff read. hostaddr (the URL parameter and PGHOSTADDR) is the address connected to while host stays the name for TLS and pgpass, where it used to stand in for the host; whoami is used with its std feature, so the default user is the operating system's login name again; the TLS options move into SslOptions with a cached connector that every setter clears, and each sslmode checks what it checked before. A stale cached plan is closed and the statement sent once more outside a transaction; a cancelled BEGIN leaves a rollback queued; statements go unnamed when the cache is off; PgListener reconnects on any I/O error; date, time and array decoding return errors where they panicked or wrapped. No unsafe, no build script; the pgpass and SASL code is unchanged. Published by abonander, as 0.9.0 was."

[[audits.sqlx-sqlite]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.9.0 -> 0.9.1"
notes = "Diff read. Allows libsqlite3-sys below 0.41. The worker keeps its transaction depth in step with SQLite after SQLite rolls back by itself, and takes an opt-in thread stack size; column_nullable no longer builds a CStr from a null declared type (the one change inside unsafe); rows_affected is 0 for read-only statements; [u8; N] can be bound and read; time and chrono decoding return errors where they panicked. No build script, no new I/O. Published by abonander, as 0.9.0 was."

[[audits.svgtypes]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.16.1 -> 0.16.2"
notes = "Diff reviewed. Adds hwb() color parsing, angle units on hsl() and hsla() hues and slash alpha separators; matches CSS Syntax Level 3 non-ASCII identifier code points; parses PaintOrder into a stack array without heap allocation; returns TransformOriginError instead of panicking on malformed transform-origin input. No new dependencies, no build script, no unsafe, no I/O. Published from github:linebender/resvg."

[[audits.syn]]
