[[audits.notify]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "8.2.1 -> 8.2.2"
notes = "Diff reviewed. Bumps MSRV to 1.88 and inlines format arguments. On Windows, adds an AtomicBool stopping flag on WatchState and ReadData so queued ReadDirectoryChangesW completions do not rearm a stopped watch, closes directory and semaphore handles only after waiting for completion when CancelIo succeeds (leaking the handle if CancelIo fails rather than closing under an in-flight APC), and signals the completion semaphore before sending Action::Stop on Drop. Unsafe Win32 calls are bounded to watch teardown and tests. Same publisher as 8.2.1."

