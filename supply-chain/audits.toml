[[audits.css-inline]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.23.1 -> 0.25.0"
notes = "Diff read. Three new options that change nothing by default: remove_unused_at_rules, media_type (a matching top-level @media is inlined) and keep_classes; fragment inlining refuses keep_at_rules; :has() selectors are parsed and matched; with keep_at_rules and no style-tag inlining, rules from extra CSS and linked sheets are inlined. Element is Copy for selectors 0.43. The new code works on strings and the parsed document only: nothing new fetches a URL or reads a file, and the one fetch path stays behind load_remote_stylesheets. The new command-line flags are in the binary, behind the cli feature. No unsafe, no build script. Published by Stranger6667, as 0.23.1 was."

[[audits.email-encoding]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.4.2 -> 0.4.3"
notes = "Diff reviewed. Body encoding no longer picks 7bit or 8bit for input with a NUL, or a CR or LF outside a CRLF (a bare LF in a str is still taken as a line ending), so such bytes go out as quoted-printable or base64. RFC 2231 parameter encoding writes at least one character per line, so a 62-character key can no longer stall it or underflow. Header folding never leaves a line of white space only. Tests added. No new dependencies, no build script, no unsafe (forbid(unsafe_code)), no I/O. Published from github:lettre/email-encoding."

[[audits.fast_image_resize]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "6.1.0 -> 6.2.0"
notes = "Diff read. check_crop_box adds left to width and top to height with checked_add, so a crop box that wrapped in a release build is refused before the unchecked row slicing it guards; Coefficients keeps the lowest bound start and the highest bound end, and Resizer sizes and offsets its temporary image from them, not from the first and last bound; u8x2 divide_alpha_inplace no longer makes a shared slice over the row it writes to. The new SIMD128 convolution and alpha code is compiled for wasm32 only and keeps the bounds of the SSE4.1 code beside it. The rayon feature no longer turns on image; cpufeatures 0.3.1. No build script, no I/O. Published by Cykooz, as 6.1.0 was."

