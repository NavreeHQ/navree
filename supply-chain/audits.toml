[[audits.notify]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "8.2.1 -> 8.2.2"
notes = "Diff reviewed. Bumps MSRV to 1.88 and inlines format arguments. On Windows, adds an AtomicBool stopping flag on WatchState and ReadData so queued ReadDirectoryChangesW completions do not rearm a stopped watch, closes directory and semaphore handles only after waiting for completion when CancelIo succeeds (leaking the handle if CancelIo fails rather than closing under an in-flight APC), and signals the completion semaphore before sending Action::Stop on Drop. Unsafe Win32 calls are bounded to watch teardown and tests. Same publisher as 8.2.1."

[[audits.notify]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "8.2.2 -> 9.0.0"
notes = "Diff read. A new build.rs prints a cfg for FreeBSD's inotify: on a native FreeBSD build only, it runs /bin/freebsd-version -u (fixed path and argument, no shell) to learn the release; for every other target it prints three cargo lines and returns. inotify walks directories itself (symlink loops are found by device and inode), keeps several paths per watch descriptor and filters by Config::event_kinds; kqueue refuses FIFOs, sockets and devices and reports descriptor limits as MaxFilesWatch; FSEvents rebuilds its stream only when the watched roots change, resumes from the last event id, catches panics in its callback, no longer purges the volume's event history and holds roots to a twelfth of RLIMIT_NOFILE; Windows keeps the request and a 64 KiB buffer in one allocation handed to the kernel and taken back once, decodes change records with bounds checks where it trusted the kernel's offsets, waits for an unwatch to finish, and looks up ReadDirectoryChangesExW in the loaded kernel32 by fixed names when extended information is asked for. PollWatcher hashes file contents with xxh3 (new dependency xxhash-rust) in 8 KiB reads. update_paths replaces paths_mut, Config is no longer Copy, ErrorKind is non_exhaustive. No network use; about two thirds of the added lines are tests. Published by JohnTitor, as 8.2.2 was."

