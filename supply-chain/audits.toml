[[audits.sqlparser]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.63.0 -> 0.64.0"
notes = "Diff reviewed. Bumps sqlparser_derive to 0.7.0; memoizes failed speculative POSITION(... IN ...) and IN (subquery) parses so nested forms do not backtrack exponentially; adds ALTER TRIGGER, REFRESH MATERIALIZED VIEW, GRANT and REVOKE role statements, COPY ... FROM STDIN inline payload tokenization, tuple element access, non-decimal integer literals (0x, 0o, 0b), comment neighbor spans and dialect hooks. No new runtime dependencies, no build script, no unsafe, no I/O. Same publisher as 0.63.0."

