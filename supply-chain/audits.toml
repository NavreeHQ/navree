[[audits.read-fonts]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.46.0 -> 0.47.0"
notes = "Diff reviewed. Regenerates table byte-range helpers with saturating_add; gates Type 1 font loading behind a type1 feature and adds CID-keyed Type 1 parsing with input-bounded map and subroutine budgets; adds U32Set::next_after and next_absent_after; bounds Varc Outlines::new on malformed axis_indices lists, CFF Format0 charset and custom encoding lookups at num_glyphs, and Stack roll shift on i32::MIN; supports signed pre-initial states in legacy AAT StateTable, byte offsets in kerx Subtable2, declared valueRecordSize strides in MVAR and single-pass contextual lookup closure; renames ColorGlyphVersion and PaintCachedColorGlyph to ColorVersion and PaintCached. No new dependencies, no build script, no unsafe, no I/O. Same publisher as 0.46.0."

[[audits.redis]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.8.1 -> 1.8.2"
notes = "Diff reviewed. Closes synchronous Connection and resets its parser on unrecoverable reply parse errors; ignores unsolicited RESP3 SUnsubscribe pushes while awaiting non-subscription replies; tracks per-shard invalidation counts in ShardedLRU so replies invalidated in flight are not cached; wakes async cluster pending queues via poll_recv, follows hostless MOVED and ASK redirects, routes MSETEX by first key and refreshes cluster routing; rejects out-of-range integer and double conversions in FromRedisValue, converts RESP3 doubles for big-number types, accepts -1 data_received on Role::Replica and adjusts TLS feature gates. No new dependencies, no build script, no unsafe. Same publisher as 1.8.1."

[[audits.resvg]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.49.0 -> 0.50.0"
notes = "Diff reviewed. Bumps usvg to 0.50.0 and svgtypes to 0.16.2, adapts to optional Node and Group bounding boxes and DEFAULT_MAX_DEPTH, demultiplies alpha on displacement-map inputs while passing pre-scaled scale_x and scale_y, and computes pattern pixmap sx and sy scales in render_pattern_pixmap. No build script, no unsafe, no new I/O. Same publisher as 0.49.0."

[[audits.rpassword]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "7.5.4 -> 7.5.5"
notes = "Diff reviewed. Extracts restore_terminal_configuration on Unix (tcsetattr) and Windows (SetConsoleMode) and calls it before raise(SIGINT) or GenerateConsoleCtrlEvent(CTRL_C_EVENT, 0) in send_signal_sigint so terminal echo and mode flags are restored when the default signal action exits before Drop. No new dependencies, no build script. Same publisher as 7.5.4."

[[audits.skrifa]]
