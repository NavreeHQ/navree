
# cargo-vet audits file

[[audits.async-nats]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.51.0 -> 0.53.0"
notes = "Diff read. Connecting: TLS is asked of every server once any TLS setting or a tls:// URL asks for it (tls_optional opts out); servers a server advertises are taken as host:port only, never from an INFO read before the TLS handshake, keep the transport and TLS they were learned on, and an IP among them is checked against the name its reporting server was checked under (verify_discovered_servers_by_ip brings back checking the IP itself); a server that offers no TLS when TLS is asked fails early; the lists in later INFO messages now replace the discovered servers (ignore_discovered_servers turns discovery off). WebSocket connections run on the client's own TCP stream and TLS handshake. Reading: a bare -ERR line, a payload length that overflows and a header value with a lone CR or LF no longer panic the connection (HeaderValue converts with TryFrom or from_lossy). Authentication code is unchanged. tokio-rustls 0.26.3. No unsafe, no build script, no new process, file or variable use. Published by Jarema, as 0.51.0 was."

[[audits.brotli]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "9.1.1 -> 9.1.3"
notes = "Diff reviewed. The encoder checks minimum copy length after fix_unbroken_len truncates a match at a custom dictionary boundary; BrotliEncoderVersion is checked at compile time against CARGO_PKG_VERSION; BrotliEncoderMallocUsize uses checked_mul before calling a custom allocator; boundary test added. No build script, no new dependencies, no I/O in changed code. Same publisher as 9.1.1."

[[audits.bytes]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.12.1 -> 1.12.2"
notes = "Diff read. try_get_int and try_get_int_le sign-extend as get_int does; Chain::chunks_vectored adds the second buffer's chunks only once the first's are all listed, so vectored writes keep their order; Bytes::truncate(0) puts an empty static Bytes in place and drops the old handle, which releases the shared buffer; Writer::write_all writes what fits and then fails with WriteZero. BytesMut: put_u8 and put_bytes fast paths; extend_from_slice and put_bytes set the length after reserve, whose postcondition bounds it; Extend<u8> fills a Vec-backed buffer through a ManuallyDrop Vec over the same allocation, taking no more items than the spare capacity, so the Vec does not reallocate (std's Vec::extend does not grow within capacity, and a debug assertion checks it). The serde floor is 1.0.70. No new dependencies, no build script, no I/O. Published by Darksonn, as 1.12.1 was."

