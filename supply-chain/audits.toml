
# cargo-vet audits file

[[audits.brotli]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "9.1.1 -> 9.1.3"
notes = "Diff reviewed. The encoder checks minimum copy length after fix_unbroken_len truncates a match at a custom dictionary boundary; BrotliEncoderVersion is checked at compile time against CARGO_PKG_VERSION; BrotliEncoderMallocUsize uses checked_mul before calling a custom allocator; boundary test added. No build script, no new dependencies, no I/O in changed code. Same publisher as 9.1.1."

[[audits.constant_time_eq]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.3.1 -> 0.6.1"
notes = "Diff reviewed. The new build.rs only prints cfg flags chosen from the rustc version, the target arch and the COUNT_INSTRUCTIONS_TEST variable (rustversion is its only build dependency). New SSE2, NEON and word-at-a-time comparisons; the inline asm only hides values from the optimizer or sets the aarch64 DIT bit, which a guard restores. Unsafe blocks are commented and bounded by length asserts. No I/O. Same publisher as 0.3.1; the repository moved to Codeberg, as CHANGES for 0.6.0 says."

[[audits.cookie]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.18.2 -> 0.18.3"
notes = "Diff reviewed. The nonce of a private cookie is filled from the operating system's generator (OsRng) instead of the thread-local one, so two processes forked from one never reuse a nonce. One line of source, a changelog entry and the version; no new dependencies, no unsafe, no build script, no I/O beyond the OS random source. Published from github:rwf2/cookie-rs."

[[audits.email-encoding]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.4.2 -> 0.4.3"
notes = "Diff reviewed. Body encoding no longer picks 7bit or 8bit for input with a NUL, or a CR or LF outside a CRLF (a bare LF in a str is still taken as a line ending), so such bytes go out as quoted-printable or base64. RFC 2231 parameter encoding writes at least one character per line, so a 62-character key can no longer stall it or underflow. Header folding never leaves a line of white space only. Tests added. No new dependencies, no build script, no unsafe (forbid(unsafe_code)), no I/O. Published from github:lettre/email-encoding."

[[audits.form_urlencoded]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.2.2 -> 1.2.3"
notes = "Diff reviewed. A start position past the end of the target is clamped to the target's length instead of panicking; the dependency floor moves to percent-encoding 2.3.2. No unsafe, no build script, no I/O. Published from github:servo/rust-url."

[[audits.harfrust]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.15.0 -> 0.16.0"
notes = "Diff reviewed. Bounds operation budgets across Buffer cluster merges, masks, lookup passes, WouldApplyContext, variation deltas and contextual or ligature rule construction; adds SyllableLookaheadMemo so Indic, Khmer and USE syllable scanners stay linear on long joiner or segment-begin runs; records syllable cuts across substitutions; caches glyph names in ShaperFont; precomputes running advance sums for mark attachment propagation; updates kern/kerx state handling and lookup deduplication in OtMapBuilder. No new dependencies, no build script, no unsafe, no I/O. Same publisher as 0.15.0."

[[audits.lettre]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.11.23 -> 0.11.24"
notes = "Diff reviewed. SMTP client: the connection is closed if bytes are already buffered after the STARTTLS reply; dot-stuffing also applies after a bare CR or LF; replies are read under a 100,000-byte cap and parsed once per line, only CRLF ending a line; a white-space EHLO line no longer panics; DATA and message replies must have the expected class. A quoted local part is kept as written and addresses reject non-ASCII white space. Debug hides DKIM keys and AUTH credentials. No new dependencies or build script, forbid(unsafe_code), I/O only on the SMTP socket. Published from github:lettre/lettre."

[[audits.libsqlite3-sys]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.37.0 -> 0.40.0"
notes = "Diff read. The bundled SQLite goes from 3.51.3 to 3.54.1: sqlite3.c, sqlite3.h and sqlite3ext.h are byte for byte the 3.54.1 amalgamation published by sqlite.org (SHA-256 compared), taken as SQLite's own release and not read line by line. The pregenerated bindings are bindgen 0.73 output for it and for SQLite 3.45.3, the oldest system SQLite now accepted: extern declarations, constants, and the call-through wrappers of the loadable_extension feature. build.rs takes the SQLCipher source from the optional sqlcipher-src crate (feature bundled-sqlcipher only, not in this tree) in place of a copy in the crate, no longer sets SQLITE_ENABLE_MEMORY_MANAGEMENT, prints rerun-if-env-changed for the variables it reads, and marks env::set_var of PKG_CONFIG_PATH unsafe for edition 2024; what it runs is unchanged (the C compiler through cc, pkg-config or vcpkg for a system SQLite) and it fetches nothing. src changes one import order. Published by gwenn, as 0.37.0 was."

[[audits.mongodb]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "3.10.0 -> 3.10.1"
notes = "Diff reviewed. Bumps mongodb-internal-macros to 3.10.1, replaces derive_where(Debug) with manual Debug impls on Client, cursors and change streams, drops Debug on internal CSFLE and OIDC state types, and redacts DataKeyOptions::key_material, OIDC CallbackContext::refresh_token and IdpServerResponse tokens, Socks5Proxy::authentication and TlsOptions::tls_certificate_key_file_password in Debug output. No build script, no unsafe, no new I/O. Same publisher as 3.10.0."

