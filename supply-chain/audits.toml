[[audits.harfrust]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.15.0 -> 0.16.0"
notes = "Diff reviewed. Bounds operation budgets across Buffer cluster merges, masks, lookup passes, WouldApplyContext, variation deltas and contextual or ligature rule construction; adds SyllableLookaheadMemo so Indic, Khmer and USE syllable scanners stay linear on long joiner or segment-begin runs; records syllable cuts across substitutions; caches glyph names in ShaperFont; precomputes running advance sums for mark attachment propagation; updates kern/kerx state handling and lookup deduplication in OtMapBuilder. No new dependencies, no build script, no unsafe, no I/O. Same publisher as 0.15.0."

[[audits.harfrust]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.16.0 -> 0.16.1"
notes = "Diff read. Follows HarfBuzz 15.2.0. AAT state machines record which glyphs can trigger an action (a walk over the reachable states, each visited once) and skip a subtable when the buffer holds none of them; kern format 0 gets a pair filter; kerx and GPOS may run together; skipped glyphs are charged one unit per 32, and the work and length budgets are raised (up to 65536 operations per glyph, a buffer up to 512 times its input); the Arabic stretch pass counts copies in i64 and caps a run at 256 glyphs; vowel constraints look across default ignorables; the USE and Arabic PUA tables are regenerated; Buffer gains push_latin1, push_utf16 and a not-found glyph. Indexes and counts taken from font data stay checked. forbid(unsafe_code), no dependency change, no build script, no I/O (font files are included by tests only). Published by dfrg, as 0.16.0 was."

[[audits.lettre]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.11.23 -> 0.11.24"
notes = "Diff reviewed. SMTP client: the connection is closed if bytes are already buffered after the STARTTLS reply; dot-stuffing also applies after a bare CR or LF; replies are read under a 100,000-byte cap and parsed once per line, only CRLF ending a line; a white-space EHLO line no longer panics; DATA and message replies must have the expected class. A quoted local part is kept as written and addresses reject non-ASCII white space. Debug hides DKIM keys and AUTH credentials. No new dependencies or build script, forbid(unsafe_code), I/O only on the SMTP socket. Published from github:lettre/lettre."

[[audits.libredox]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
version = "0.1.25"
notes = "Read in full (one source file). System-call wrappers for Redox OS over relibc's redox_* symbols: extern declarations, an owning file-descriptor type, one wrapper per call, three repr(C) structs of integers and flag constants. No build script, no statics, nothing run at load time, no I/O beyond the calls it wraps; the unsafe is FFI calls and MaybeUninit values the kernel fills. sigaction and Fd::new are safe functions that code on Redox could misuse. whoami (from sqlx-postgres) depends on it for target_os = redox only. Published by 4lDO2."

[[audits.libsqlite3-sys]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.37.0 -> 0.40.0"
notes = "Diff read. The bundled SQLite goes from 3.51.3 to 3.54.1: sqlite3.c, sqlite3.h and sqlite3ext.h are byte for byte the 3.54.1 amalgamation published by sqlite.org (SHA-256 compared), taken as SQLite's own release and not read line by line. The pregenerated bindings are bindgen 0.73 output for it and for SQLite 3.45.3, the oldest system SQLite now accepted: extern declarations, constants, and the call-through wrappers of the loadable_extension feature. build.rs takes the SQLCipher source from the optional sqlcipher-src crate (feature bundled-sqlcipher only, not in this tree) in place of a copy in the crate, no longer sets SQLITE_ENABLE_MEMORY_MANAGEMENT, prints rerun-if-env-changed for the variables it reads, and marks env::set_var of PKG_CONFIG_PATH unsafe for edition 2024; what it runs is unchanged (the C compiler through cc, pkg-config or vcpkg for a system SQLite) and it fetches nothing. src changes one import order. Published by gwenn, as 0.37.0 was."

