[[audits.regex-automata]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.4.18 -> 0.4.19"
notes = "Diff read. ByteSet::from_bytes reads its second half from the right offset and checks the length of both halves, which corrects the quit set of a DFA read from bytes; the meta engine's forward DFA search starts acceleration after the byte already consumed; the bounded backtracker is passed over at its haystack limit, where it panicked; the PikeVM ignores slots past the pattern's own; the one-pass DFA takes its scratch path for a single pattern. meta::Regex::is_match_with is new, the default pool capacity is the constant 8 again, and Span::offset panics on overflow. No limit on size, nesting or states changes and no unsafe line changes. No build script, no I/O. Published by BurntSushi, as 0.4.18 was."

[[audits.regex-syntax]]
