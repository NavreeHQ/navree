notes = "Diff reviewed. Removes six retired or distrusted root certificates from TLS_SERVER_ROOTS (DigiCert Trusted Root G4, QuoVadis Root CA 3 G3, QuoVadis Root CA 1 G3, Buypass Class 2 Root CA, Certigna Root CA and Buypass Class 3 Root CA); no other source changes, no build script, no unsafe, no I/O. Same publisher as 1.0.11."

[[audits.zeroize]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.9.1 -> 1.9.2"
notes = "Diff read. Slices of DefaultIsZeroes types, MaybeUninit slices, the spare bytes of an Option and zeroize_flat_type go through a new bulk module: on targets with inline assembly (x86, x86_64, arm, aarch64, riscv, loongarch64, s390x) a plain fill or write_bytes followed by the existing assembly barrier, which the compiler must take to read the memory; on every other target volatile writes, in chunks. Scalars, arrays and the element-wise paths still use write_volatile. On targets without inline assembly optimization_barrier is black_box alone. zeroize_bytes is new. The unsafe blocks state their conditions and meet them (a pointer from a live &mut, lengths in bytes, chunk casts inside the slice). No new dependencies but a dev-only bench, no build script, no I/O. Published from github:RustCrypto/utils."

