[[audits.url]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "2.5.8 -> 2.5.9"
notes = "Diff reviewed. A blob: URL takes the origin of its inner URL only when that URL is http, https or file, so a nested blob: URL no longer recurses; the percent-encode sets and file-host handling follow the URL Standard; removing a path segment searches the path only, so a long run of double-dot segments is no longer quadratic. Tests and test data added. No new dependencies, no unsafe, no build script, no I/O. Published from github:servo/rust-url."

[[audits.usvg]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.49.0 -> 0.50.0"
notes = "Diff reviewed. Bumps svgtypes to 0.16.2, skrifa to 0.49.0 and harfrust to 0.15.0; adds Options::max_depth (1024 by default) and general cycle detection for SVG resource references; computes Group and Path bounding boxes lazily through OnceLock; drops the parsed roxmltree::Document before tree conversion; adds FontCache reusing loaded skrifa fonts and harfrust shape plans; supports the inline path attribute on textPath. No build script, no unsafe, no new I/O. Same publisher as 0.49.0."

