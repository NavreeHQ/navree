[[audits.zip]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "9.5.0 -> 9.7.0"
notes = "Diff reviewed. Widens the BSD and macOS nix dependency range to >=0.30.0, <0.33.0; hardens archive extraction to reject symlinked destination or ancestor directories inside the target root and opens non-symlink paths with O_NOFOLLOW (and O_DIRECTORY on directories) before setting permissions on Unix; seeks to the central directory start in ZipWriter::new_append_with_config; preserves encryption and data-descriptor flags, raw comments and ExtendedTimestamp or Ntfs extra fields across raw copies; exposes safe fixed-header parse helpers. Published from github:zip-rs/zip2."

[[audits.zip]]
who = "Amritpal Singh <boparaiamrit@gmail.com>"
criteria = "safe-to-deploy"
delta = "9.7.0 -> 9.8.2"
notes = "Diff read. Extraction is rewritten to stay under the destination: on Unix every directory on the way is opened from its parent with openat and O_NOFOLLOW, files are created with openat, O_NOFOLLOW and mode 0600 and must be regular files with one link, symlinks are made with symlinkat, modes are set through the open descriptor (the path-based chmod fallback is gone), and a partial file is removed only when its device and inode match; on Windows the directories are held open, reparse points other than a list of cloud and deduplication tags are refused, and leaves are deleted by handle. The checks 9.7.0 made on .., absolute targets and symlink hops all remain. Directories already on the way are made owner-writable. Reading refuses a multi-disk end record and bounds the entry count by the directory size; writing sums extra-field lengths with checked arithmetic. The unsafe is libc and Win32 calls with checked results. The windows-sys range now starts at 0.60 and zstd-rs is an opt-in feature; no new crates, no build script; only test code starts a process. Published from github:zip-rs/zip2."

