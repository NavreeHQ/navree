# A ratchet for the data-layer move. Navree's own ORM (navree-orm, with
# navree-schema for migrations) is replacing sea_orm crate by crate. The crates
# listed in `paths.exclude` below still use sea_orm; every other crate and app
# must not start. When a crate is moved, delete it from the list in the same
# change, so it can never go back. Nothing is added to the list: a new
# dependency on sea_orm in a new crate is the thing this rule stops, and a
# crate that has to start using it again needs a reason in review.
#
# Two rules, one for source (a `use`, a path such as `sea_orm::DbBackend`, a
# `#[sea_orm(..)]` attribute) and one for the Cargo.toml dependency itself.
# Comments and doc text that merely mention the name are not matched.
rules:
  - id: navree-sea-orm-ratchet
    languages: [rust]
    severity: ERROR
    message: >-
      sea_orm is being replaced by navree-orm. This crate does not use it yet;
      use navree-orm (and navree-schema for migrations) instead. Crates still
      on sea_orm are listed in .semgrep/sea-orm-ratchet.yml; moved crates are
      removed from that list, never added to it.
    metadata:
      category: maintainability
      confidence: HIGH
    paths:
      exclude:
        # The crates that still use sea_orm. Remove an entry when its crate is moved.
        # evidence-app is moved; `Project` keeps its SeaORM derive for the
        # admin panel's resource until navree-helm runs on models.
        - "/apps/evidence-app/src/modules/projects/entity.rs"
        - "/bench/"
        - "/crates/navree/"
        # navree-access is moved; its SeaORM compatibility shim (SeaORM
        # entities as subjects, `Accessible::apply` on a SeaORM select) stays
        # until the crates using it are moved (data-layer move, step 8).
        - "/crates/navree-access/src/sea_compat.rs"
        - "/crates/navree-db/"
        - "/crates/navree-graphql/"
        - "/crates/navree-grpc/"
        - "/crates/navree-mcp/"
        # navree-micro is moved; its tests keep one SeaORM fixture (the `deals`
        # entity, a subject through navree-access's SeaORM shim) until step 8.
        - "/crates/navree-micro/tests/micro/support.rs"
        - "/crates/navree-orm/"
        - "/crates/navree-schema/"
        - "/crates/navree-cli/"
        # navree-workspace is moved; its SeaORM compatibility layer (the
        # `sea_compat` repository and registrations the conformity checks
        # name) stays until step 8. The conformity scanner's tests read SeaORM
        # entity sources as text.
        - "/crates/navree-workspace/src/sea_compat.rs"
        - "/crates/navree-workspace/src/conformity/source.rs"
    pattern-regex: '(?m)^(?!\s*//)[^\n"]*?(?:\bsea_orm(?:_migration)?\s*::|#\[\s*sea_orm\s*[(\]])'

  - id: navree-sea-orm-dependency-ratchet
    languages: [generic]
    severity: ERROR
    message: >-
      sea-orm is being replaced by navree-orm; this crate must not depend on
      it. See .semgrep/sea-orm-ratchet.yml.
    metadata:
      category: maintainability
      confidence: HIGH
    paths:
      include:
        - "**/Cargo.toml"
      exclude:
        - "/Cargo.toml"
        # evidence-app: sea-orm for `Project`'s compatibility derive (the
        # admin panel), until navree-helm runs on models.
        - "/apps/evidence-app/Cargo.toml"
        - "/bench/"
        - "/crates/navree/"
        - "/crates/navree-db/"
        - "/crates/navree-graphql/"
        - "/crates/navree-grpc/"
        - "/crates/navree-mcp/"
        # navree-micro: a dev-dependency for that fixture (navree-access's shim, step 8).
        - "/crates/navree-micro/Cargo.toml"
        - "/crates/navree-orm/"
        - "/crates/navree-schema/"
        # navree-workspace: sea-orm for its compatibility layer, until step 8.
        - "/crates/navree-workspace/Cargo.toml"
    pattern-regex: '(?m)^\s*sea-orm(?:-migration)?\s*(?:=|\.)'
