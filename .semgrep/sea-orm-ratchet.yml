# A ratchet for the data-layer port. Navree's own ORM (navree-orm, with
# navree-schema for migrations) is replacing sea_orm crate by crate. The crates
# listed in `paths.exclude` below still use sea_orm; every other crate and app
# must not start. When a crate is ported, delete it from the list in the same
# change, so it can never go back. Nothing is added to the list: a new
# dependency on sea_orm in a new crate is the thing this rule stops, and a
# crate that has to start using it again needs a reason in review.
#
# Two rules, one for source (a `use`, a path such as `sea_orm::DbBackend`, a
# `#[sea_orm(..)]` attribute) and one for the Cargo.toml dependency itself.
# Comments and doc text that merely mention the name are not matched.
rules:
  - id: navree-sea-orm-ratchet
    languages: [rust]
    severity: ERROR
    message: >-
      sea_orm is being replaced by navree-orm. This crate does not use it yet;
      use navree-orm (and navree-schema for migrations) instead. Crates still
      on sea_orm are listed in .semgrep/sea-orm-ratchet.yml; ported crates are
      removed from that list, never added to it.
    metadata:
      category: maintainability
      confidence: HIGH
    paths:
      exclude:
        # The crates that still use sea_orm. Remove an entry when its crate is ported.
        - "/apps/evidence-app/"
        - "/bench/"
        - "/crates/navree/"
        # navree-access is ported; its SeaORM compatibility shim (SeaORM
        # entities as subjects, `Accessible::apply` on a SeaORM select) stays
        # until the crates using it are ported (data-layer port, step 8).
        - "/crates/navree-access/src/sea_compat.rs"
        # navree-auth is ported; `User` keeps its SeaORM derive (the
        # compatibility layer for the crates not yet on navree-orm: the
        # admin resources over `user::Entity` in navree-helm's tests, the CLI kit and
        # evidence-app, and navree-auth's own subject test) until step 8. navree-social
        # and navree-sso are on the `User` model and no longer need it.
        - "/crates/navree-auth/src/entity/user.rs"
        - "/crates/navree-db/"
        - "/crates/navree-graphql/"
        - "/crates/navree-grpc/"
        - "/crates/navree-helm/"
        - "/crates/navree-i18n/"
        - "/crates/navree-lighthouse/"
        - "/crates/navree-mcp/"
        # navree-micro is ported; its tests keep one SeaORM fixture (the `deals`
        # entity, a subject through navree-access's SeaORM shim) until step 8.
        - "/crates/navree-micro/tests/micro/support.rs"
        - "/crates/navree-orm/"
        - "/crates/navree-schema/"
        - "/crates/navree-search/"
        - "/crates/navree-sheets/"
        - "/crates/navree-webhooks/"
        - "/crates/navree-workflows/"
        - "/crates/navree-cli/"
        - "/crates/navree-directory/"
        - "/crates/navree-domains/"
        - "/crates/navree-integrations/"
        - "/crates/navree-macros/"
        # navree-workspace is ported; its SeaORM compatibility layer (the
        # `sea_compat` repositories and registrations, the SeaORM derive kept
        # on three models and on `LibraryScope`) stays until the crates
        # using it are ported (step 8). The conformity scanner's tests read
        # SeaORM entity sources as text.
        - "/crates/navree-workspace/src/sea_compat.rs"
        - "/crates/navree-workspace/src/entity.rs"
        - "/crates/navree-workspace/src/library/mod.rs"
        - "/crates/navree-workspace/src/conformity/source.rs"
    pattern-regex: '(?m)^(?!\s*//)[^\n"]*?(?:\bsea_orm(?:_migration)?\s*::|#\[\s*sea_orm\s*[(\]])'

  - id: navree-sea-orm-dependency-ratchet
    languages: [generic]
    severity: ERROR
    message: >-
      sea-orm is being replaced by navree-orm; this crate must not depend on
      it. See .semgrep/sea-orm-ratchet.yml.
    metadata:
      category: maintainability
      confidence: HIGH
    paths:
      include:
        - "**/Cargo.toml"
      exclude:
        - "/Cargo.toml"
        - "/apps/evidence-app/"
        - "/bench/"
        - "/crates/navree/"
        # navree-auth: sea-orm for `User`'s compatibility derive, until step 8.
        - "/crates/navree-auth/Cargo.toml"
        - "/crates/navree-db/"
        - "/crates/navree-graphql/"
        - "/crates/navree-grpc/"
        - "/crates/navree-helm/"
        - "/crates/navree-i18n/"
        - "/crates/navree-lighthouse/"
        - "/crates/navree-mcp/"
        # navree-micro: a dev-dependency for that fixture (navree-access's shim, step 8).
        - "/crates/navree-micro/Cargo.toml"
        - "/crates/navree-orm/"
        - "/crates/navree-schema/"
        - "/crates/navree-search/"
        - "/crates/navree-sheets/"
        - "/crates/navree-webhooks/"
        - "/crates/navree-workflows/"
        # navree-workspace: sea-orm for its compatibility layer, until step 8.
        - "/crates/navree-workspace/Cargo.toml"
    pattern-regex: '(?m)^\s*sea-orm(?:-migration)?\s*(?:=|\.)'
