# Logs outlive the request, travel to third-party aggregators and are read by
# far more people than the database is. A password, token, API key, cookie or
# private key written to a tracing event is a leak, even at debug level, because
# debug is what gets switched on during an incident.
#
# The rule flags tracing and log macros (trace!, debug!, info!, warn!, error!,
# event!) that record a value under a secret-looking field name
# (`info!(token = %t, ..)`, `info!(%password, ..)`), or pass a secret-looking
# value as a formatting argument (`warn!("rejected {}", self.api_key)`) or an
# inline capture (`info!("signed in with {token}")`).
# Names are matched as whole words or `_`-suffixes (`token`, `reset_token`,
# `api_key`), so `token_count` and `tokens` do not match.
#
# Log an identifier instead (the user id, the key's id or fingerprint), or wrap
# the value in navree_contracts::Secret, which prints a placeholder. When the
# value is not a secret (for example, the name of a token *type*), suppress the
# line with `// nosemgrep: navree-secret-in-log` and the reason.
rules:
  - id: navree-secret-in-log
    languages: [rust]
    severity: ERROR
    message: >-
      A secret-looking value (password, token, key, cookie, credential) is
      written to a log event. Log an identifier or a redacted placeholder
      instead.
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      confidence: MEDIUM
    paths:
      exclude:
        - "**/tests/**"
        - "**/benches/**"
        - "**/examples/**"
    pattern-either:
      # Field before the message: info!(token = %t, ..), info!(%password, ..),
      # info!(?reset_token, ..). Fields come before the message literal, so the
      # scan stops at the first string.
      - pattern-regex: '(?is)\b(?:tracing::)?(?:trace|debug|info|warn|error|event)!\s*\((?:[^;"]*?[,(]\s*)?(?:%|\?)?\s*(?:[a-z][a-z0-9_]*_)?(?:password|passwd|secret|token|api_?key|private_key|authorization|credentials?|cookie|bearer|jwt|otp)\s*(?:=(?!=)|,|\))'
      # Secret passed as a formatting argument: warn!("rejected {}", self.api_key)
      - pattern-regex: '(?is)\b(?:tracing::)?(?:trace|debug|info|warn|error|event)!\s*\(\s*"(?:[^"\\]|\\.)*"\s*,[^;"]*?\b(?:[a-z_][a-z0-9_]*\.)*(?:[a-z][a-z0-9_]*_)?(?:password|passwd|secret|token|api_?key|private_key|authorization|credentials?|cookie|bearer|jwt|otp)\s*[,)]'
      # Secret captured inline in the message: info!("signed in with {token}")
      - pattern-regex: '(?is)\b(?:tracing::)?(?:trace|debug|info|warn|error|event)!\s*\(\s*"(?:[^"\\]|\\.)*\{(?:[a-z][a-z0-9_]*_)?(?:password|passwd|secret|token|api_?key|private_key|authorization|credentials?|cookie|bearer|jwt|otp)(?::[^}"]*)?\}'
